version: '3.8'

services:
  # 백엔드 애플리케이션
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: your_program_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/your_program
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key}
    depends_on:
      - db
      - redis
    networks:
      - app-network
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL 데이터베이스
  db:
    image: postgres:15-alpine
    container_name: your_program_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=your_program
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 캐시
  redis:
    image: redis:7-alpine
    container_name: your_program_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx 리버스 프록시
  nginx:
    image: nginx:alpine
    container_name: your_program_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./static:/var/www/static
    depends_on:
      - app
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana 모니터링
  grafana:
    image: grafana/grafana:latest
    container_name: your_program_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3001:3000"
    networks:
      - app-network

  # Prometheus 모니터링
  prometheus:
    image: prom/prometheus:latest
    container_name: your_program_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - app-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # 개발 환경용 서비스
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-builder
    container_name: your_program_app_dev
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/your_program_dev
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis
    networks:
      - app-network
    volumes:
      - .:/app
      - ./logs:/app/logs
    profiles:
      - dev

  # 프론트엔드 개발 서버
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: your_program_frontend_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - app-network
    profiles:
      - dev

  # 테스트 환경용 서비스
  app-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-builder
    container_name: your_program_app_test
    restart: "no"
    environment:
      - FLASK_ENV=testing
      - DATABASE_URL=postgresql://postgres:postgres@db-test:5432/your_program_test
      - REDIS_URL=redis://redis-test:6379/2
    depends_on:
      - db-test
      - redis-test
    networks:
      - app-network
    profiles:
      - test
    command: ["pytest", "tests/"]

  db-test:
    image: postgres:15-alpine
    container_name: your_program_db_test
    restart: "no"
    environment:
      - POSTGRES_DB=your_program_test
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - app-network
    profiles:
      - test

  redis-test:
    image: redis:7-alpine
    container_name: your_program_redis_test
    restart: "no"
    networks:
      - app-network
    profiles:
      - test

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  app-network:
    driver: bridge 
