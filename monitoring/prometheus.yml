global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "sync_rules.yml"

scrape_configs:
  # 애플리케이션 메트릭
  - job_name: 'sync-app'
    static_configs:
      - targets: ['app:5000']
    metrics_path: '/metrics/prometheus'
    scrape_interval: 10s

  # 데이터베이스 메트릭
  - job_name: 'postgres'
    static_configs:
      - targets: ['db:5432']
    scrape_interval: 30s

  # Redis 메트릭
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # Outbox 워커 메트릭
  - job_name: 'outbox-worker'
    static_configs:
      - targets: ['outbox-worker:5000']
    metrics_path: '/metrics/prometheus'
    scrape_interval: 10s

  # Prometheus 자체 메트릭
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']