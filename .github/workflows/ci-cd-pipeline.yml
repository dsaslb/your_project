name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '18'

jobs:
  # 코드 품질 검사
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy pylint bandit safety
        
    - name: Run Flake8 (코드 스타일 검사)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
        
    - name: Run Black (코드 포맷팅 검사)
      run: |
        black --check --diff .
        
    - name: Run isort (import 정렬 검사)
      run: |
        isort --check-only --diff .
        
    - name: Run MyPy (타입 검사)
      run: |
        mypy --ignore-missing-imports --no-strict-optional .
        
    - name: Run Pylint (코드 품질 검사)
      run: |
        pylint --disable=C0114,C0116,C0115 **/*.py || true
        
    - name: Run Bandit (보안 검사)
      run: |
        bandit -r . -f json -o bandit-report.json || true
        
    - name: Run Safety (의존성 보안 검사)
      run: |
        safety check --json --output safety-report.json || true
        
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  # 백엔드 테스트
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-mock pytest-asyncio
        
    - name: Set up environment variables
      run: |
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db" >> $GITHUB_ENV
        echo "FLASK_ENV=testing" >> $GITHUB_ENV
        echo "SECRET_KEY=test-secret-key" >> $GITHUB_ENV
        
    - name: Run database migrations
      run: |
        python -m alembic upgrade head
        
    - name: Run backend tests
      run: |
        pytest tests/ --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing
        
    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-reports
        path: |
          htmlcov/
          coverage.xml

  # 프론트엔드 테스트
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci
      
    - name: Run linting
      working-directory: frontend
      run: |
        npm run lint
        npm run type-check
        
    - name: Run frontend tests
      working-directory: frontend
      run: |
        npm run test -- --coverage --watchAll=false
        
    - name: Upload frontend coverage
      uses: actions/upload-artifact@v3
      with:
        name: frontend-coverage
        path: frontend/coverage/

  # 통합 테스트
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-playwright
        cd frontend && npm ci
        
    - name: Set up environment variables
      run: |
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db" >> $GITHUB_ENV
        echo "FLASK_ENV=testing" >> $GITHUB_ENV
        
    - name: Install Playwright browsers
      run: |
        playwright install --with-deps
        
    - name: Start backend server
      run: |
        python app.py &
        sleep 10
        
    - name: Start frontend server
      working-directory: frontend
      run: |
        npm run build
        npm run start &
        sleep 10
        
    - name: Run integration tests
      run: |
        pytest tests/integration/ --verbose
        
    - name: Run E2E tests
      run: |
        playwright test

  # 빌드 및 아티팩트 생성
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [code-quality, backend-test, frontend-test, integration-test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        cd frontend && npm ci
        
    - name: Build frontend
      working-directory: frontend
      run: |
        npm run build
        
    - name: Create deployment package
      run: |
        mkdir -p deployment
        cp -r . deployment/
        cd deployment
        rm -rf .git node_modules frontend/node_modules
        tar -czf ../your_program.tar.gz .
        
    - name: Upload deployment package
      uses: actions/upload-artifact@v3
      with:
        name: deployment-package
        path: your_program.tar.gz

  # 보안 스캔
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # 배포 (개발 환경)
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop'
    environment: development
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download deployment package
      uses: actions/download-artifact@v3
      with:
        name: deployment-package
        
    - name: Deploy to development server
      run: |
        echo "Deploying to development environment..."
        # 실제 배포 스크립트는 환경에 따라 다름
        # 예: rsync, scp, docker push 등
        
    - name: Run health check
      run: |
        echo "Running health check..."
        # 배포 후 헬스 체크
        sleep 30
        curl -f http://dev-server/health || exit 1

  # 배포 (프로덕션 환경)
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download deployment package
      uses: actions/download-artifact@v3
      with:
        name: deployment-package
        
    - name: Deploy to production server
      run: |
        echo "Deploying to production environment..."
        # 실제 배포 스크립트는 환경에 따라 다름
        
    - name: Run health check
      run: |
        echo "Running health check..."
        sleep 30
        curl -f https://prod-server/health || exit 1
        
    - name: Notify deployment success
      run: |
        echo "Production deployment completed successfully!"
        # 슬랙, 이메일 등으로 알림 전송

  # 성능 테스트
  performance-test:
    name: Performance Test
    runs-on: ubuntu-latest
    needs: [deploy-dev]
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install performance testing tools
      run: |
        python -m pip install --upgrade pip
        pip install locust k6
        
    - name: Run performance tests
      run: |
        echo "Running performance tests..."
        # Locust나 k6를 사용한 성능 테스트
        
    - name: Generate performance report
      run: |
        echo "Generating performance report..."
        # 성능 테스트 결과 리포트 생성
        
    - name: Upload performance report
      uses: actions/upload-artifact@v3
      with:
        name: performance-report
        path: performance-results/

  # 알림 및 리포팅
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [code-quality, backend-test, frontend-test, integration-test, build, security-scan]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Generate test summary
      run: |
        echo "## Test Summary" >> test-summary.md
        echo "- Code Quality: ${{ needs.code-quality.result }}" >> test-summary.md
        echo "- Backend Tests: ${{ needs.backend-test.result }}" >> test-summary.md
        echo "- Frontend Tests: ${{ needs.frontend-test.result }}" >> test-summary.md
        echo "- Integration Tests: ${{ needs.integration-test.result }}" >> test-summary.md
        echo "- Build: ${{ needs.build.result }}" >> test-summary.md
        echo "- Security Scan: ${{ needs.security-scan.result }}" >> test-summary.md
        
    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('test-summary.md', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          }); 
