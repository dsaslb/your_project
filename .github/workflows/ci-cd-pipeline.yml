name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'alembic/**'
      - 'tests/**'
      - '.github/workflows/ci-cd-pipeline.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'alembic/**'
      - 'tests/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  POSTGRES_VERSION: '15'
  REDIS_VERSION: '7-alpine'

jobs:
  # 백엔드 코드 품질 검사 (개선됨)
  backend-code-quality:
    name: Backend Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy pylint bandit safety pre-commit
        
    - name: Run pre-commit hooks
      run: |
        pre-commit run --all-files || true
        
    - name: Run Flake8 (코드 스타일 검사)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --max-line-length=120
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
        
    - name: Run Black (코드 포맷팅 검사)
      run: |
        black --check --diff . --line-length=120
        
    - name: Run isort (import 정렬 검사)
      run: |
        isort --check-only --diff . --profile=black
        
    - name: Run MyPy (타입 검사)
      run: |
        mypy --ignore-missing-imports --no-strict-optional --disallow-untyped-defs --disallow-incomplete-defs .
        
    - name: Run Pylint (코드 품질 검사)
      run: |
        pylint --disable=C0114,C0116,C0115,R0903,C0103 --max-line-length=120 **/*.py || true
        
    - name: Run Bandit (보안 검사)
      run: |
        bandit -r . -f json -o bandit-report.json -ll || true
        
    - name: Run Safety (의존성 보안 검사)
      run: |
        safety check --json --output safety-report.json || true
        
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
        retention-days: 30

  # 백엔드 단위 테스트 (개선됨)
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-mock pytest-asyncio pytest-xdist pytest-html
        
    - name: Run unit tests with coverage
      run: |
        pytest tests/unit/ --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing --cov-fail-under=80 -n auto
        
    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-reports-${{ matrix.python-version }}
        path: |
          htmlcov/
          coverage.xml
        retention-days: 30

  # 백엔드 통합 테스트 (개선됨)
  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
          
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client redis-tools
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-mock pytest-asyncio pytest-xdist
        
    - name: Set up environment variables
      run: |
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db" >> $GITHUB_ENV
        echo "REDIS_URL=redis://localhost:6379/0" >> $GITHUB_ENV
        echo "FLASK_ENV=testing" >> $GITHUB_ENV
        echo "SECRET_KEY=test-secret-key-$(openssl rand -hex 32)" >> $GITHUB_ENV
        echo "JWT_SECRET_KEY=test-jwt-secret-$(openssl rand -hex 32)" >> $GITHUB_ENV
        
    - name: Wait for services
      run: |
        echo "Waiting for PostgreSQL..."
        until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done
        echo "Waiting for Redis..."
        until redis-cli ping; do sleep 1; done
        
    - name: Run database migrations
      run: |
        python -m alembic upgrade head
        
    - name: Run integration tests
      run: |
        pytest tests/integration/ --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing -v --tb=short
        
    - name: Upload integration test results
      uses: actions/upload-artifact@v3
      with:
        name: integration-test-results
        path: |
          htmlcov/
          coverage.xml
        retention-days: 30

  # 백엔드 API 테스트 (새로 추가)
  backend-api-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx
        
    - name: Set up environment variables
      run: |
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db" >> $GITHUB_ENV
        echo "FLASK_ENV=testing" >> $GITHUB_ENV
        echo "SECRET_KEY=test-secret-key-$(openssl rand -hex 32)" >> $GITHUB_ENV
        
    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done
        
    - name: Run database migrations
      run: |
        python -m alembic upgrade head
        
    - name: Start backend server
      run: |
        python app.py &
        sleep 10
        
    - name: Run API tests
      run: |
        pytest tests/api/ --verbose --tb=short
        
    - name: Test API endpoints
      run: |
        # 기본 헬스 체크
        curl -f http://localhost:5000/health || exit 1
        # API 엔드포인트 테스트
        curl -f http://localhost:5000/api/v1/status || exit 1

  # 백엔드 성능 테스트 (개선됨)
  backend-performance-tests:
    name: Backend Performance Tests
    runs-on: ubuntu-latest
    needs: [backend-integration-tests]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install performance testing tools
      run: |
        python -m pip install --upgrade pip
        pip install locust pytest-benchmark memory-profiler psutil
        
    - name: Set up environment variables
      run: |
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db" >> $GITHUB_ENV
        echo "FLASK_ENV=testing" >> $GITHUB_ENV
        
    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done
        
    - name: Run database migrations
      run: |
        python -m alembic upgrade head
        
    - name: Run performance tests
      run: |
        pytest tests/performance/ --benchmark-only --benchmark-sort=mean
        
    - name: Run load tests
      run: |
        locust -f tests/performance/locustfile.py --headless --users 10 --spawn-rate 2 --run-time 60s --html=performance-report.html
        
    - name: Upload performance reports
      uses: actions/upload-artifact@v3
      with:
        name: performance-reports
        path: |
          performance-report.html
          .pytest_cache/
        retention-days: 30

  # 백엔드 보안 스캔 (개선됨)
  backend-security-scan:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        
    - name: Run Semgrep security scan
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/owasp-top-ten
        
    - name: Upload security scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # 백엔드 빌드 및 패키징 (개선됨)
  backend-build:
    name: Backend Build & Package
    runs-on: ubuntu-latest
    needs: [backend-code-quality, backend-unit-tests, backend-integration-tests, backend-api-tests, backend-security-scan]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install build twine
        
    - name: Run database migrations check
      run: |
        python -m alembic check
        
    - name: Create deployment package
      run: |
        mkdir -p deployment/backend
        cp -r . deployment/backend/
        cd deployment/backend
        rm -rf .git tests/ .pytest_cache/ __pycache__/ *.pyc
        tar -czf ../../backend-deployment.tar.gz .
        
    - name: Create Docker image
      run: |
        docker build -t your-program-backend:${{ github.sha }} .
        docker save your-program-backend:${{ github.sha }} | gzip > backend-docker-image.tar.gz
        
    - name: Upload deployment artifacts
      uses: actions/upload-artifact@v3
      with:
        name: backend-deployment
        path: |
          backend-deployment.tar.gz
          backend-docker-image.tar.gz
        retention-days: 90

  # 백엔드 배포 (개선됨)
  backend-deploy-dev:
    name: Deploy Backend to Development
    runs-on: ubuntu-latest
    needs: [backend-build]
    if: github.ref == 'refs/heads/develop'
    environment: development
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download deployment package
      uses: actions/download-artifact@v3
      with:
        name: backend-deployment
        
    - name: Deploy to development server
      run: |
        echo "Deploying backend to development environment..."
        # 실제 배포 스크립트 (예: Docker, Kubernetes, 서버 배포)
        # docker load < backend-docker-image.tar.gz
        # docker-compose -f docker-compose.dev.yml up -d
        
    - name: Run health check
      run: |
        echo "Running backend health check..."
        sleep 30
        curl -f http://dev-backend:5000/health || exit 1
        curl -f http://dev-backend:5000/api/v1/status || exit 1
        
    - name: Run smoke tests
      run: |
        echo "Running smoke tests..."
        # 기본 기능 테스트
        curl -f http://dev-backend:5000/api/v1/health || exit 1

  # 백엔드 배포 (프로덕션)
  backend-deploy-prod:
    name: Deploy Backend to Production
    runs-on: ubuntu-latest
    needs: [backend-build]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download deployment package
      uses: actions/download-artifact@v3
      with:
        name: backend-deployment
        
    - name: Deploy to production server
      run: |
        echo "Deploying backend to production environment..."
        # 실제 배포 스크립트
        
    - name: Run health check
      run: |
        echo "Running production health check..."
        sleep 30
        curl -f https://prod-backend/health || exit 1
        curl -f https://prod-backend/api/v1/status || exit 1
        
    - name: Run production smoke tests
      run: |
        echo "Running production smoke tests..."
        curl -f https://prod-backend/api/v1/health || exit 1
        
    - name: Notify deployment success
      run: |
        echo "Backend production deployment completed successfully!"
        # 슬랙, 이메일 등으로 알림 전송

  # 백엔드 모니터링 및 알림 (새로 추가)
  backend-monitoring:
    name: Backend Monitoring & Notifications
    runs-on: ubuntu-latest
    needs: [backend-code-quality, backend-unit-tests, backend-integration-tests, backend-api-tests, backend-security-scan, backend-build]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Generate backend test summary
      run: |
        echo "## Backend Test Summary" > backend-test-summary.md
        echo "" >> backend-test-summary.md
        echo "### Test Results:" >> backend-test-summary.md
        echo "- Code Quality: ${{ needs.backend-code-quality.result }}" >> backend-test-summary.md
        echo "- Unit Tests: ${{ needs.backend-unit-tests.result }}" >> backend-test-summary.md
        echo "- Integration Tests: ${{ needs.backend-integration-tests.result }}" >> backend-test-summary.md
        echo "- API Tests: ${{ needs.backend-api-tests.result }}" >> backend-test-summary.md
        echo "- Security Scan: ${{ needs.backend-security-scan.result }}" >> backend-test-summary.md
        echo "- Build: ${{ needs.backend-build.result }}" >> backend-test-summary.md
        echo "" >> backend-test-summary.md
        echo "### Coverage:" >> backend-test-summary.md
        echo "- Unit Test Coverage: [View Coverage Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)" >> backend-test-summary.md
        echo "" >> backend-test-summary.md
        echo "### Security:" >> backend-test-summary.md
        echo "- Security Reports: [View Security Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)" >> backend-test-summary.md
        
    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('backend-test-summary.md', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });
          
    - name: Upload test summary
      uses: actions/upload-artifact@v3
      with:
        name: backend-test-summary
        path: backend-test-summary.md
        retention-days: 30 
