name: Docker Build and Deploy

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Docker 이미지 빌드
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Upload Docker image digest
      uses: actions/upload-artifact@v3
      with:
        name: docker-image-digest
        path: |
          docker-image-digest.txt
        retention-days: 1

  # 멀티 플랫폼 빌드 (선택적)
  build-multi-platform:
    name: Build Multi-Platform Image
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          
    - name: Build and push multi-platform image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # 컨테이너 보안 스캔
  security-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Docker image digest
      uses: actions/download-artifact@v3
      with:
        name: docker-image-digest
        path: ./
        
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # 컨테이너 테스트
  test-container:
    name: Test Container
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests docker
        
    - name: Start container and run tests
      run: |
        # 컨테이너 시작
        docker run -d --name test-container -p 5000:5000 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        
        # 헬스 체크 대기
        sleep 30
        
        # 기본 테스트 실행
        python tests/container_test.py
        
        # 컨테이너 정리
        docker stop test-container
        docker rm test-container

  # 개발 환경 배포
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build, test-container]
    if: github.ref == 'refs/heads/develop'
    environment: development
    
    steps:
    - name: Deploy to development environment
      run: |
        echo "Deploying container to development environment..."
        # 실제 배포 스크립트는 환경에 따라 다름
        # 예: kubectl, docker-compose, helm 등
        
    - name: Run health check
      run: |
        echo "Running health check..."
        sleep 30
        curl -f http://dev-server/health || exit 1

  # 프로덕션 환경 배포
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, test-container, security-scan]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Deploy to production environment
      run: |
        echo "Deploying container to production environment..."
        # 실제 배포 스크립트는 환경에 따라 다름
        
    - name: Run health check
      run: |
        echo "Running health check..."
        sleep 30
        curl -f https://prod-server/health || exit 1
        
    - name: Notify deployment success
      run: |
        echo "Production deployment completed successfully!"
        # 슬랙, 이메일 등으로 알림 전송 