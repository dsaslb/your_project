apiVersion: v1
kind: ConfigMap
metadata:
  name: your-program-config
  namespace: your-program
data:
  # 애플리케이션 설정
  FLASK_ENV: "production"
  DATABASE_URL: "postgresql://your-program:your-program@postgres-service:5432/your_program"
  REDIS_URL: "redis://:your-redis-password@redis-service:6379/0"
  
  # API 설정
  API_BASE_URL: "https://api.yourdomain.com"
  NEXT_PUBLIC_API_URL: "https://api.yourdomain.com"
  NEXT_PUBLIC_APP_NAME: "Your Program"
  
  # 보안 설정
  SECRET_KEY: "your-secret-key-here"
  JWT_SECRET_KEY: "your-jwt-secret-key-here"
  
  # 이메일 설정
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USERNAME: "noreply@yourdomain.com"
  
  # 모니터링 설정
  PROMETHEUS_ENDPOINT: "http://prometheus-service:9090"
  GRAFANA_ENDPOINT: "http://grafana-service:3000"
  
  # 로깅 설정
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  
  # 성능 설정
  WORKER_PROCESSES: "4"
  WORKER_CONNECTIONS: "1024"
  KEEPALIVE_TIMEOUT: "65"
  
  # 캐시 설정
  CACHE_TTL: "3600"
  SESSION_TTL: "86400"
  
  # 업로드 설정
  MAX_FILE_SIZE: "10MB"
  ALLOWED_EXTENSIONS: "jpg,jpeg,png,gif,pdf,doc,docx"
  
  # 백업 설정
  BACKUP_RETENTION_DAYS: "30"
  BACKUP_SCHEDULE: "0 2 * * *"
  
  # 알림 설정
  ALERT_EMAIL: "admin@yourdomain.com"
  SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
  
  # 개발자 설정
  DEBUG_MODE: "false"
  ENABLE_PROFILING: "false"
  ENABLE_METRICS: "true" 