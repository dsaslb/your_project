version: '3.8'

services:
  # 백엔드 애플리케이션
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: your_program_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://your_user:your_password@db:5432/your_program_prod
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    depends_on:
      - db
      - redis
    networks:
      - your_program_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 프론트엔드 애플리케이션
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: your_program_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.your-domain.com
    volumes:
      - ./frontend/.next:/app/.next
    networks:
      - your_program_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL 데이터베이스
  db:
    image: postgres:15-alpine
    container_name: your_program_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=your_program_prod
      - POSTGRES_USER=your_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    networks:
      - your_program_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U your_user -d your_program_prod"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis 캐시
  redis:
    image: redis:7-alpine
    container_name: your_program_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - your_program_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx 리버스 프록시
  nginx:
    image: nginx:alpine
    container_name: your_program_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - app
      - frontend
    networks:
      - your_program_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 모니터링 - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: your_program_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - your_program_network

  # 모니터링 - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: your_program_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - your_program_network

  # 백업 서비스
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: your_program_backup
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://your_user:your_password@db:5432/your_program_prod
      - BACKUP_DIR=/backups
      - RETENTION_DAYS=30
    volumes:
      - ./backups:/backups
    depends_on:
      - db
    networks:
      - your_program_network
    profiles:
      - backup

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  your_program_network:
    driver: bridge 