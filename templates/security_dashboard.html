<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Program - 보안 모니터링 대시보드</title>
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        .security-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .security-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .threat-level-critical {
            background: linear-gradient(135deg, #EF4444, #DC2626);
            animation: pulse-red 2s infinite;
        }
        .threat-level-high {
            background: linear-gradient(135deg, #F59E0B, #D97706);
        }
        .threat-level-medium {
            background: linear-gradient(135deg, #EAB308, #CA8A04);
        }
        .threat-level-low {
            background: linear-gradient(135deg, #10B981, #059669);
        }
        
        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        
        .status-active { background-color: #10B981; }
        .status-warning { background-color: #F59E0B; }
        .status-error { background-color: #EF4444; }
        
        .scrollable-table {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .blinking-alert {
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.5; }
        }
        
        .metric-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #E5E7EB;
        }
        
        .chart-container {
            position: relative;
            height: 350px;
        }
        
        .mini-chart {
            height: 150px;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 네비게이션 바 -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <h1 class="text-xl font-bold text-gray-900">🛡️ 보안 모니터링 대시보드</h1>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="flex items-center">
                        <span class="status-indicator status-active"></span>
                        <span class="text-sm font-medium text-gray-700">실시간 모니터링</span>
                    </div>
                    <div class="text-sm text-gray-500" id="lastUpdate">
                        마지막 업데이트: --
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 보안 상태 요약 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <!-- 전체 위협 수준 -->
            <div class="metric-card security-card threat-level-low" id="threatLevelCard">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-white text-sm font-medium opacity-90">전체 위협 수준</p>
                        <p class="text-white text-3xl font-bold" id="threatLevel">낮음</p>
                    </div>
                    <div class="text-white text-4xl opacity-80">🛡️</div>
                </div>
            </div>

            <!-- 실시간 위협 탐지 -->
            <div class="metric-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">실시간 위협 탐지</p>
                        <p class="text-gray-900 text-3xl font-bold" id="activeThreats">0</p>
                        <p class="text-gray-500 text-sm">활성 위협</p>
                    </div>
                    <div class="text-red-500 text-4xl">⚠️</div>
                </div>
            </div>

            <!-- 보안 이벤트 -->
            <div class="metric-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">24시간 이벤트</p>
                        <p class="text-gray-900 text-3xl font-bold" id="totalEvents">0</p>
                        <p class="text-gray-500 text-sm">보안 이벤트</p>
                    </div>
                    <div class="text-blue-500 text-4xl">📊</div>
                </div>
            </div>

            <!-- 차단된 공격 -->
            <div class="metric-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">차단된 공격</p>
                        <p class="text-gray-900 text-3xl font-bold" id="blockedAttacks">0</p>
                        <p class="text-gray-500 text-sm">총 차단 수</p>
                    </div>
                    <div class="text-green-500 text-4xl">🚫</div>
                </div>
            </div>
        </div>

        <!-- 차트 섹션 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <!-- 시간별 위협 트렌드 -->
            <div class="metric-card">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">시간별 위협 트렌드</h3>
                <div class="chart-container">
                    <canvas id="threatTrendChart"></canvas>
                </div>
            </div>

            <!-- 위협 유형 분포 -->
            <div class="metric-card">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">위협 유형 분포</h3>
                <div class="chart-container">
                    <canvas id="threatTypeChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 상세 정보 섹션 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            <!-- 최근 보안 알림 -->
            <div class="metric-card">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">최근 보안 알림</h3>
                <div class="scrollable-table">
                    <div id="recentAlerts" class="space-y-3">
                        <!-- 알림 항목들이 여기에 동적으로 추가됩니다 -->
                    </div>
                </div>
            </div>

            <!-- 상위 공격 IP -->
            <div class="metric-card">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">상위 공격 IP</h3>
                <div class="scrollable-table">
                    <div id="topAttackIPs" class="space-y-3">
                        <!-- IP 목록이 여기에 동적으로 추가됩니다 -->
                    </div>
                </div>
            </div>

            <!-- 시스템 상태 -->
            <div class="metric-card">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">시스템 상태</h3>
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <span class="text-gray-600">보안 모니터링</span>
                        <div class="flex items-center">
                            <span class="status-indicator status-active"></span>
                            <span class="text-sm font-medium text-green-600">활성</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-gray-600">위협 탐지 엔진</span>
                        <div class="flex items-center">
                            <span class="status-indicator status-active"></span>
                            <span class="text-sm font-medium text-green-600">정상</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-gray-600">실시간 분석</span>
                        <div class="flex items-center">
                            <span class="status-indicator status-active"></span>
                            <span class="text-sm font-medium text-green-600">작동 중</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-gray-600">데이터베이스</span>
                        <div class="flex items-center">
                            <span class="status-indicator status-active"></span>
                            <span class="text-sm font-medium text-green-600">연결됨</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 최근 보안 이벤트 테이블 -->
        <div class="metric-card">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-gray-900">최근 보안 이벤트</h3>
                <div class="flex space-x-2">
                    <select id="threatTypeFilter" class="px-3 py-1 border border-gray-300 rounded-md text-sm">
                        <option value="">모든 위협 유형</option>
                        <option value="sql_injection">SQL 인젝션</option>
                        <option value="xss">XSS</option>
                        <option value="path_traversal">경로 탐색</option>
                        <option value="command_injection">명령 인젝션</option>
                        <option value="brute_force">무차별 대입</option>
                    </select>
                    <select id="severityFilter" class="px-3 py-1 border border-gray-300 rounded-md text-sm">
                        <option value="">모든 심각도</option>
                        <option value="critical">심각</option>
                        <option value="high">높음</option>
                        <option value="medium">보통</option>
                        <option value="low">낮음</option>
                    </select>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">시간</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">위협 유형</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">소스 IP</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">대상</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">심각도</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">상태</th>
                        </tr>
                    </thead>
                    <tbody id="eventsTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- 이벤트 행들이 여기에 동적으로 추가됩니다 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 설정 모달 -->
    <div id="settingsModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3">
                <h3 class="text-lg font-medium text-gray-900 mb-4">보안 모니터링 설정</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">업데이트 간격 (초)</label>
                        <input type="number" id="updateInterval" value="5" min="1" max="60" 
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">알림 임계값</label>
                        <input type="number" id="alertThreshold" value="5" min="1" max="100" 
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" id="soundAlerts" class="mr-2">
                        <label class="text-sm font-medium text-gray-700">소리 알림</label>
                    </div>
                </div>
                <div class="flex justify-end space-x-2 mt-6">
                    <button id="cancelSettings" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400">
                        취소
                    </button>
                    <button id="saveSettings" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                        저장
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 전역 변수
        let threatTrendChart, threatTypeChart;
        let updateInterval = 5000; // 5초
        let alertThreshold = 5;
        let soundAlertsEnabled = false;

        // API 엔드포인트
        const API_BASE = 'http://localhost:8007';

        // 초기화
        document.addEventListener('DOMContentLoaded', function() {
            initCharts();
            loadDashboardData();
            startRealTimeUpdates();
            setupEventListeners();
        });

        // 차트 초기화
        function initCharts() {
            // 시간별 위협 트렌드 차트
            const threatTrendCtx = document.getElementById('threatTrendChart').getContext('2d');
            threatTrendChart = new Chart(threatTrendCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '위협 이벤트',
                        data: [],
                        borderColor: '#EF4444',
                        backgroundColor: 'rgba(239, 68, 68, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: '#F3F4F6'
                            }
                        },
                        x: {
                            grid: {
                                color: '#F3F4F6'
                            }
                        }
                    }
                }
            });

            // 위협 유형 분포 차트
            const threatTypeCtx = document.getElementById('threatTypeChart').getContext('2d');
            threatTypeChart = new Chart(threatTypeCtx, {
                type: 'doughnut',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: [
                            '#EF4444', '#F59E0B', '#EAB308', 
                            '#10B981', '#3B82F6', '#8B5CF6'
                        ],
                        borderWidth: 2,
                        borderColor: '#FFFFFF'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        // 대시보드 데이터 로드
        async function loadDashboardData() {
            try {
                // 보안 상태 조회
                const statusResponse = await axios.get(`${API_BASE}/security/status`);
                updateSecurityStatus(statusResponse.data);

                // 보안 메트릭 조회
                const metricsResponse = await axios.get(`${API_BASE}/security/metrics`);
                updateMetrics(metricsResponse.data);

                // 보안 이벤트 조회
                const eventsResponse = await axios.get(`${API_BASE}/security/events?limit=50`);
                updateEventsTable(eventsResponse.data.events);

                // 보안 알림 조회
                const alertsResponse = await axios.get(`${API_BASE}/security/alerts?limit=10`);
                updateRecentAlerts(alertsResponse.data.alerts);

                // 마지막 업데이트 시간 설정
                document.getElementById('lastUpdate').textContent = 
                    '마지막 업데이트: ' + new Date().toLocaleTimeString('ko-KR');

            } catch (error) {
                console.error('대시보드 데이터 로드 실패:', error);
                showErrorMessage('데이터를 불러오는 중 오류가 발생했습니다.');
            }
        }

        // 보안 상태 업데이트
        function updateSecurityStatus(data) {
            // 전체 위협 수준 계산
            const severityStats = data.severity_statistics || {};
            const criticalCount = severityStats.critical || 0;
            const highCount = severityStats.high || 0;
            
            let threatLevel = 'low';
            let threatLevelText = '낮음';
            let cardClass = 'threat-level-low';

            if (criticalCount > 0) {
                threatLevel = 'critical';
                threatLevelText = '심각';
                cardClass = 'threat-level-critical';
            } else if (highCount > 5) {
                threatLevel = 'high';
                threatLevelText = '높음';
                cardClass = 'threat-level-high';
            } else if (highCount > 0) {
                threatLevel = 'medium';
                threatLevelText = '보통';
                cardClass = 'threat-level-medium';
            }

            // 위협 수준 카드 업데이트
            const threatLevelCard = document.getElementById('threatLevelCard');
            threatLevelCard.className = `metric-card security-card ${cardClass}`;
            document.getElementById('threatLevel').textContent = threatLevelText;

            // 기타 메트릭 업데이트
            document.getElementById('activeThreats').textContent = 
                (criticalCount + highCount).toString();
            document.getElementById('totalEvents').textContent = 
                data.total_events.toString();
        }

        // 메트릭 업데이트
        function updateMetrics(data) {
            // 시간별 위협 트렌드 차트 업데이트
            const hourlyData = data.hourly_events || {};
            const hours = Object.keys(hourlyData).sort();
            const counts = hours.map(hour => hourlyData[hour]);

            threatTrendChart.data.labels = hours;
            threatTrendChart.data.datasets[0].data = counts;
            threatTrendChart.update();

            // 위협 유형 분포 차트 업데이트
            const threatDistribution = data.threat_distribution || {};
            const threatTypes = Object.keys(threatDistribution);
            const threatCounts = Object.values(threatDistribution);

            threatTypeChart.data.labels = threatTypes.map(type => {
                const typeMap = {
                    'sql_injection': 'SQL 인젝션',
                    'xss': 'XSS',
                    'path_traversal': '경로 탐색',
                    'command_injection': '명령 인젝션',
                    'brute_force': '무차별 대입'
                };
                return typeMap[type] || type;
            });
            threatTypeChart.data.datasets[0].data = threatCounts;
            threatTypeChart.update();

            // 상위 공격 IP 업데이트
            updateTopAttackIPs(data.top_attack_ips || []);

            // 차단된 공격 수 업데이트
            document.getElementById('blockedAttacks').textContent = 
                data.total_events_24h.toString();
        }

        // 상위 공격 IP 업데이트
        function updateTopAttackIPs(topIPs) {
            const container = document.getElementById('topAttackIPs');
            container.innerHTML = '';

            topIPs.slice(0, 10).forEach((ipData, index) => {
                const ipElement = document.createElement('div');
                ipElement.className = 'flex justify-between items-center p-2 bg-gray-50 rounded';
                ipElement.innerHTML = `
                    <span class="text-sm font-medium text-gray-900">${ipData.ip}</span>
                    <span class="text-sm text-red-600 font-bold">${ipData.count}회</span>
                `;
                container.appendChild(ipElement);
            });

            if (topIPs.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm">공격 IP가 없습니다.</p>';
            }
        }

        // 최근 알림 업데이트
        function updateRecentAlerts(alerts) {
            const container = document.getElementById('recentAlerts');
            container.innerHTML = '';

            alerts.slice(0, 10).forEach(alert => {
                const alertElement = document.createElement('div');
                const severityClass = {
                    'critical': 'bg-red-100 border-red-500 text-red-700',
                    'high': 'bg-orange-100 border-orange-500 text-orange-700',
                    'medium': 'bg-yellow-100 border-yellow-500 text-yellow-700',
                    'low': 'bg-green-100 border-green-500 text-green-700'
                }[alert.severity] || 'bg-gray-100 border-gray-500 text-gray-700';

                alertElement.className = `p-3 border-l-4 ${severityClass} rounded`;
                alertElement.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-sm font-medium">${alert.threat_type}</p>
                            <p class="text-xs opacity-75">${new Date(alert.timestamp).toLocaleString('ko-KR')}</p>
                        </div>
                        <span class="text-xs font-bold">${alert.severity}</span>
                    </div>
                `;
                container.appendChild(alertElement);
            });

            if (alerts.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm">최근 알림이 없습니다.</p>';
            }
        }

        // 이벤트 테이블 업데이트
        function updateEventsTable(events) {
            const tbody = document.getElementById('eventsTableBody');
            tbody.innerHTML = '';

            events.forEach(event => {
                const row = document.createElement('tr');
                const severityClass = {
                    'critical': 'bg-red-100 text-red-800',
                    'high': 'bg-orange-100 text-orange-800',
                    'medium': 'bg-yellow-100 text-yellow-800',
                    'low': 'bg-green-100 text-green-800'
                }[event.severity] || 'bg-gray-100 text-gray-800';

                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        ${new Date(event.timestamp).toLocaleString('ko-KR')}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        ${event.threat_type}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        ${event.source_ip}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        ${event.target}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 py-1 text-xs font-medium rounded-full ${severityClass}">
                            ${event.severity}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        차단됨
                    </td>
                `;
                tbody.appendChild(row);
            });

            if (events.length === 0) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td colspan="6" class="px-6 py-4 text-center text-gray-500">
                        보안 이벤트가 없습니다.
                    </td>
                `;
                tbody.appendChild(row);
            }
        }

        // 실시간 업데이트 시작
        function startRealTimeUpdates() {
            setInterval(loadDashboardData, updateInterval);
        }

        // 이벤트 리스너 설정
        function setupEventListeners() {
            // 필터 변경 시 이벤트 테이블 업데이트
            document.getElementById('threatTypeFilter').addEventListener('change', filterEvents);
            document.getElementById('severityFilter').addEventListener('change', filterEvents);
        }

        // 이벤트 필터링
        async function filterEvents() {
            const threatType = document.getElementById('threatTypeFilter').value;
            const severity = document.getElementById('severityFilter').value;
            
            try {
                let url = `${API_BASE}/security/events?limit=50`;
                if (threatType) url += `&threat_type=${threatType}`;
                if (severity) url += `&severity=${severity}`;
                
                const response = await axios.get(url);
                updateEventsTable(response.data.events);
            } catch (error) {
                console.error('이벤트 필터링 실패:', error);
            }
        }

        // 에러 메시지 표시
        function showErrorMessage(message) {
            // 간단한 에러 표시 (실제로는 더 정교한 알림 시스템 사용)
            console.error(message);
        }

        // 브라우저 알림 요청 (선택사항)
        if (Notification.permission === 'default') {
            Notification.requestPermission();
        }
    </script>
</body>
</html>
