<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업종별 관리자 승인/관리</title>
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons@4.29.0/dist/feather.min.js"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- 헤더 -->
        <header class="bg-white shadow-sm border-b">
            <div class="flex items-center justify-between px-6 py-4">
                <div>
                    <h2 class="text-2xl font-bold text-gray-900">업종별 관리자 승인/관리</h2>
                    <p class="text-gray-600">업종별 관리자 등록, 승인, 관리</p>
                </div>
                <a href="/admin/backend" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors">
                    뒤로가기
                </a>
            </div>
        </header>

        <!-- 메인 콘텐츠 -->
        <main class="p-6">
            <!-- 통계 카드 -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="p-3 bg-blue-100 rounded-full">
                            <i data-feather="users" class="w-6 h-6 text-blue-600"></i>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-600">전체 관리자</p>
                            <p class="text-2xl font-bold text-gray-900" id="total-admins">0</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="p-3 bg-yellow-100 rounded-full">
                            <i data-feather="clock" class="w-6 h-6 text-yellow-600"></i>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-600">승인 대기</p>
                            <p class="text-2xl font-bold text-gray-900" id="pending-admins">0</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="p-3 bg-green-100 rounded-full">
                            <i data-feather="check-circle" class="w-6 h-6 text-green-600"></i>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-600">승인 완료</p>
                            <p class="text-2xl font-bold text-gray-900" id="approved-admins">0</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="p-3 bg-red-100 rounded-full">
                            <i data-feather="x-circle" class="w-6 h-6 text-red-600"></i>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-600">거절/비활성</p>
                            <p class="text-2xl font-bold text-gray-900" id="rejected-admins">0</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 필터 및 검색 -->
            <div class="bg-white rounded-lg shadow mb-6">
                <div class="p-6 border-b">
                    <div class="flex flex-wrap items-center gap-4">
                        <div class="flex-1 min-w-0">
                            <input type="text" id="search-input" placeholder="이름, 이메일, 회사명으로 검색..." 
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        <select id="status-filter" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">전체 상태</option>
                            <option value="pending">승인 대기</option>
                            <option value="approved">승인 완료</option>
                            <option value="rejected">거절</option>
                            <option value="inactive">비활성</option>
                        </select>
                        <button id="refresh-btn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                            새로고침
                        </button>
                    </div>
                </div>
            </div>

            <!-- 관리자 목록 -->
            <div class="bg-white rounded-lg shadow">
                <div class="px-6 py-4 border-b">
                    <h3 class="text-lg font-semibold text-gray-900">업종별 관리자 목록</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">관리자 정보</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">업종</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">상태</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">등록일</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">최근 활동</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">작업</th>
                            </tr>
                        </thead>
                        <tbody id="admins-table-body" class="bg-white divide-y divide-gray-200">
                            <!-- 관리자 목록이 여기에 동적으로 로드됩니다 -->
                        </tbody>
                    </table>
                </div>
                <div class="px-6 py-4 border-t">
                    <div class="flex items-center justify-between">
                        <div class="text-sm text-gray-700">
                            총 <span id="total-count">0</span>명의 관리자
                        </div>
                        <div class="flex space-x-2" id="pagination">
                            <!-- 페이지네이션이 여기에 표시됩니다 -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 승인/거절 모달 -->
    <div id="action-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-md w-full">
                <div class="px-6 py-4 border-b">
                    <h3 class="text-lg font-semibold text-gray-900" id="modal-title">관리자 승인</h3>
                </div>
                <div class="px-6 py-4">
                    <div id="modal-content">
                        <!-- 모달 내용이 여기에 표시됩니다 -->
                    </div>
                </div>
                <div class="px-6 py-4 border-t flex justify-end space-x-3">
                    <button id="modal-cancel" class="px-4 py-2 text-gray-600 hover:text-gray-800 transition-colors">
                        취소
                    </button>
                    <button id="modal-confirm" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                        확인
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Feather 아이콘 초기화
        if (typeof feather !== 'undefined') {
            feather.replace();
        }

        let currentPage = 1;
        let currentAdminId = null;
        let currentAction = null;

        // 페이지 로드 시 데이터 가져오기
        document.addEventListener('DOMContentLoaded', function() {
            loadAdmins();
            loadStats();
        });

        // 검색 및 필터 이벤트
        document.getElementById('search-input').addEventListener('input', debounce(loadAdmins, 300));
        document.getElementById('status-filter').addEventListener('change', loadAdmins);
        document.getElementById('refresh-btn').addEventListener('click', function() {
            loadAdmins();
            loadStats();
        });

        // 모달 이벤트
        document.getElementById('modal-cancel').addEventListener('click', closeModal);
        document.getElementById('modal-confirm').addEventListener('click', confirmAction);

        // 관리자 목록 로드
        function loadAdmins() {
            const search = document.getElementById('search-input').value;
            const status = document.getElementById('status-filter').value;
            
            fetch(`/api/industry-admin?page=${currentPage}&search=${search}&status=${status}`)
                .then(response => response.json())
                .then(data => {
                    renderAdminsTable(data.industry_admins);
                    renderPagination(data.total, data.pages, data.current_page);
                })
                .catch(error => {
                    console.error('Error loading admins:', error);
                });
        }

        // 통계 로드
        function loadStats() {
            fetch('/api/industry-admin/stats')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('total-admins').textContent = data.total_count || 0;
                    document.getElementById('pending-admins').textContent = data.pending_count || 0;
                    document.getElementById('approved-admins').textContent = data.approved_count || 0;
                    document.getElementById('rejected-admins').textContent = (data.rejected_count || 0) + (data.inactive_count || 0);
                })
                .catch(error => {
                    console.error('Error loading stats:', error);
                });
        }

        // 관리자 테이블 렌더링
        function renderAdminsTable(admins) {
            const tbody = document.getElementById('admins-table-body');
            tbody.innerHTML = '';

            admins.forEach(admin => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';
                
                const statusClass = getStatusClass(admin.status);
                const statusText = getStatusText(admin.status);
                
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <div class="flex-shrink-0 h-10 w-10">
                                <div class="h-10 w-10 rounded-full bg-gray-300 flex items-center justify-center">
                                    <i data-feather="user" class="w-5 h-5 text-gray-600"></i>
                                </div>
                            </div>
                            <div class="ml-4">
                                <div class="text-sm font-medium text-gray-900">${admin.full_name}</div>
                                <div class="text-sm text-gray-500">${admin.contact_email}</div>
                                <div class="text-sm text-gray-500">${admin.company_name || ''}</div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${admin.industry_name || 'N/A'}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full ${statusClass}">
                            ${statusText}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${formatDate(admin.created_at)}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${admin.last_activity ? formatDate(admin.last_activity) : '활동 없음'}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        ${getActionButtons(admin)}
                    </td>
                `;
                
                tbody.appendChild(row);
            });
            
            // Feather 아이콘 다시 초기화
            if (typeof feather !== 'undefined') {
            feather.replace();
        }
        }

        // 상태별 스타일 클래스
        function getStatusClass(status) {
            switch(status) {
                case 'pending': return 'bg-yellow-100 text-yellow-800';
                case 'approved': return 'bg-green-100 text-green-800';
                case 'rejected': return 'bg-red-100 text-red-800';
                case 'inactive': return 'bg-gray-100 text-gray-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        // 상태별 텍스트
        function getStatusText(status) {
            switch(status) {
                case 'pending': return '승인 대기';
                case 'approved': return '승인 완료';
                case 'rejected': return '거절';
                case 'inactive': return '비활성';
                default: return '알 수 없음';
            }
        }

        // 액션 버튼 생성
        function getActionButtons(admin) {
            let buttons = '';
            
            if (admin.status === 'pending') {
                buttons += `
                    <button onclick="showApproveModal(${admin.id})" class="text-green-600 hover:text-green-900 mr-3">
                        승인
                    </button>
                    <button onclick="showRejectModal(${admin.id})" class="text-red-600 hover:text-red-900">
                        거절
                    </button>
                `;
            } else if (admin.status === 'approved') {
                buttons += `
                    <button onclick="showDeactivateModal(${admin.id})" class="text-gray-600 hover:text-gray-900">
                        비활성화
                    </button>
                `;
            } else if (admin.status === 'inactive') {
                buttons += `
                    <button onclick="showActivateModal(${admin.id})" class="text-blue-600 hover:text-blue-900">
                        활성화
                    </button>
                `;
            }
            
            buttons += `
                <button onclick="showDetailModal(${admin.id})" class="text-blue-600 hover:text-blue-900 ml-3">
                    상세보기
                </button>
            `;
            
            return buttons;
        }

        // 승인 모달 표시
        function showApproveModal(adminId) {
            currentAdminId = adminId;
            currentAction = 'approve';
            
            document.getElementById('modal-title').textContent = '관리자 승인';
            document.getElementById('modal-content').innerHTML = `
                <p class="text-gray-700">이 관리자를 승인하시겠습니까?</p>
                <p class="text-sm text-gray-500 mt-2">승인 후 해당 관리자는 시스템에 접근할 수 있습니다.</p>
            `;
            
            showModal();
        }

        // 거절 모달 표시
        function showRejectModal(adminId) {
            currentAdminId = adminId;
            currentAction = 'reject';
            
            document.getElementById('modal-title').textContent = '관리자 거절';
            document.getElementById('modal-content').innerHTML = `
                <p class="text-gray-700">거절 사유를 입력해주세요:</p>
                <textarea id="rejection-reason" class="w-full mt-2 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" rows="3" placeholder="거절 사유를 입력하세요..."></textarea>
            `;
            
            showModal();
        }

        // 모달 표시
        function showModal() {
            document.getElementById('action-modal').classList.remove('hidden');
        }

        // 모달 닫기
        function closeModal() {
            document.getElementById('action-modal').classList.add('hidden');
            currentAdminId = null;
            currentAction = null;
        }

        // 액션 확인
        function confirmAction() {
            if (!currentAdminId || !currentAction) return;
            
            let url = '';
            let data = {};
            
            if (currentAction === 'approve') {
                url = `/api/backend/industry-admin/approve/${currentAdminId}`;
            } else if (currentAction === 'reject') {
                url = `/api/backend/industry-admin/reject/${currentAdminId}`;
                const reason = document.getElementById('rejection-reason').value;
                if (!reason.trim()) {
                    alert('거절 사유를 입력해주세요.');
                    return;
                }
                data = { reason: reason };
            }
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    alert(result.message);
                    closeModal();
                    loadAdmins();
                    loadStats();
                } else {
                    alert('오류가 발생했습니다: ' + result.error);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('오류가 발생했습니다.');
            });
        }

        // 페이지네이션 렌더링
        function renderPagination(total, pages, current) {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            
            if (pages <= 1) return;
            
            // 이전 페이지
            if (current > 1) {
                const prevBtn = document.createElement('button');
                prevBtn.className = 'px-3 py-2 text-sm text-gray-500 hover:text-gray-700';
                prevBtn.textContent = '이전';
                prevBtn.onclick = () => {
                    currentPage = current - 1;
                    loadAdmins();
                };
                pagination.appendChild(prevBtn);
            }
            
            // 페이지 번호
            for (let i = 1; i <= pages; i++) {
                if (i === current) {
                    const currentBtn = document.createElement('button');
                    currentBtn.className = 'px-3 py-2 text-sm bg-blue-600 text-white rounded-lg';
                    currentBtn.textContent = i;
                    pagination.appendChild(currentBtn);
                } else {
                    const pageBtn = document.createElement('button');
                    pageBtn.className = 'px-3 py-2 text-sm text-gray-500 hover:text-gray-700';
                    pageBtn.textContent = i;
                    pageBtn.onclick = () => {
                        currentPage = i;
                        loadAdmins();
                    };
                    pagination.appendChild(pageBtn);
                }
            }
            
            // 다음 페이지
            if (current < pages) {
                const nextBtn = document.createElement('button');
                nextBtn.className = 'px-3 py-2 text-sm text-gray-500 hover:text-gray-700';
                nextBtn.textContent = '다음';
                nextBtn.onclick = () => {
                    currentPage = current + 1;
                    loadAdmins();
                };
                pagination.appendChild(nextBtn);
            }
        }

        // 날짜 포맷팅
        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString('ko-KR');
        }

        // 디바운스 함수
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
    </script>
</body>
</html>
