<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>직원 관리 - 사이버펑크</title>
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        .cyber-font { font-family: 'Orbitron', monospace; }
        .cyber-text { font-family: 'Rajdhani', sans-serif; }
        .cyber-bg { background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%); }
        .cyber-orange { color: #ff6b35; }
        .cyber-orange-glow { color: #ff6b35; text-shadow: 0 0 10px #ff6b35, 0 0 20px #ff6b35; }
        .cyber-blue { color: #4ecdc4; }
        .cyber-blue-glow { color: #4ecdc4; text-shadow: 0 0 10px #4ecdc4, 0 0 20px #4ecdc4; }
        .cyber-red { color: #ff4757; }
        .cyber-red-glow { color: #ff4757; text-shadow: 0 0 10px #ff4757, 0 0 20px #ff4757; }
        .cyber-green { color: #2ed573; }
        .cyber-green-glow { color: #2ed573; text-shadow: 0 0 10px #2ed573, 0 0 20px #2ed573; }
        .cyber-yellow { color: #ffa502; }
        .cyber-yellow-glow { color: #ffa502; text-shadow: 0 0 10px #ffa502, 0 0 20px #ffa502; }
        .cyber-text-dim { color: #a0a0a0; }
        .cyber-border { border: 1px solid #333; }
        .cyber-border-orange { border: 1px solid #ff6b35; }
        .cyber-border-blue { border: 1px solid #4ecdc4; }
        .cyber-border-green { border: 1px solid #2ed573; }
        .cyber-border-red { border: 1px solid #ff4757; }
        .cyber-card { background: rgba(26, 26, 46, 0.8); border: 1px solid #333; backdrop-filter: blur(10px); }
        .cyber-card:hover { border-color: #ff4757; box-shadow: 0 0 20px rgba(255, 71, 87, 0.3); }
        .cyber-button { background: linear-gradient(45deg, #ff4757, #ff3742); border: none; color: white; transition: all 0.3s; }
        .cyber-button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4); }
        .cyber-input { background: rgba(26, 26, 46, 0.8); border: 1px solid #333; color: #e0e0e0; }
        .cyber-input:focus { border-color: #ff4757; box-shadow: 0 0 10px rgba(255, 71, 87, 0.3); }
        .cyber-table { background: rgba(26, 26, 46, 0.6); border: 1px solid #333; }
        .cyber-table th { background: rgba(255, 71, 87, 0.2); border-bottom: 1px solid #ff4757; }
        .cyber-table td { border-bottom: 1px solid #333; }
        .cyber-table tr:hover { background: rgba(255, 71, 87, 0.1); }
        .cyber-modal { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); }
        .cyber-modal-content { background: rgba(26, 26, 46, 0.95); border: 1px solid #ff4757; }
        .cyber-status-approved { color: #2ed573; }
        .cyber-status-pending { color: #ffa502; }
        .cyber-status-inactive { color: #ff4757; }
        .cyber-badge { padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        .cyber-badge-user { background: rgba(255, 71, 87, 0.2); color: #ff4757; border: 1px solid #ff4757; }
        .cyber-badge-branch { background: rgba(46, 213, 115, 0.2); color: #2ed573; border: 1px solid #2ed573; }
        .cyber-badge-brand { background: rgba(78, 205, 196, 0.2); color: #4ecdc4; border: 1px solid #4ecdc4; }
        .cyber-badge-industry { background: rgba(255, 107, 53, 0.2); color: #ff6b35; border: 1px solid #ff6b35; }
    </style>
</head>
<body class="cyber-bg min-h-screen cyber-text text-gray-300">
    <!-- 헤더 -->
    <header class="cyber-card p-4 mb-6">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="cyber-font text-3xl font-bold cyber-red-glow">직원 관리</h1>
                <p class="cyber-text-dim">직원 정보 생성, 수정, 삭제 관리</p>
            </div>
            <div class="flex items-center space-x-4">
                <button id="add-employee-btn" class="cyber-button px-4 py-2 rounded flex items-center space-x-2">
                    <i data-feather="plus" class="w-4 h-4"></i>
                    <span>새 직원 추가</span>
                </button>
                <a href="/admin/backend/hierarchy-management" class="cyber-button px-4 py-2 rounded flex items-center space-x-2">
                    <i data-feather="arrow-left" class="w-4 h-4"></i>
                    <span>뒤로가기</span>
                </a>
            </div>
        </div>
    </header>

    <!-- 검색 및 필터 -->
    <div class="cyber-card p-4 mb-6">
        <div class="flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-2">
                    <input type="text" id="search-input" placeholder="직원명 검색..." class="cyber-input px-3 py-2 rounded">
                    <button id="search-btn" class="cyber-button px-4 py-2 rounded">
                        <i data-feather="search" class="w-4 h-4"></i>
                    </button>
                </div>
                <select id="branch-filter" class="cyber-input px-3 py-2 rounded">
                    <option value="">전체 매장</option>
                </select>
                <select id="role-filter" class="cyber-input px-3 py-2 rounded">
                    <option value="">전체 역할</option>
                    <option value="admin">관리자</option>
                    <option value="manager">매니저</option>
                    <option value="employee">직원</option>
                </select>
                <select id="status-filter" class="cyber-input px-3 py-2 rounded">
                    <option value="">전체 상태</option>
                    <option value="approved">승인됨</option>
                    <option value="pending">대기중</option>
                    <option value="inactive">비활성</option>
                </select>
            </div>
            <div class="flex items-center space-x-2">
                <button id="refresh-btn" class="cyber-button px-3 py-2 rounded">
                    <i data-feather="refresh-cw" class="w-4 h-4"></i>
                </button>
                <span id="total-count" class="cyber-text-dim">총 0명</span>
            </div>
        </div>
    </div>

    <!-- 직원 목록 테이블 -->
    <div class="cyber-card p-6">
        <div class="overflow-x-auto">
            <table class="cyber-table w-full">
                <thead>
                    <tr>
                        <th class="px-4 py-3 text-left">직원명</th>
                        <th class="px-4 py-3 text-left">이메일</th>
                        <th class="px-4 py-3 text-left">역할</th>
                        <th class="px-4 py-3 text-left">매장</th>
                        <th class="px-4 py-3 text-left">상태</th>
                        <th class="px-4 py-3 text-left">가입일</th>
                        <th class="px-4 py-3 text-center">관리</th>
                    </tr>
                </thead>
                <tbody id="employee-table-body">
                    <!-- 직원 목록이 여기에 동적으로 로드됩니다 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 직원 추가/수정 모달 -->
    <div id="employee-modal" class="cyber-modal fixed inset-0 flex items-center justify-center z-50 hidden">
        <div class="cyber-modal-content p-8 rounded-lg w-full max-w-md">
            <div class="flex items-center justify-between mb-6">
                <h3 id="modal-title" class="cyber-font text-xl font-bold cyber-red-glow">새 직원 추가</h3>
                <button id="close-modal" class="text-gray-400 hover:text-white">
                    <i data-feather="x" class="w-6 h-6"></i>
                </button>
            </div>
            
            <form id="employee-form" class="space-y-4">
                <input type="hidden" id="employee-id" name="id">
                
                <div>
                    <label for="employee-username" class="block cyber-text-dim text-sm mb-2">직원명 *</label>
                    <input type="text" id="employee-username" name="username" required class="cyber-input w-full px-3 py-2 rounded">
                </div>
                
                <div>
                    <label for="employee-email" class="block cyber-text-dim text-sm mb-2">이메일 *</label>
                    <input type="email" id="employee-email" name="email" required class="cyber-input w-full px-3 py-2 rounded">
                </div>
                
                <div>
                    <label for="employee-password" class="block cyber-text-dim text-sm mb-2">비밀번호 *</label>
                    <input type="password" id="employee-password" name="password" required class="cyber-input w-full px-3 py-2 rounded">
                </div>
                
                <div>
                    <label for="employee-role" class="block cyber-text-dim text-sm mb-2">역할 *</label>
                    <select id="employee-role" name="role" required class="cyber-input w-full px-3 py-2 rounded">
                        <option value="">역할을 선택하세요</option>
                        <option value="admin">관리자</option>
                        <option value="manager">매니저</option>
                        <option value="employee">직원</option>
                    </select>
                </div>
                
                <div>
                    <label for="employee-branch" class="block cyber-text-dim text-sm mb-2">매장 *</label>
                    <select id="employee-branch" name="branch_id" required class="cyber-input w-full px-3 py-2 rounded">
                        <option value="">매장을 선택하세요</option>
                    </select>
                </div>
                
                <div>
                    <label for="employee-status" class="block cyber-text-dim text-sm mb-2">상태</label>
                    <select id="employee-status" name="status" class="cyber-input w-full px-3 py-2 rounded">
                        <option value="approved">승인됨</option>
                        <option value="pending">대기중</option>
                        <option value="inactive">비활성</option>
                    </select>
                </div>
                
                <div class="flex items-center justify-end space-x-3 pt-4">
                    <button type="button" id="cancel-btn" class="cyber-button px-4 py-2 rounded bg-gray-600 hover:bg-gray-700">
                        취소
                    </button>
                    <button type="submit" id="save-btn" class="cyber-button px-4 py-2 rounded">
                        저장
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div id="delete-modal" class="cyber-modal fixed inset-0 flex items-center justify-center z-50 hidden">
        <div class="cyber-modal-content p-8 rounded-lg w-full max-w-md">
            <div class="text-center">
                <i data-feather="alert-triangle" class="w-16 h-16 cyber-red mx-auto mb-4"></i>
                <h3 class="cyber-font text-xl font-bold cyber-red-glow mb-4">직원 삭제 확인</h3>
                <p class="cyber-text-dim mb-6">정말로 이 직원을 삭제하시겠습니까?</p>
                <p class="cyber-text-dim text-sm mb-6">삭제된 직원은 복구할 수 없습니다.</p>
                
                <div class="flex items-center justify-center space-x-3">
                    <button id="cancel-delete" class="cyber-button px-4 py-2 rounded bg-gray-600 hover:bg-gray-700">
                        취소
                    </button>
                    <button id="confirm-delete" class="cyber-button px-4 py-2 rounded bg-red-600 hover:bg-red-700">
                        삭제
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 로딩 오버레이 -->
    <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="cyber-card p-8 text-center">
            <div class="mb-4">
                <i data-feather="loader" class="w-8 h-8 cyber-red mx-auto animate-spin"></i>
            </div>
            <p class="cyber-font">처리 중...</p>
        </div>
    </div>

    <script>
        // 전역 변수
        let employees = [];
        let branches = [];
        let currentEmployeeId = null;

        // 초기화
        document.addEventListener('DOMContentLoaded', function() {
            feather.replace();
            loadBranches();
            loadEmployees();
            setupEventListeners();
        });

        // 이벤트 리스너 설정
        function setupEventListeners() {
            // 새 직원 추가 버튼
            document.getElementById('add-employee-btn').addEventListener('click', function() {
                openModal();
            });

            // 모달 닫기
            document.getElementById('close-modal').addEventListener('click', closeModal);
            document.getElementById('cancel-btn').addEventListener('click', closeModal);

            // 폼 제출
            document.getElementById('employee-form').addEventListener('submit', function(e) {
                e.preventDefault();
                saveEmployee();
            });

            // 검색
            document.getElementById('search-btn').addEventListener('click', function() {
                filterEmployees();
            });

            // 필터
            document.getElementById('branch-filter').addEventListener('change', function() {
                filterEmployees();
            });
            document.getElementById('role-filter').addEventListener('change', function() {
                filterEmployees();
            });
            document.getElementById('status-filter').addEventListener('change', function() {
                filterEmployees();
            });

            // 새로고침
            document.getElementById('refresh-btn').addEventListener('click', function() {
                loadEmployees();
            });

            // 삭제 모달
            document.getElementById('cancel-delete').addEventListener('click', closeDeleteModal);
            document.getElementById('confirm-delete').addEventListener('click', deleteEmployee);
        }

        // 매장 목록 로드
        async function loadBranches() {
            try {
                const response = await fetch('/api/admin/branches');
                const result = await response.json();
                
                if (result.success) {
                    branches = result.branches;
                    populateBranchFilters();
                }
            } catch (error) {
                console.error('매장 목록 로드 오류:', error);
            }
        }

        // 매장 필터 채우기
        function populateBranchFilters() {
            const branchFilter = document.getElementById('branch-filter');
            const employeeBranch = document.getElementById('employee-branch');
            
            let options = '<option value="">매장을 선택하세요</option>';
            branches.forEach(branch => {
                options += `<option value="${branch.id}">${branch.name}</option>`;
            });
            
            branchFilter.innerHTML = options;
            employeeBranch.innerHTML = options;
        }

        // 직원 목록 로드
        async function loadEmployees() {
            showLoading();
            try {
                const response = await fetch('/api/admin/employees');
                const result = await response.json();
                
                if (result.success) {
                    employees = result.employees;
                    renderEmployees();
                    updateTotalCount();
                } else {
                    showError('직원 목록 로드에 실패했습니다.');
                }
            } catch (error) {
                console.error('직원 목록 로드 오류:', error);
                showError('네트워크 오류가 발생했습니다.');
            } finally {
                hideLoading();
            }
        }

        // 직원 목록 렌더링
        function renderEmployees() {
            const tbody = document.getElementById('employee-table-body');
            
            if (!employees || employees.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="px-4 py-8 text-center cyber-text-dim">
                            직원이 없습니다.
                        </td>
                    </tr>
                `;
                return;
            }

            let html = '';
            employees.forEach(employee => {
                const branch = branches.find(b => b.id === employee.branch_id);
                html += `
                    <tr class="hover:bg-opacity-10 hover:bg-red-500">
                        <td class="px-4 py-3">
                            <div class="flex items-center space-x-3">
                                <span class="cyber-badge cyber-badge-user">👤</span>
                                <span class="cyber-font font-semibold">${employee.username}</span>
                            </div>
                        </td>
                        <td class="px-4 py-3 cyber-text-dim">${employee.email}</td>
                        <td class="px-4 py-3">
                            <span class="cyber-badge cyber-badge-user">${getRoleDisplay(employee.role)}</span>
                        </td>
                        <td class="px-4 py-3">
                            <span class="cyber-badge cyber-badge-branch">${branch ? branch.name : '알 수 없음'}</span>
                        </td>
                        <td class="px-4 py-3">
                            <span class="cyber-status-${employee.status}">
                                ● ${getStatusDisplay(employee.status)}
                            </span>
                        </td>
                        <td class="px-4 py-3 cyber-text-dim">${formatDate(employee.created_at)}</td>
                        <td class="px-4 py-3 text-center">
                            <div class="flex items-center justify-center space-x-2">
                                <button onclick="editEmployee(${employee.id})" class="cyber-button px-2 py-1 rounded text-sm">
                                    <i data-feather="edit" class="w-3 h-3"></i>
                                </button>
                                <button onclick="confirmDelete(${employee.id})" class="cyber-button px-2 py-1 rounded text-sm bg-red-600 hover:bg-red-700">
                                    <i data-feather="trash-2" class="w-3 h-3"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
            feather.replace();
        }

        // 직원 필터링
        function filterEmployees() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const branchFilter = document.getElementById('branch-filter').value;
            const roleFilter = document.getElementById('role-filter').value;
            const statusFilter = document.getElementById('status-filter').value;
            
            const filtered = employees.filter(employee => {
                const matchesSearch = employee.username.toLowerCase().includes(searchTerm) ||
                                    employee.email.toLowerCase().includes(searchTerm);
                const matchesBranch = !branchFilter || employee.branch_id.toString() === branchFilter;
                const matchesRole = !roleFilter || employee.role === roleFilter;
                const matchesStatus = !statusFilter || employee.status === statusFilter;
                
                return matchesSearch && matchesBranch && matchesRole && matchesStatus;
            });

            renderFilteredEmployees(filtered);
        }

        // 필터링된 직원 렌더링
        function renderFilteredEmployees(filteredEmployees) {
            const tbody = document.getElementById('employee-table-body');
            
            if (!filteredEmployees || filteredEmployees.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="px-4 py-8 text-center cyber-text-dim">
                            검색 결과가 없습니다.
                        </td>
                    </tr>
                `;
                return;
            }

            let html = '';
            filteredEmployees.forEach(employee => {
                const branch = branches.find(b => b.id === employee.branch_id);
                html += `
                    <tr class="hover:bg-opacity-10 hover:bg-red-500">
                        <td class="px-4 py-3">
                            <div class="flex items-center space-x-3">
                                <span class="cyber-badge cyber-badge-user">👤</span>
                                <span class="cyber-font font-semibold">${employee.username}</span>
                            </div>
                        </td>
                        <td class="px-4 py-3 cyber-text-dim">${employee.email}</td>
                        <td class="px-4 py-3">
                            <span class="cyber-badge cyber-badge-user">${getRoleDisplay(employee.role)}</span>
                        </td>
                        <td class="px-4 py-3">
                            <span class="cyber-badge cyber-badge-branch">${branch ? branch.name : '알 수 없음'}</span>
                        </td>
                        <td class="px-4 py-3">
                            <span class="cyber-status-${employee.status}">
                                ● ${getStatusDisplay(employee.status)}
                            </span>
                        </td>
                        <td class="px-4 py-3 cyber-text-dim">${formatDate(employee.created_at)}</td>
                        <td class="px-4 py-3 text-center">
                            <div class="flex items-center justify-center space-x-2">
                                <button onclick="editEmployee(${employee.id})" class="cyber-button px-2 py-1 rounded text-sm">
                                    <i data-feather="edit" class="w-3 h-3"></i>
                                </button>
                                <button onclick="confirmDelete(${employee.id})" class="cyber-button px-2 py-1 rounded text-sm bg-red-600 hover:bg-red-700">
                                    <i data-feather="trash-2" class="w-3 h-3"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
            feather.replace();
        }

        // 모달 열기
        function openModal(employee = null) {
            const modal = document.getElementById('employee-modal');
            const title = document.getElementById('modal-title');
            const form = document.getElementById('employee-form');
            
            if (employee) {
                title.textContent = '직원 수정';
                currentEmployeeId = employee.id;
                
                // 폼에 데이터 채우기
                document.getElementById('employee-id').value = employee.id;
                document.getElementById('employee-username').value = employee.username;
                document.getElementById('employee-email').value = employee.email;
                document.getElementById('employee-password').value = ''; // 보안상 비워둠
                document.getElementById('employee-role').value = employee.role;
                document.getElementById('employee-branch').value = employee.branch_id;
                document.getElementById('employee-status').value = employee.status;
                
                // 비밀번호 필드 비활성화 (수정 시에는 선택사항)
                document.getElementById('employee-password').required = false;
            } else {
                title.textContent = '새 직원 추가';
                currentEmployeeId = null;
                form.reset();
                document.getElementById('employee-status').value = 'approved';
                document.getElementById('employee-password').required = true;
            }
            
            modal.classList.remove('hidden');
        }

        // 모달 닫기
        function closeModal() {
            document.getElementById('employee-modal').classList.add('hidden');
            currentEmployeeId = null;
        }

        // 직원 저장
        async function saveEmployee() {
            const formData = new FormData(document.getElementById('employee-form'));
            const data = {
                username: formData.get('username'),
                email: formData.get('email'),
                role: formData.get('role'),
                branch_id: parseInt(formData.get('branch_id')),
                status: formData.get('status')
            };

            // 비밀번호는 수정 시에만 포함
            const password = formData.get('password');
            if (password) {
                data.password = password;
            }

            showLoading();
            try {
                const url = currentEmployeeId ? 
                    `/api/admin/employees/${currentEmployeeId}` : 
                    '/api/admin/employees';
                
                const method = currentEmployeeId ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showSuccess(currentEmployeeId ? '직원이 수정되었습니다.' : '직원이 추가되었습니다.');
                    closeModal();
                    loadEmployees();
                } else {
                    showError(result.error || '저장에 실패했습니다.');
                }
            } catch (error) {
                console.error('직원 저장 오류:', error);
                showError('네트워크 오류가 발생했습니다.');
            } finally {
                hideLoading();
            }
        }

        // 직원 수정
        function editEmployee(id) {
            const employee = employees.find(e => e.id === id);
            if (employee) {
                openModal(employee);
            }
        }

        // 삭제 확인
        function confirmDelete(id) {
            currentEmployeeId = id;
            document.getElementById('delete-modal').classList.remove('hidden');
        }

        // 삭제 모달 닫기
        function closeDeleteModal() {
            document.getElementById('delete-modal').classList.add('hidden');
            currentEmployeeId = null;
        }

        // 직원 삭제
        async function deleteEmployee() {
            if (!currentEmployeeId) return;
            
            showLoading();
            try {
                const response = await fetch(`/api/admin/employees/${currentEmployeeId}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showSuccess('직원이 삭제되었습니다.');
                    closeDeleteModal();
                    loadEmployees();
                } else {
                    showError(result.error || '삭제에 실패했습니다.');
                }
            } catch (error) {
                console.error('직원 삭제 오류:', error);
                showError('네트워크 오류가 발생했습니다.');
            } finally {
                hideLoading();
            }
        }

        // 총 개수 업데이트
        function updateTotalCount() {
            document.getElementById('total-count').textContent = `총 ${employees.length}명`;
        }

        // 역할 표시
        function getRoleDisplay(role) {
            const roleMap = {
                'admin': '관리자',
                'manager': '매니저',
                'employee': '직원'
            };
            return roleMap[role] || role;
        }

        // 상태 표시
        function getStatusDisplay(status) {
            const statusMap = {
                'approved': '승인됨',
                'pending': '대기중',
                'inactive': '비활성'
            };
            return statusMap[status] || status;
        }

        // 유틸리티 함수들
        function showLoading() {
            document.getElementById('loading-overlay').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading-overlay').classList.add('hidden');
        }

        function showSuccess(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 right-4 cyber-card p-4 cyber-green-glow z-50';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function showError(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 right-4 cyber-card p-4 cyber-red-glow z-50';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString();
        }
    </script>
</body>
</html>
