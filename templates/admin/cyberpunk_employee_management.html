<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>직원 관리 - 사이버펑크 스타일</title>
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <link href="/static/css/backend-admin.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .cyberpunk-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .neon-glow {
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }
        .hologram-effect {
            background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.1) 50%, transparent 70%);
            background-size: 200% 200%;
            animation: hologram 3s ease-in-out infinite;
        }
        @keyframes hologram {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .stat-card {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #667eea;
            border-radius: 8px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        .employee-card {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #667eea;
            border-radius: 8px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }
        .employee-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <!-- 네비게이션 바 -->
    <nav class="bg-black border-b border-blue-500 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <i class="fas fa-users text-blue-400 text-2xl"></i>
                <h1 class="text-xl font-bold text-blue-400">직원 관리 시스템</h1>
            </div>
            <div class="flex items-center space-x-4">
                <a href="/admin/backend" class="text-gray-300 hover:text-blue-400 transition-colors">
                    <i class="fas fa-arrow-left mr-2"></i>뒤로가기
                </a>
            </div>
        </div>
    </nav>

    <!-- 메인 컨텐츠 -->
    <div class="container mx-auto p-6">
        <!-- 통계 카드 -->
        <div class="data-grid mb-8">
            <div class="stat-card hologram-effect">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-lg font-semibold text-blue-400">총 직원 수</h3>
                        <p class="text-3xl font-bold" id="total-employees">-</p>
                    </div>
                    <i class="fas fa-users text-4xl text-blue-400"></i>
                </div>
            </div>
            
            <div class="stat-card hologram-effect">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-lg font-semibold text-green-400">활성 직원</h3>
                        <p class="text-3xl font-bold" id="active-employees">-</p>
                    </div>
                    <i class="fas fa-user-check text-4xl text-green-400"></i>
                </div>
            </div>
            
            <div class="stat-card hologram-effect">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-lg font-semibold text-yellow-400">대기 중</h3>
                        <p class="text-3xl font-bold" id="pending-employees">-</p>
                    </div>
                    <i class="fas fa-user-clock text-4xl text-yellow-400"></i>
                </div>
            </div>
            
            <div class="stat-card hologram-effect">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-lg font-semibold text-purple-400">평균 성과</h3>
                        <p class="text-3xl font-bold" id="avg-performance">-</p>
                    </div>
                    <i class="fas fa-chart-bar text-4xl text-purple-400"></i>
                </div>
            </div>
        </div>

        <!-- 직원 관리 섹션 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- 직원 목록 -->
            <div class="bg-black border border-blue-500 rounded-lg p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-blue-400">
                        <i class="fas fa-list mr-2"></i>직원 목록
                    </h2>
                    <button onclick="openCreateEmployeeModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors neon-glow">
                        <i class="fas fa-plus mr-2"></i>새 직원 추가
                    </button>
                </div>
                
                <div class="space-y-4" id="employees-list">
                    <!-- 직원 목록이 여기에 동적으로 로드됩니다 -->
                </div>
            </div>

            <!-- 직원 상세 정보 -->
            <div class="bg-black border border-blue-500 rounded-lg p-6">
                <h2 class="text-xl font-bold text-blue-400 mb-6">
                    <i class="fas fa-info-circle mr-2"></i>직원 상세 정보
                </h2>
                
                <div id="employee-details" class="space-y-4">
                    <div class="text-center text-gray-500 py-8">
                        <i class="fas fa-user text-4xl mb-4"></i>
                        <p>직원을 선택하여 상세 정보를 확인하세요</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 직원 성과 현황 -->
        <div class="mt-8 bg-black border border-blue-500 rounded-lg p-6">
            <h2 class="text-xl font-bold text-blue-400 mb-6">
                <i class="fas fa-chart-line mr-2"></i>직원 성과 현황
            </h2>
            
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-blue-500">
                            <th class="text-left py-3 px-4 text-blue-400">직원명</th>
                            <th class="text-left py-3 px-4 text-blue-400">직책</th>
                            <th class="text-left py-3 px-4 text-blue-400">소속 매장</th>
                            <th class="text-left py-3 px-4 text-blue-400">성과 점수</th>
                            <th class="text-left py-3 px-4 text-blue-400">상태</th>
                            <th class="text-left py-3 px-4 text-blue-400">작업</th>
                        </tr>
                    </thead>
                    <tbody id="performance-table">
                        <!-- 성과 현황이 여기에 동적으로 로드됩니다 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 새 직원 추가 모달 -->
    <div id="create-employee-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-gray-800 border border-blue-500 rounded-lg p-6 w-full max-w-md">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-blue-400">새 직원 추가</h3>
                    <button onclick="closeCreateEmployeeModal()" class="text-gray-400 hover:text-white">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <form id="create-employee-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">사용자명</label>
                        <input type="text" name="username" required class="backend-input" placeholder="사용자명을 입력하세요">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">이메일</label>
                        <input type="email" name="email" required class="backend-input" placeholder="이메일을 입력하세요">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">직책</label>
                        <select name="role" required class="backend-select">
                            <option value="">직책을 선택하세요</option>
                            <option value="manager">매니저</option>
                            <option value="employee">직원</option>
                            <option value="staff">스태프</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">소속 매장</label>
                        <select name="branch_id" class="backend-select">
                            <option value="">매장을 선택하세요</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">이름</label>
                        <input type="text" name="name" class="backend-input" placeholder="이름을 입력하세요">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">전화번호</label>
                        <input type="tel" name="phone" class="backend-input" placeholder="전화번호를 입력하세요">
                    </div>
                    
                    <div class="flex justify-end space-x-3 pt-4">
                        <button type="button" onclick="closeCreateEmployeeModal()" class="px-4 py-2 text-gray-300 hover:text-white transition-colors">
                            취소
                        </button>
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors">
                            추가
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // 페이지 로드 시 데이터 초기화
        document.addEventListener('DOMContentLoaded', function() {
            loadEmployeeStats();
            loadEmployeesList();
            loadPerformanceTable();
            loadBranchesForSelect();
        });

        // 직원 통계 로드
        function loadEmployeeStats() {
            fetch('/api/admin/employees')
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.data) {
                        const employees = data.data;
                        const activeEmployees = employees.filter(emp => emp.status === 'active').length;
                        const pendingEmployees = employees.filter(emp => emp.status === 'pending').length;
                        const avgPerformance = employees.reduce((sum, emp) => sum + (emp.performance_score || 0), 0) / employees.length;
                        
                        document.getElementById('total-employees').textContent = employees.length;
                        document.getElementById('active-employees').textContent = activeEmployees;
                        document.getElementById('pending-employees').textContent = pendingEmployees;
                        document.getElementById('avg-performance').textContent = Math.round(avgPerformance || 0) + '점';
                    }
                })
                .catch(error => {
                    console.error('직원 통계 로드 실패:', error);
                });
        }

        // 직원 목록 로드
        function loadEmployeesList() {
            fetch('/api/admin/employees')
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.data) {
                        const employeesList = document.getElementById('employees-list');
                        employeesList.innerHTML = '';
                        
                        data.data.forEach(employee => {
                            const employeeCard = document.createElement('div');
                            employeeCard.className = 'employee-card cursor-pointer hover:border-blue-500 transition-colors';
                            employeeCard.onclick = () => showEmployeeDetails(employee);
                            
                            employeeCard.innerHTML = `
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h3 class="font-semibold text-white">${employee.username}</h3>
                                        <p class="text-sm text-gray-400">${employee.email}</p>
                                        <p class="text-xs text-gray-500">${employee.branch_name || '소속 매장 없음'}</p>
                                    </div>
                                    <div class="text-right">
                                        <span class="inline-block px-2 py-1 text-xs rounded-full ${employee.status === 'active' ? 'bg-green-600 text-green-100' : 'bg-yellow-600 text-yellow-100'}">
                                            ${employee.status === 'active' ? '활성' : '대기 중'}
                                        </span>
                                        <p class="text-xs text-gray-400 mt-1">${employee.role}</p>
                                    </div>
                                </div>
                            `;
                            
                            employeesList.appendChild(employeeCard);
                        });
                    }
                })
                .catch(error => {
                    console.error('직원 목록 로드 실패:', error);
                });
        }

        // 직원 상세 정보 표시
        function showEmployeeDetails(employee) {
            const detailsContainer = document.getElementById('employee-details');
            detailsContainer.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-gray-800 border border-gray-700 rounded-lg p-4">
                        <h3 class="text-lg font-semibold text-white mb-2">${employee.username}</h3>
                        <div class="grid grid-cols-2 gap-4 text-sm">
                            <div>
                                <span class="text-gray-400">이메일:</span>
                                <span class="text-white">${employee.email}</span>
                            </div>
                            <div>
                                <span class="text-gray-400">직책:</span>
                                <span class="text-white">${employee.role}</span>
                            </div>
                            <div>
                                <span class="text-gray-400">소속 매장:</span>
                                <span class="text-white">${employee.branch_name || '없음'}</span>
                            </div>
                            <div>
                                <span class="text-gray-400">성과 점수:</span>
                                <span class="text-white">${employee.performance_score || 0}점</span>
                            </div>
                            <div>
                                <span class="text-gray-400">상태:</span>
                                <span class="inline-block px-2 py-1 text-xs rounded-full ${employee.status === 'active' ? 'bg-green-600 text-green-100' : 'bg-yellow-600 text-yellow-100'}">
                                    ${employee.status === 'active' ? '활성' : '대기 중'}
                                </span>
                            </div>
                            <div>
                                <span class="text-gray-400">생성일:</span>
                                <span class="text-white">${employee.created_at ? new Date(employee.created_at).toLocaleDateString() : '없음'}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex space-x-2">
                        <button onclick="editEmployee(${employee.id})" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors text-sm">
                            <i class="fas fa-edit mr-1"></i>수정
                        </button>
                        <button onclick="deleteEmployee(${employee.id})" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition-colors text-sm">
                            <i class="fas fa-trash mr-1"></i>삭제
                        </button>
                    </div>
                </div>
            `;
        }

        // 성과 현황 테이블 로드
        function loadPerformanceTable() {
            fetch('/api/admin/employees')
                .then(response => response.json())
                .then(data => {
                    if (data.employees) {
                        const tableBody = document.getElementById('performance-table');
                        tableBody.innerHTML = '';
                        
                        data.employees.forEach(employee => {
                            const row = document.createElement('tr');
                            row.className = 'border-b border-gray-700 hover:bg-gray-800 transition-colors';
                            
                            row.innerHTML = `
                                <td class="py-3 px-4">${employee.username}</td>
                                <td class="py-3 px-4">${employee.role}</td>
                                <td class="py-3 px-4">${employee.branch_name || '없음'}</td>
                                <td class="py-3 px-4">${employee.performance_score || 0}점</td>
                                <td class="py-3 px-4">
                                    <span class="inline-block px-2 py-1 text-xs rounded-full ${employee.status === 'active' ? 'bg-green-600 text-green-100' : 'bg-yellow-600 text-yellow-100'}">
                                        ${employee.status === 'active' ? '활성' : '대기 중'}
                                    </span>
                                </td>
                                <td class="py-3 px-4">
                                    <button onclick="viewEmployeePerformance(${employee.id})" class="text-blue-400 hover:text-blue-300 text-sm">
                                        <i class="fas fa-chart-bar mr-1"></i>성과 보기
                                    </button>
                                </td>
                            `;
                            
                            tableBody.appendChild(row);
                        });
                    }
                })
                .catch(error => {
                    console.error('성과 현황 로드 실패:', error);
                });
        }

        // 매장 목록 로드 (셀렉트 박스용)
        function loadBranchesForSelect() {
            fetch('/api/admin/branches')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const select = document.querySelector('select[name="branch_id"]');
                        data.data.forEach(branch => {
                            const option = document.createElement('option');
                            option.value = branch.id;
                            option.textContent = branch.name;
                            select.appendChild(option);
                        });
                    }
                })
                .catch(error => {
                    console.error('매장 목록 로드 실패:', error);
                });
        }

        // 모달 관련 함수들
        function openCreateEmployeeModal() {
            document.getElementById('create-employee-modal').classList.remove('hidden');
        }

        function closeCreateEmployeeModal() {
            document.getElementById('create-employee-modal').classList.add('hidden');
        }

        // 새 직원 생성
        document.getElementById('create-employee-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            fetch('/api/admin/employees', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    alert('직원이 성공적으로 생성되었습니다.');
                    closeCreateEmployeeModal();
                    loadEmployeeStats();
                    loadEmployeesList();
                    loadPerformanceTable();
                    e.target.reset();
                } else {
                    alert('직원 생성에 실패했습니다: ' + result.error);
                }
            })
            .catch(error => {
                console.error('직원 생성 오류:', error);
                alert('직원 생성 중 오류가 발생했습니다.');
            });
        });

        // 직원 수정
        function editEmployee(employeeId) {
            // 직원 수정 로직 구현
            alert('직원 수정 기능은 개발 중입니다.');
        }

        // 직원 삭제
        function deleteEmployee(employeeId) {
            if (confirm('정말로 이 직원을 삭제하시겠습니까?')) {
                fetch(`/api/admin/employees/${employeeId}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(result => {
                    if (result.success) {
                        alert('직원이 성공적으로 삭제되었습니다.');
                        loadEmployeeStats();
                        loadEmployeesList();
                        loadPerformanceTable();
                    } else {
                        alert('직원 삭제에 실패했습니다: ' + result.error);
                    }
                })
                .catch(error => {
                    console.error('직원 삭제 오류:', error);
                    alert('직원 삭제 중 오류가 발생했습니다.');
                });
            }
        }

        // 직원 성과 보기
        function viewEmployeePerformance(employeeId) {
            // 직원 성과 상세 보기 로직 구현
            alert('직원 성과 상세 보기 기능은 개발 중입니다.');
        }
    </script>
</body>
</html>
