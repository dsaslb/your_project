<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고급 데이터 분석 및 비즈니스 인텔리전스 대시보드</title>
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="/static/js/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        .dashboard-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .dashboard-card:hover {
            transform: translateY(-5px);
        }
        .metric-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        .metric-card:hover {
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .chart-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 20px;
            margin: 10px 0;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-healthy { background-color: #10b981; }
        .status-warning { background-color: #f59e0b; }
        .status-error { background-color: #ef4444; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- 헤더 -->
        <header class="bg-white shadow-sm border-b">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center py-4">
                    <div class="flex items-center">
                        <h1 class="text-2xl font-bold text-gray-900">
                            📊 고급 데이터 분석 및 비즈니스 인텔리전스
                        </h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="flex items-center">
                            <span class="status-indicator status-healthy" id="system-status"></span>
                            <span class="text-sm text-gray-600" id="status-text">시스템 정상</span>
                        </div>
                        <button onclick="refreshDashboard()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                            🔄 새로고침
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- 메인 콘텐츠 -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- 시스템 상태 카드 -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="dashboard-card p-6 text-white">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm opacity-90">데이터 파이프라인</p>
                            <p class="text-2xl font-bold" id="pipeline-status">로딩중...</p>
                        </div>
                        <div class="text-3xl">🔄</div>
                    </div>
                </div>
                
                <div class="dashboard-card p-6 text-white">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm opacity-90">비즈니스 인텔리전스</p>
                            <p class="text-2xl font-bold" id="bi-status">로딩중...</p>
                        </div>
                        <div class="text-3xl">📈</div>
                    </div>
                </div>
                
                <div class="dashboard-card p-6 text-white">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm opacity-90">예측 분석</p>
                            <p class="text-2xl font-bold" id="predictive-status">로딩중...</p>
                        </div>
                        <div class="text-3xl">🔮</div>
                    </div>
                </div>
                
                <div class="dashboard-card p-6 text-white">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm opacity-90">데이터 시각화</p>
                            <p class="text-2xl font-bold" id="visualization-status">로딩중...</p>
                        </div>
                        <div class="text-3xl">📊</div>
                    </div>
                </div>
            </div>

            <!-- KPI 메트릭 -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="metric-card p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-600">총 매출</p>
                            <p class="text-2xl font-bold text-gray-900" id="total-revenue">₩0</p>
                        </div>
                        <div class="text-green-500 text-sm" id="revenue-trend">+0%</div>
                    </div>
                </div>
                
                <div class="metric-card p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-600">주문 수</p>
                            <p class="text-2xl font-bold text-gray-900" id="total-orders">0</p>
                        </div>
                        <div class="text-blue-500 text-sm" id="orders-trend">+0%</div>
                    </div>
                </div>
                
                <div class="metric-card p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-600">고객 만족도</p>
                            <p class="text-2xl font-bold text-gray-900" id="satisfaction">0%</p>
                        </div>
                        <div class="text-yellow-500 text-sm" id="satisfaction-trend">+0%</div>
                    </div>
                </div>
                
                <div class="metric-card p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-600">예측 정확도</p>
                            <p class="text-2xl font-bold text-gray-900" id="prediction-accuracy">0%</p>
                        </div>
                        <div class="text-purple-500 text-sm" id="accuracy-trend">+0%</div>
                    </div>
                </div>
            </div>

            <!-- 차트 섹션 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                <!-- 매출 트렌드 차트 -->
                <div class="chart-container">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">📈 매출 트렌드</h3>
                    <div id="revenue-chart" style="height: 300px;"></div>
                </div>
                
                <!-- 주문 분석 차트 -->
                <div class="chart-container">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">🛒 주문 분석</h3>
                    <div id="orders-chart" style="height: 300px;"></div>
                </div>
            </div>

            <!-- 예측 분석 섹션 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                <!-- 예측 결과 -->
                <div class="chart-container">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">🔮 예측 분석</h3>
                    <div id="prediction-chart" style="height: 300px;"></div>
                </div>
                
                <!-- 이상 탐지 -->
                <div class="chart-container">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">⚠️ 이상 탐지</h3>
                    <div id="anomaly-chart" style="height: 300px;"></div>
                </div>
            </div>

            <!-- 실시간 데이터 스트림 -->
            <div class="chart-container mb-8">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">⚡ 실시간 데이터 스트림</h3>
                <div class="bg-gray-100 p-4 rounded-lg">
                    <div id="realtime-data" class="text-sm font-mono text-gray-700 max-h-40 overflow-y-auto">
                        <div class="text-gray-500">실시간 데이터를 기다리는 중...</div>
                    </div>
                </div>
            </div>

            <!-- 알림 섹션 -->
            <div class="chart-container">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">🔔 시스템 알림</h3>
                <div id="alerts-container" class="space-y-3">
                    <div class="text-gray-500">알림을 로딩하는 중...</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 전역 변수
        let realtimeInterval;
        let dashboardInterval;

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', function() {
            initializeDashboard();
            startRealtimeUpdates();
        });

        // 대시보드 초기화
        async function initializeDashboard() {
            try {
                await Promise.all([
                    loadSystemStatus(),
                    loadKPIMetrics(),
                    loadCharts(),
                    loadAlerts()
                ]);
            } catch (error) {
                console.error('대시보드 초기화 오류:', error);
                showError('대시보드 로딩 중 오류가 발생했습니다.');
            }
        }

        // 시스템 상태 로드
        async function loadSystemStatus() {
            try {
                const response = await axios.get('/api/analytics/health');
                const data = response.data;
                
                if (data.status === 'healthy') {
                    document.getElementById('system-status').className = 'status-indicator status-healthy';
                    document.getElementById('status-text').textContent = '시스템 정상';
                } else {
                    document.getElementById('system-status').className = 'status-indicator status-error';
                    document.getElementById('status-text').textContent = '시스템 오류';
                }

                // 각 모듈 상태 업데이트
                if (data.modules) {
                    updateModuleStatus('pipeline-status', data.modules.data_pipeline);
                    updateModuleStatus('bi-status', data.modules.business_intelligence);
                    updateModuleStatus('predictive-status', data.modules.predictive_analytics);
                    updateModuleStatus('visualization-status', data.modules.data_visualization);
                }
            } catch (error) {
                console.error('시스템 상태 로드 오류:', error);
                document.getElementById('system-status').className = 'status-indicator status-error';
                document.getElementById('status-text').textContent = '연결 오류';
            }
        }

        // 모듈 상태 업데이트
        function updateModuleStatus(elementId, status) {
            const element = document.getElementById(elementId);
            if (status && status.status === 'active') {
                element.textContent = '정상';
                element.className = 'text-2xl font-bold text-green-600';
            } else {
                element.textContent = '오류';
                element.className = 'text-2xl font-bold text-red-600';
            }
        }

        // KPI 메트릭 로드
        async function loadKPIMetrics() {
            try {
                const response = await axios.get('/api/analytics/bi/dashboard');
                const data = response.data.data;
                
                if (data.kpis) {
                    updateKPIMetric('total-revenue', data.kpis.revenue?.value || 0, '₩');
                    updateKPIMetric('total-orders', data.kpis.orders?.value || 0, '');
                    updateKPIMetric('satisfaction', data.kpis.satisfaction?.value || 0, '%');
                    updateKPIMetric('prediction-accuracy', data.kpis.accuracy?.value || 0, '%');
                }
            } catch (error) {
                console.error('KPI 메트릭 로드 오류:', error);
            }
        }

        // KPI 메트릭 업데이트
        function updateKPIMetric(elementId, value, unit) {
            const element = document.getElementById(elementId);
            if (unit === '₩') {
                element.textContent = unit + value.toLocaleString();
            } else if (unit === '%') {
                element.textContent = value.toFixed(1) + unit;
            } else {
                element.textContent = value.toLocaleString();
            }
        }

        // 차트 로드
        async function loadCharts() {
            try {
                // 매출 트렌드 차트
                const revenueData = {
                    x: ['1월', '2월', '3월', '4월', '5월', '6월'],
                    y: [1200000, 1350000, 1420000, 1580000, 1650000, 1800000],
                    type: 'scatter',
                    mode: 'lines+markers',
                    name: '매출',
                    line: { color: '#3b82f6', width: 3 },
                    marker: { size: 8 }
                };

                const revenueLayout = {
                    title: '월별 매출 트렌드',
                    xaxis: { title: '월' },
                    yaxis: { title: '매출 (원)' },
                    height: 300,
                    margin: { l: 50, r: 20, t: 40, b: 50 }
                };

                Plotly.newPlot('revenue-chart', [revenueData], revenueLayout);

                // 주문 분석 차트
                const ordersData = {
                    labels: ['온라인', '매장', '배달', '포장'],
                    datasets: [{
                        data: [45, 25, 20, 10],
                        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444'],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                };

                const ordersConfig = {
                    type: 'doughnut',
                    data: ordersData,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom'
                            }
                        }
                    }
                };

                new Chart(document.getElementById('orders-chart'), ordersConfig);

                // 예측 분석 차트
                const predictionData = {
                    x: ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월'],
                    y: [1200000, 1350000, 1420000, 1580000, 1650000, 1800000, 1950000, 2100000],
                    type: 'scatter',
                    mode: 'lines+markers',
                    name: '실제 매출',
                    line: { color: '#3b82f6', width: 3 }
                };

                const predictionForecast = {
                    x: ['6월', '7월', '8월'],
                    y: [1800000, 1950000, 2100000],
                    type: 'scatter',
                    mode: 'lines+markers',
                    name: '예측 매출',
                    line: { color: '#ef4444', width: 3, dash: 'dash' }
                };

                const predictionLayout = {
                    title: '매출 예측 분석',
                    xaxis: { title: '월' },
                    yaxis: { title: '매출 (원)' },
                    height: 300,
                    margin: { l: 50, r: 20, t: 40, b: 50 }
                };

                Plotly.newPlot('prediction-chart', [predictionData, predictionForecast], predictionLayout);

                // 이상 탐지 차트
                const anomalyData = {
                    x: Array.from({length: 30}, (_, i) => i + 1),
                    y: Array.from({length: 30}, () => Math.random() * 100 + 50),
                    type: 'scatter',
                    mode: 'markers',
                    name: '정상 데이터',
                    marker: { color: '#10b981', size: 6 }
                };

                // 이상 데이터 추가
                const anomalyPoints = [5, 12, 18, 25];
                anomalyPoints.forEach(i => {
                    anomalyData.y[i-1] = Math.random() * 200 + 150;
                });

                const anomalyLayout = {
                    title: '이상 탐지 결과',
                    xaxis: { title: '시간' },
                    yaxis: { title: '값' },
                    height: 300,
                    margin: { l: 50, r: 20, t: 40, b: 50 }
                };

                Plotly.newPlot('anomaly-chart', [anomalyData], anomalyLayout);

            } catch (error) {
                console.error('차트 로드 오류:', error);
            }
        }

        // 알림 로드
        async function loadAlerts() {
            try {
                const response = await axios.get('/api/analytics/bi/alerts');
                const alerts = response.data.data || [];
                
                const container = document.getElementById('alerts-container');
                if (alerts.length === 0) {
                    container.innerHTML = '<div class="text-gray-500">현재 알림이 없습니다.</div>';
                    return;
                }

                container.innerHTML = alerts.map(alert => `
                    <div class="flex items-center p-3 bg-${alert.level === 'high' ? 'red' : alert.level === 'medium' ? 'yellow' : 'blue'}-50 border border-${alert.level === 'high' ? 'red' : alert.level === 'medium' ? 'yellow' : 'blue'}-200 rounded-lg">
                        <div class="flex-shrink-0">
                            <span class="text-${alert.level === 'high' ? 'red' : alert.level === 'medium' ? 'yellow' : 'blue'}-500">⚠️</span>
                        </div>
                        <div class="ml-3">
                            <p class="text-sm font-medium text-gray-900">${alert.message}</p>
                            <p class="text-xs text-gray-500">${new Date(alert.timestamp).toLocaleString()}</p>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('알림 로드 오류:', error);
                document.getElementById('alerts-container').innerHTML = '<div class="text-red-500">알림을 로드할 수 없습니다.</div>';
            }
        }

        // 실시간 업데이트 시작
        function startRealtimeUpdates() {
            // 실시간 데이터 스트림
            realtimeInterval = setInterval(async () => {
                try {
                    const response = await axios.post('/api/analytics/pipeline/stream', {
                        timestamp: new Date().toISOString(),
                        data: {
                            orders: Math.floor(Math.random() * 10) + 1,
                            revenue: Math.floor(Math.random() * 100000) + 50000,
                            customers: Math.floor(Math.random() * 20) + 5
                        }
                    });
                    
                    const container = document.getElementById('realtime-data');
                    const timestamp = new Date().toLocaleTimeString();
                    const newEntry = `<div>[${timestamp}] 실시간 데이터 수신: ${JSON.stringify(response.data.data)}</div>`;
                    
                    container.innerHTML = newEntry + container.innerHTML;
                    
                    // 최대 10개 항목만 유지
                    const entries = container.children;
                    if (entries.length > 10) {
                        container.removeChild(entries[entries.length - 1]);
                    }
                } catch (error) {
                    console.error('실시간 데이터 스트림 오류:', error);
                }
            }, 5000);

            // 대시보드 주기적 새로고침
            dashboardInterval = setInterval(() => {
                loadSystemStatus();
                loadKPIMetrics();
            }, 30000);
        }

        // 대시보드 새로고침
        async function refreshDashboard() {
            const button = event.target;
            const originalText = button.textContent;
            button.textContent = '🔄 새로고침 중...';
            button.disabled = true;

            try {
                await initializeDashboard();
                showSuccess('대시보드가 새로고침되었습니다.');
            } catch (error) {
                showError('새로고침 중 오류가 발생했습니다.');
            } finally {
                button.textContent = originalText;
                button.disabled = false;
            }
        }

        // 성공 메시지 표시
        function showSuccess(message) {
            // 간단한 토스트 메시지 구현
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg z-50';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                document.body.removeChild(toast);
            }, 3000);
        }

        // 오류 메시지 표시
        function showError(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 right-4 bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg z-50';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                document.body.removeChild(toast);
            }, 3000);
        }

        // 페이지 언로드 시 인터벌 정리
        window.addEventListener('beforeunload', () => {
            if (realtimeInterval) clearInterval(realtimeInterval);
            if (dashboardInterval) clearInterval(dashboardInterval);
        });
    </script>
</body>
</html>
