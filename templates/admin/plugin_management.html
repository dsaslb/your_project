<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플러그인 관리 - 백엔드 관리자</title>
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons@4.29.0/dist/feather.min.js"></script>
</head>
<body class="bg-background">
    <!-- 사이드바 -->
    <div class="flex h-screen">
        <div class="w-64 bg-card border-r border-border">
            <div class="p-4">
                <h1 class="text-xl font-bold text-card-foreground">백엔드 관리자</h1>
                <p class="text-muted-foreground text-sm">시스템 운영 관리</p>
            </div>
            
            <nav class="mt-8">
                <div class="px-4 py-2">
                    <h3 class="text-xs font-semibold text-muted-foreground uppercase tracking-wider">관리자 기능</h3>
                </div>
                
                <a href="/admin/backend" class="flex items-center px-4 py-3 text-muted-foreground hover:bg-accent hover:text-accent-foreground transition-colors">
                    <i data-feather="home" class="w-5 h-5 mr-3"></i>
                    대시보드
                </a>
                
                <a href="/admin/backend/industry-admin" class="flex items-center px-4 py-3 text-muted-foreground hover:bg-accent hover:text-accent-foreground transition-colors">
                    <i data-feather="users" class="w-5 h-5 mr-3"></i>
                    업종별 관리자 승인/관리
                </a>
                
                <a href="/admin/backend/plugin-marketplace" class="flex items-center px-4 py-3 text-muted-foreground hover:bg-accent hover:text-accent-foreground transition-colors">
                    <i data-feather="package" class="w-5 h-5 mr-3"></i>
                    플러그인 마켓플레이스
                </a>
                
                <a href="/admin/backend/plugin-management" class="flex items-center px-4 py-3 bg-accent text-accent-foreground">
                    <i data-feather="settings" class="w-5 h-5 mr-3"></i>
                    플러그인 관리/개발
                </a>
                
                <a href="/admin/backend/system-monitoring" class="flex items-center px-4 py-3 text-muted-foreground hover:bg-accent hover:text-accent-foreground transition-colors">
                    <i data-feather="activity" class="w-5 h-5 mr-3"></i>
                    시스템/서버 운영/모니터링
                </a>
                
                <a href="/admin/backend/security" class="flex items-center px-4 py-3 text-muted-foreground hover:bg-accent hover:text-accent-foreground transition-colors">
                    <i data-feather="shield" class="w-5 h-5 mr-3"></i>
                    보안 관리
                </a>
                
                <a href="/admin/backend/events" class="flex items-center px-4 py-3 text-muted-foreground hover:bg-accent hover:text-accent-foreground transition-colors">
                    <i data-feather="bell" class="w-5 h-5 mr-3"></i>
                    실시간 이벤트/알림
                </a>
                
                <a href="/admin/backend/docs" class="flex items-center px-4 py-3 text-muted-foreground hover:bg-accent hover:text-accent-foreground transition-colors">
                    <i data-feather="file-text" class="w-5 h-5 mr-3"></i>
                    API/DB 문서
                </a>
            </nav>
        </div>

        <!-- 메인 콘텐츠 -->
        <div class="flex-1 overflow-auto">
            <!-- 헤더 -->
            <header class="bg-card border-b border-border shadow-sm">
                <div class="flex items-center justify-between px-6 py-4">
                    <div>
                        <h2 class="text-2xl font-bold text-card-foreground">플러그인 관리</h2>
                        <p class="text-muted-foreground">설치된 플러그인 관리 및 개발</p>
                    </div>
                    <div class="flex items-center space-x-4">
                        <a href="/admin/backend" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-9 px-4 py-2">
                            <i data-feather="arrow-left" class="w-4 h-4 mr-2"></i>
                            뒤로가기
                        </a>
                    </div>
                </div>
            </header>

            <!-- 메인 콘텐츠 -->
            <main class="p-6">
                <!-- 플러그인 통계 -->
                <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-4 mb-8">
                    <div class="rounded-xl border bg-card text-card-foreground shadow">
                        <div class="p-6 flex flex-row items-center justify-between space-y-0 pb-2">
                            <h3 class="tracking-tight text-sm font-medium">총 플러그인</h3>
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                class="h-4 w-4 text-muted-foreground"
                            >
                                <rect width="20" height="14" x="2" y="5" rx="2" />
                                <path d="M2 10h20" />
                            </svg>
                        </div>
                        <div class="p-6 pt-0">
                            <div class="text-2xl font-bold" id="total-plugins">0</div>
                            <p class="text-xs text-muted-foreground">설치된 플러그인</p>
                        </div>
                    </div>

                    <div class="rounded-xl border bg-card text-card-foreground shadow">
                        <div class="p-6 flex flex-row items-center justify-between space-y-0 pb-2">
                            <h3 class="tracking-tight text-sm font-medium">활성 플러그인</h3>
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                class="h-4 w-4 text-green-600"
                            >
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                                <polyline points="22,4 12,14.01 9,11.01" />
                            </svg>
                        </div>
                        <div class="p-6 pt-0">
                            <div class="text-2xl font-bold text-green-600" id="active-plugins">0</div>
                            <p class="text-xs text-muted-foreground">현재 활성화</p>
                        </div>
                    </div>

                    <div class="rounded-xl border bg-card text-card-foreground shadow">
                        <div class="p-6 flex flex-row items-center justify-between space-y-0 pb-2">
                            <h3 class="tracking-tight text-sm font-medium">비활성 플러그인</h3>
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                class="h-4 w-4 text-yellow-600"
                            >
                                <path d="M18.364 18.364A9 9 0 1 1 5.636 5.636a9 9 0 0 1 12.728 12.728zM12 8v4m0 4h.01" />
                            </svg>
                        </div>
                        <div class="p-6 pt-0">
                            <div class="text-2xl font-bold text-yellow-600" id="inactive-plugins">0</div>
                            <p class="text-xs text-muted-foreground">비활성화됨</p>
                        </div>
                    </div>

                    <div class="rounded-xl border bg-card text-card-foreground shadow">
                        <div class="p-6 flex flex-row items-center justify-between space-y-0 pb-2">
                            <h3 class="tracking-tight text-sm font-medium">업데이트 필요</h3>
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                class="h-4 w-4 text-orange-600"
                            >
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                <polyline points="7,10 12,15 17,10" />
                                <line x1="12" x2="12" y1="15" y2="3" />
                            </svg>
                        </div>
                        <div class="p-6 pt-0">
                            <div class="text-2xl font-bold text-orange-600" id="update-needed">0</div>
                            <p class="text-xs text-muted-foreground">업데이트 대기</p>
                        </div>
                    </div>
                </div>

                <!-- 플러그인 목록 -->
                <div class="rounded-xl border bg-card text-card-foreground shadow">
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-lg font-semibold">설치된 플러그인 목록</h3>
                            <div class="flex space-x-2">
                                <button class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground shadow hover:bg-primary/90 h-9 px-4 py-2">
                                    <i data-feather="refresh-cw" class="w-4 h-4 mr-2"></i>
                                    새로고침
                                </button>
                                <button class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-9 px-4 py-2">
                                    <i data-feather="plus" class="w-4 h-4 mr-2"></i>
                                    새 플러그인
                                </button>
                            </div>
                        </div>

                        <!-- 플러그인 테이블 -->
                        <div class="rounded-md border">
                            <div class="relative w-full overflow-auto">
                                <table class="w-full caption-bottom text-sm">
                                    <thead class="[&_tr]:border-b">
                                        <tr class="border-b transition-colors hover:bg-muted/50 data-[state=selected]:bg-muted">
                                            <th class="h-10 px-2 text-left align-middle font-medium text-muted-foreground [&:has([role=checkbox])]:pr-0 [&>[role=checkbox]]:translate-y-[2px]">
                                                플러그인명
                                            </th>
                                            <th class="h-10 px-2 text-left align-middle font-medium text-muted-foreground [&:has([role=checkbox])]:pr-0 [&>[role=checkbox]]:translate-y-[2px]">
                                                버전
                                            </th>
                                            <th class="h-10 px-2 text-left align-middle font-medium text-muted-foreground [&:has([role=checkbox])]:pr-0 [&>[role=checkbox]]:translate-y-[2px]">
                                                상태
                                            </th>
                                            <th class="h-10 px-2 text-left align-middle font-medium text-muted-foreground [&:has([role=checkbox])]:pr-0 [&>[role=checkbox]]:translate-y-[2px]">
                                                설치일
                                            </th>
                                            <th class="h-10 px-2 text-left align-middle font-medium text-muted-foreground [&:has([role=checkbox])]:pr-0 [&>[role=checkbox]]:translate-y-[2px]">
                                                액션
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody class="[&_tr:last-child]:border-0" id="plugins-table-body">
                                        <!-- 플러그인 목록이 여기에 동적으로 추가됩니다 -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        // Feather 아이콘 초기화
        if (typeof feather !== 'undefined') {
            feather.replace();
        }

        // 플러그인 목록 로드
        async function loadPlugins() {
            try {
                const response = await fetch('/api/backend/plugins/list');
                const data = await response.json();
                
                if (data.success) {
                    updatePluginStats(data.plugins);
                    renderPluginTable(data.plugins);
                }
            } catch (error) {
                console.error('플러그인 목록 로드 실패:', error);
            }
        }

        // 플러그인 통계 업데이트
        function updatePluginStats(plugins) {
            const total = plugins.length;
            const active = plugins.filter(p => p.is_active).length;
            const inactive = total - active;
            const updateNeeded = plugins.filter(p => p.needs_update).length;

            document.getElementById('total-plugins').textContent = total;
            document.getElementById('active-plugins').textContent = active;
            document.getElementById('inactive-plugins').textContent = inactive;
            document.getElementById('update-needed').textContent = updateNeeded;
        }

        // 플러그인 테이블 렌더링
        function renderPluginTable(plugins) {
            const tbody = document.getElementById('plugins-table-body');
            tbody.innerHTML = '';

            plugins.forEach(plugin => {
                const row = document.createElement('tr');
                row.className = 'border-b transition-colors hover:bg-muted/50 data-[state=selected]:bg-muted';
                
                const statusBadge = plugin.is_active 
                    ? '<span class="inline-flex items-center rounded-md bg-green-100 px-2.5 py-0.5 text-xs font-medium text-green-800 dark:bg-green-900 dark:text-green-300">활성</span>'
                    : '<span class="inline-flex items-center rounded-md bg-yellow-100 px-2.5 py-0.5 text-xs font-medium text-yellow-800 dark:bg-yellow-900 dark:text-yellow-300">비활성</span>';

                row.innerHTML = `
                    <td class="p-2 align-middle [&:has([role=checkbox])]:pr-0 [&>[role=checkbox]]:translate-y-[2px]">
                        <div>
                            <p class="font-medium">${plugin.name}</p>
                            <p class="text-xs text-muted-foreground">${plugin.description || '설명 없음'}</p>
                        </div>
                    </td>
                    <td class="p-2 align-middle [&:has([role=checkbox])]:pr-0 [&>[role=checkbox]]:translate-y-[2px]">
                        ${plugin.version}
                    </td>
                    <td class="p-2 align-middle [&:has([role=checkbox])]:pr-0 [&>[role=checkbox]]:translate-y-[2px]">
                        ${statusBadge}
                    </td>
                    <td class="p-2 align-middle [&:has([role=checkbox])]:pr-0 [&>[role=checkbox]]:translate-y-[2px]">
                        ${new Date(plugin.installed_at).toLocaleDateString()}
                    </td>
                    <td class="p-2 align-middle [&:has([role=checkbox])]:pr-0 [&>[role=checkbox]]:translate-y-[2px]">
                        <div class="flex space-x-2">
                            <button onclick="togglePlugin('${plugin.id}')" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-8 px-3">
                                ${plugin.is_active ? '비활성화' : '활성화'}
                            </button>
                            <button onclick="uninstallPlugin('${plugin.id}')" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 bg-destructive text-destructive-foreground shadow-sm hover:bg-destructive/90 h-8 px-3">
                                제거
                            </button>
                        </div>
                    </td>
                `;
                
                tbody.appendChild(row);
            });
        }

        // 플러그인 활성화/비활성화
        async function togglePlugin(pluginId) {
            try {
                const response = await fetch(`/api/backend/plugin/toggle/${pluginId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const data = await response.json();
                if (data.success) {
                    loadPlugins(); // 목록 새로고침
                } else {
                    alert('플러그인 상태 변경에 실패했습니다.');
                }
            } catch (error) {
                console.error('플러그인 토글 실패:', error);
                alert('플러그인 상태 변경에 실패했습니다.');
            }
        }

        // 플러그인 제거
        async function uninstallPlugin(pluginId) {
            if (!confirm('정말로 이 플러그인을 제거하시겠습니까?')) {
                return;
            }

            try {
                const response = await fetch(`/api/backend/plugin/uninstall/${pluginId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const data = await response.json();
                if (data.success) {
                    loadPlugins(); // 목록 새로고침
                } else {
                    alert('플러그인 제거에 실패했습니다.');
                }
            } catch (error) {
                console.error('플러그인 제거 실패:', error);
                alert('플러그인 제거에 실패했습니다.');
            }
        }

        // 페이지 로드 시 플러그인 목록 로드
        document.addEventListener('DOMContentLoaded', function() {
            loadPlugins();
        });
    </script>

    <style>
        :root {
            --background: 0 0% 100%;
            --foreground: 222.2 84% 4.9%;
            --card: 0 0% 100%;
            --card-foreground: 222.2 84% 4.9%;
            --popover: 0 0% 100%;
            --popover-foreground: 222.2 84% 4.9%;
            --primary: 222.2 47.4% 11.2%;
            --primary-foreground: 210 40% 98%;
            --secondary: 210 40% 96%;
            --secondary-foreground: 222.2 84% 4.9%;
            --muted: 210 40% 96%;
            --muted-foreground: 215.4 16.3% 46.9%;
            --accent: 210 40% 96%;
            --accent-foreground: 222.2 84% 4.9%;
            --destructive: 0 84.2% 60.2%;
            --destructive-foreground: 210 40% 98%;
            --border: 214.3 31.8% 91.4%;
            --input: 214.3 31.8% 91.4%;
            --ring: 222.2 84% 4.9%;
            --radius: 0.5rem;
        }

        .dark {
            --background: 222.2 84% 4.9%;
            --foreground: 210 40% 98%;
            --card: 222.2 84% 4.9%;
            --card-foreground: 210 40% 98%;
            --popover: 222.2 84% 4.9%;
            --popover-foreground: 210 40% 98%;
            --primary: 210 40% 98%;
            --primary-foreground: 222.2 47.4% 11.2%;
            --secondary: 217.2 32.6% 17.5%;
            --secondary-foreground: 210 40% 98%;
            --muted: 217.2 32.6% 17.5%;
            --muted-foreground: 215 20.2% 65.1%;
            --accent: 217.2 32.6% 17.5%;
            --accent-foreground: 210 40% 98%;
            --destructive: 0 62.8% 30.6%;
            --destructive-foreground: 210 40% 98%;
            --border: 217.2 32.6% 17.5%;
            --input: 217.2 32.6% 17.5%;
            --ring: 212.7 26.8% 83.9%;
        }

        * {
            border-color: hsl(var(--border));
        }

        body {
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
        }

        .bg-background {
            background-color: hsl(var(--background));
        }

        .bg-card {
            background-color: hsl(var(--card));
        }

        .text-card-foreground {
            color: hsl(var(--card-foreground));
        }

        .text-foreground {
            color: hsl(var(--foreground));
        }

        .text-muted-foreground {
            color: hsl(var(--muted-foreground));
        }

        .border {
            border-color: hsl(var(--border));
        }

        .border-input {
            border-color: hsl(var(--input));
        }

        .bg-accent {
            background-color: hsl(var(--accent));
        }

        .text-accent-foreground {
            color: hsl(var(--accent-foreground));
        }

        .bg-primary {
            background-color: hsl(var(--primary));
        }

        .text-primary-foreground {
            color: hsl(var(--primary-foreground));
        }

        .bg-destructive {
            background-color: hsl(var(--destructive));
        }

        .text-destructive-foreground {
            color: hsl(var(--destructive-foreground));
        }

        .hover\:bg-accent:hover {
            background-color: hsl(var(--accent));
        }

        .hover\:text-accent-foreground:hover {
            color: hsl(var(--accent-foreground));
        }

        .hover\:bg-primary\/90:hover {
            background-color: hsl(var(--primary) / 0.9);
        }

        .hover\:bg-destructive\/90:hover {
            background-color: hsl(var(--destructive) / 0.9);
        }

        .focus-visible\:ring-ring:focus-visible {
            --tw-ring-color: hsl(var(--ring));
        }

        .disabled\:opacity-50:disabled {
            opacity: 0.5;
        }

        .disabled\:cursor-not-allowed:disabled {
            cursor: not-allowed;
        }

        .disabled\:pointer-events-none:disabled {
            pointer-events: none;
        }
    </style>
</body>
</html>
