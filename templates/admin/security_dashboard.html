<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보안 대시보드 - 관리자</title>
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- 헤더 -->
        <header class="bg-white shadow-sm border-b">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center py-4">
                    <h1 class="text-2xl font-bold text-gray-900">보안 대시보드</h1>
                    <div class="flex items-center space-x-4">
                        <span class="text-sm text-gray-500" id="last-updated"></span>
                        <button onclick="refreshData()" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                            새로고침
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- 메인 콘텐츠 -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- 보안 상태 카드 -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="p-2 bg-green-100 rounded-lg">
                            <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-500">MFA 활성 사용자</p>
                            <p class="text-2xl font-semibold text-gray-900" id="mfa-users">-</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="p-2 bg-red-100 rounded-lg">
                            <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                            </svg>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-500">활성 위협</p>
                            <p class="text-2xl font-semibold text-gray-900" id="active-threats">-</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="p-2 bg-yellow-100 rounded-lg">
                            <svg class="w-6 h-6 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192L5.636 18.364M12 2.25a9.75 9.75 0 100 19.5 9.75 9.75 0 000-19.5z"></path>
                            </svg>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-500">차단된 IP</p>
                            <p class="text-2xl font-semibold text-gray-900" id="blocked-ips">-</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="p-2 bg-blue-100 rounded-lg">
                            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-500">최근 감사 이벤트</p>
                            <p class="text-2xl font-semibold text-gray-900" id="recent-events">-</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 차트 섹션 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                <!-- 위협 타입별 분포 -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">위협 타입별 분포</h3>
                    <canvas id="threatChart" width="400" height="200"></canvas>
                </div>

                <!-- 시간별 보안 이벤트 -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">시간별 보안 이벤트</h3>
                    <canvas id="eventChart" width="400" height="200"></canvas>
                </div>
            </div>

            <!-- 탭 섹션 -->
            <div class="bg-white rounded-lg shadow">
                <div class="border-b border-gray-200">
                    <nav class="-mb-px flex space-x-8 px-6">
                        <button onclick="showTab('mfa')" class="tab-button py-4 px-1 border-b-2 border-blue-500 font-medium text-sm text-blue-600" id="tab-mfa">
                            다중 인증 (MFA)
                        </button>
                        <button onclick="showTab('encryption')" class="tab-button py-4 px-1 border-b-2 border-transparent font-medium text-sm text-gray-500 hover:text-gray-700" id="tab-encryption">
                            데이터 암호화
                        </button>
                        <button onclick="showTab('audit')" class="tab-button py-4 px-1 border-b-2 border-transparent font-medium text-sm text-gray-500 hover:text-gray-700" id="tab-audit">
                            감사 로그
                        </button>
                        <button onclick="showTab('threats')" class="tab-button py-4 px-1 border-b-2 border-transparent font-medium text-sm text-gray-500 hover:text-gray-700" id="tab-threats">
                            위협 탐지
                        </button>
                    </nav>
                </div>

                <!-- MFA 탭 -->
                <div id="tab-content-mfa" class="tab-content p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-lg font-semibold text-gray-900">다중 인증 관리</h3>
                        <button onclick="setupMFA()" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                            MFA 설정
                        </button>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-gray-50 rounded-lg p-4">
                            <h4 class="font-medium text-gray-900 mb-2">MFA 설정</h4>
                            <div id="mfa-setup-form" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">사용자 ID</label>
                                    <input type="text" id="mfa-user-id" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                                </div>
                                <button onclick="setupMFAForUser()" class="w-full bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700">
                                    MFA 설정
                                </button>
                            </div>
                        </div>

                        <div class="bg-gray-50 rounded-lg p-4">
                            <h4 class="font-medium text-gray-900 mb-2">MFA 인증</h4>
                            <div id="mfa-verify-form" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">사용자 ID</label>
                                    <input type="text" id="verify-user-id" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">인증 코드</label>
                                    <input type="text" id="verify-code" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                                </div>
                                <button onclick="verifyMFA()" class="w-full bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                                    인증 확인
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 암호화 탭 -->
                <div id="tab-content-encryption" class="tab-content p-6 hidden">
                    <h3 class="text-lg font-semibold text-gray-900 mb-6">데이터 암호화</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-gray-50 rounded-lg p-4">
                            <h4 class="font-medium text-gray-900 mb-2">데이터 암호화</h4>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">암호화할 텍스트</label>
                                    <textarea id="encrypt-text" rows="4" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"></textarea>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">암호화 타입</label>
                                    <select id="encrypt-type" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                                        <option value="symmetric">대칭 암호화</option>
                                        <option value="asymmetric">비대칭 암호화</option>
                                    </select>
                                </div>
                                <button onclick="encryptData()" class="w-full bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700">
                                    암호화
                                </button>
                                <div id="encrypt-result" class="hidden">
                                    <label class="block text-sm font-medium text-gray-700">암호화된 데이터</label>
                                    <textarea id="encrypted-data" rows="4" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500" readonly></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="bg-gray-50 rounded-lg p-4">
                            <h4 class="font-medium text-gray-900 mb-2">데이터 복호화</h4>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">암호화된 데이터</label>
                                    <textarea id="decrypt-data" rows="4" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"></textarea>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">암호화 타입</label>
                                    <select id="decrypt-type" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                                        <option value="symmetric">대칭 암호화</option>
                                        <option value="asymmetric">비대칭 암호화</option>
                                    </select>
                                </div>
                                <button onclick="decryptData()" class="w-full bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                                    복호화
                                </button>
                                <div id="decrypt-result" class="hidden">
                                    <label class="block text-sm font-medium text-gray-700">복호화된 데이터</label>
                                    <textarea id="decrypted-data" rows="4" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500" readonly></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 감사 로그 탭 -->
                <div id="tab-content-audit" class="tab-content p-6 hidden">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-lg font-semibold text-gray-900">감사 로그</h3>
                        <div class="flex space-x-2">
                            <button onclick="exportAuditLogs()" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700">
                                내보내기
                            </button>
                            <button onclick="loadAuditLogs()" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                                새로고침
                            </button>
                        </div>
                    </div>

                    <!-- 필터 -->
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">이벤트 타입</label>
                            <select id="audit-event-type" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                                <option value="">모든 타입</option>
                                <option value="login">로그인</option>
                                <option value="logout">로그아웃</option>
                                <option value="mfa_setup">MFA 설정</option>
                                <option value="mfa_verification">MFA 인증</option>
                                <option value="data_encryption">데이터 암호화</option>
                                <option value="data_decryption">데이터 복호화</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">사용자 ID</label>
                            <input type="text" id="audit-user-id" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">시작 날짜</label>
                            <input type="date" id="audit-start-date" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">종료 날짜</label>
                            <input type="date" id="audit-end-date" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>

                    <!-- 감사 로그 테이블 -->
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">시간</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">이벤트 타입</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">사용자 ID</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">IP 주소</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">위험도</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">상세 정보</th>
                                </tr>
                            </thead>
                            <tbody id="audit-logs-table" class="bg-white divide-y divide-gray-200">
                                <!-- 동적으로 로드됨 -->
                            </tbody>
                        </table>
                    </div>

                    <!-- 페이지네이션 -->
                    <div id="audit-pagination" class="mt-4 flex justify-between items-center">
                        <!-- 동적으로 로드됨 -->
                    </div>
                </div>

                <!-- 위협 탐지 탭 -->
                <div id="tab-content-threats" class="tab-content p-6 hidden">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-lg font-semibold text-gray-900">위협 탐지</h3>
                        <button onclick="loadThreats()" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                            새로고침
                        </button>
                    </div>

                    <!-- IP 차단 -->
                    <div class="bg-gray-50 rounded-lg p-4 mb-6">
                        <h4 class="font-medium text-gray-900 mb-4">IP 차단 관리</h4>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">IP 주소</label>
                                <input type="text" id="block-ip" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">차단 사유</label>
                                <input type="text" id="block-reason" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">차단 기간 (초)</label>
                                <input type="number" id="block-duration" value="3600" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                            </div>
                        </div>
                        <div class="mt-4 flex space-x-2">
                            <button onclick="blockIP()" class="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700">
                                IP 차단
                            </button>
                            <button onclick="unblockIP()" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700">
                                IP 차단 해제
                            </button>
                        </div>
                    </div>

                    <!-- 위협 로그 테이블 -->
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">시간</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">위협 타입</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">IP 주소</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">사용자 ID</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">위험도</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">응답 조치</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">상세 정보</th>
                                </tr>
                            </thead>
                            <tbody id="threats-table" class="bg-white divide-y divide-gray-200">
                                <!-- 동적으로 로드됨 -->
                            </tbody>
                        </table>
                    </div>

                    <!-- 페이지네이션 -->
                    <div id="threats-pagination" class="mt-4 flex justify-between items-center">
                        <!-- 동적으로 로드됨 -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 전역 변수
        let currentTab = 'mfa';
        let threatChart = null;
        let eventChart = null;

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', function() {
            loadSecurityStatus();
            loadAuditLogs();
            loadThreats();
            updateLastUpdated();
            
            // 30초마다 자동 새로고침
            setInterval(refreshData, 30000);
        });

        // 탭 전환
        function showTab(tabName) {
            // 모든 탭 콘텐츠 숨기기
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.add('hidden');
            });
            
            // 모든 탭 버튼 비활성화
            document.querySelectorAll('.tab-button').forEach(button => {
                button.classList.remove('border-blue-500', 'text-blue-600');
                button.classList.add('border-transparent', 'text-gray-500');
            });
            
            // 선택된 탭 활성화
            document.getElementById(`tab-content-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}`).classList.remove('border-transparent', 'text-gray-500');
            document.getElementById(`tab-${tabName}`).classList.add('border-blue-500', 'text-blue-600');
            
            currentTab = tabName;
        }

        // 보안 상태 로드
        async function loadSecurityStatus() {
            try {
                const response = await axios.get('/api/security/security-status');
                if (response.data.success) {
                    const status = response.data.status;
                    
                    document.getElementById('mfa-users').textContent = status.mfa_enabled_users;
                    document.getElementById('active-threats').textContent = status.active_threats;
                    document.getElementById('blocked-ips').textContent = status.blocked_ips;
                    document.getElementById('recent_audit_events').textContent = status.recent_audit_events;
                    
                    // 차트 업데이트
                    updateCharts(status);
                }
            } catch (error) {
                console.error('보안 상태 로드 오류:', error);
            }
        }

        // 차트 업데이트
        function updateCharts(status) {
            // 위협 타입별 분포 차트
            const threatCtx = document.getElementById('threatChart').getContext('2d');
            if (threatChart) {
                threatChart.destroy();
            }
            
            threatChart = new Chart(threatCtx, {
                type: 'doughnut',
                data: {
                    labels: ['SQL Injection', 'XSS', 'CSRF', 'Brute Force', 'DDoS'],
                    datasets: [{
                        data: [12, 19, 8, 15, 6],
                        backgroundColor: [
                            '#EF4444',
                            '#F59E0B',
                            '#10B981',
                            '#3B82F6',
                            '#8B5CF6'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });

            // 시간별 보안 이벤트 차트
            const eventCtx = document.getElementById('eventChart').getContext('2d');
            if (eventChart) {
                eventChart.destroy();
            }
            
            eventChart = new Chart(eventCtx, {
                type: 'line',
                data: {
                    labels: ['00:00', '04:00', '08:00', '12:00', '16:00', '20:00'],
                    datasets: [{
                        label: '보안 이벤트',
                        data: [5, 8, 12, 15, 10, 7],
                        borderColor: '#3B82F6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        // MFA 설정
        async function setupMFAForUser() {
            const userId = document.getElementById('mfa-user-id').value;
            if (!userId) {
                alert('사용자 ID를 입력해주세요.');
                return;
            }

            try {
                const response = await axios.post('/api/security/mfa/setup', {
                    user_id: userId
                });
                
                if (response.data.success) {
                    alert(`MFA 설정이 완료되었습니다.\n시크릿: ${response.data.secret}\n백업 코드: ${response.data.backup_codes.join(', ')}`);
                } else {
                    alert('MFA 설정에 실패했습니다.');
                }
            } catch (error) {
                console.error('MFA 설정 오류:', error);
                alert('MFA 설정 중 오류가 발생했습니다.');
            }
        }

        // MFA 인증
        async function verifyMFA() {
            const userId = document.getElementById('verify-user-id').value;
            const code = document.getElementById('verify-code').value;
            
            if (!userId || !code) {
                alert('사용자 ID와 인증 코드를 입력해주세요.');
                return;
            }

            try {
                const response = await axios.post('/api/security/mfa/verify', {
                    user_id: userId,
                    code: code,
                    method: 'totp'
                });
                
                if (response.data.success) {
                    alert('MFA 인증이 성공했습니다.');
                } else {
                    alert('MFA 인증에 실패했습니다.');
                }
            } catch (error) {
                console.error('MFA 인증 오류:', error);
                alert('MFA 인증 중 오류가 발생했습니다.');
            }
        }

        // 감사 로그 로드
        async function loadAuditLogs(page = 1) {
            const eventType = document.getElementById('audit-event-type').value;
            const userId = document.getElementById('audit-user-id').value;
            const startDate = document.getElementById('audit-start-date').value;
            const endDate = document.getElementById('audit-end-date').value;

            try {
                const params = new URLSearchParams({
                    page: page,
                    per_page: 20
                });
                
                if (eventType) params.append('event_type', eventType);
                if (userId) params.append('user_id', userId);
                if (startDate) params.append('start_date', startDate);
                if (endDate) params.append('end_date', endDate);

                const response = await axios.get(`/api/security/audit-logs?${params}`);
                
                if (response.data.success) {
                    displayAuditLogs(response.data);
                }
            } catch (error) {
                console.error('감사 로그 로드 오류:', error);
            }
        }

        // 감사 로그 표시
        function displayAuditLogs(data) {
            const tbody = document.getElementById('audit-logs-table');
            tbody.innerHTML = '';

            data.logs.forEach(log => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${new Date(log.timestamp).toLocaleString()}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${log.event_type}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${log.user_id || '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${log.ip_address}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${getRiskClass(log.risk_score)}">
                            ${getRiskLevel(log.risk_score)}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-900">${log.details}</td>
                `;
                tbody.appendChild(row);
            });

            // 페이지네이션
            displayPagination('audit-pagination', data.page, data.pages, loadAuditLogs);
        }

        // 위협 로그 로드
        async function loadThreats(page = 1) {
            try {
                const params = new URLSearchParams({
                    page: page,
                    per_page: 20
                });

                const response = await axios.get(`/api/security/threats?${params}`);
                
                if (response.data.success) {

                }
            } catch (error) {
                console.error('위협 로그 로드 오류:', error);

        // 위협 로그 표시
        function displayThreats(data) {
            const tbody = document.getElementById('threats-table');

            data.threats.forEach(threat => {

                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${new Date(threat.timestamp).toLocaleString()}</td>

                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${threat.response_action}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${threat.details}</td>

        // IP 차단
        async function blockIP() {
            const ip = document.getElementById('block-ip').value;
            const reason = document.getElementById('block-reason').value;
            const duration = document.getElementById('block-duration').value;
            
            if (!ip) {
                alert('IP 주소를 입력해주세요.');
                return;
            }

            try {
                const response = await axios.post('/api/security/threats/block-ip', {
                    ip_address: ip,
                    reason: reason,
                    duration: parseInt(duration)

                if (response.data.success) {
                    alert('IP가 차단되었습니다.');

            }

        // 감사 로그 내보내기
        async function exportAuditLogs() {
            const eventType = document.getElementById('audit-event-type').value;
            const userId = document.getElementById('audit-user-id').value;
            const startDate = document.getElementById('audit-start-date').value;
            const endDate = document.getElementById('audit-end-date').value;

            try {
                const params = new URLSearchParams({
                    format: 'json'
                });
                
                if (eventType) params.append('event_type', eventType);
                if (userId) params.append('user_id', userId);
                if (startDate) params.append('start_date', startDate);
                if (endDate) params.append('end_date', endDate);

                const response = await axios.get(`/api/security/audit-logs/export?${params}`);
                
                if (response.data.success) {
                    // 파일 다운로드
                    const link = document.createElement('a');
                    link.href = response.data.download_url;
                    link.download = response.data.filename;
                    link.click();
                } else {
                    alert('감사 로그 내보내기에 실패했습니다.');
                }
            } catch (error) {
                console.error('감사 로그 내보내기 오류:', error);
                alert('감사 로그 내보내기 중 오류가 발생했습니다.');
            }
        }

        // 페이지네이션 표시
        function displayPagination(containerId, currentPage, totalPages, loadFunction) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            if (totalPages <= 1) return;

            const pagination = document.createElement('div');
            pagination.className = 'flex items-center space-x-2';

            // 이전 페이지
            if (currentPage > 1) {
                const prevBtn = document.createElement('button');
                prevBtn.textContent = '이전';
                prevBtn.className = 'px-3 py-1 border border-gray-300 rounded-md text-sm hover:bg-gray-50';
                prevBtn.onclick = () => loadFunction(currentPage - 1);
                pagination.appendChild(prevBtn);
            }

            // 페이지 번호
            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    const currentBtn = document.createElement('span');
                    currentBtn.textContent = i;
                    currentBtn.className = 'px-3 py-1 bg-blue-600 text-white rounded-md text-sm';
                    pagination.appendChild(currentBtn);
                } else {
                    const pageBtn = document.createElement('button');
                    pageBtn.textContent = i;
                    pageBtn.className = 'px-3 py-1 border border-gray-300 rounded-md text-sm hover:bg-gray-50';
                    pageBtn.onclick = () => loadFunction(i);
                    pagination.appendChild(pageBtn);
                }
            }

            // 다음 페이지
            if (currentPage < totalPages) {
                const nextBtn = document.createElement('button');
                nextBtn.textContent = '다음';
                nextBtn.className = 'px-3 py-1 border border-gray-300 rounded-md text-sm hover:bg-gray-50';
                nextBtn.onclick = () => loadFunction(currentPage + 1);
                pagination.appendChild(nextBtn);
            }

            container.appendChild(pagination);
        }

        // 위험도 클래스 반환
        function getRiskClass(riskScore) {
            if (riskScore >= 80) return 'bg-red-100 text-red-800';
            if (riskScore >= 60) return 'bg-yellow-100 text-yellow-800';
            if (riskScore >= 40) return 'bg-blue-100 text-blue-800';
            return 'bg-green-100 text-green-800';
        }

        // 위험도 레벨 반환
        function getRiskLevel(riskScore) {
            if (riskScore >= 80) return '높음';
            if (riskScore >= 60) return '중간';
            if (riskScore >= 40) return '낮음';
            return '안전';
        }

        // 데이터 새로고침
        function refreshData() {
            loadSecurityStatus();
            if (currentTab === 'audit') loadAuditLogs();
            if (currentTab === 'threats') loadThreats();
            updateLastUpdated();
        }

        // 마지막 업데이트 시간 업데이트
        function updateLastUpdated() {
            document.getElementById('last-updated').textContent = 
                `마지막 업데이트: ${new Date().toLocaleString()}`;
        }
    </script>
