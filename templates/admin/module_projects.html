<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모듈 프로젝트 목록 - 백엔드 관리자</title>
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <!-- Feather Icons는 로컬 패키지로 대체됨 -->
</head>
<body class="bg-background">
    <!-- 사이드바 -->
    <div class="flex h-screen">
        <div class="w-64 bg-card border-r border-border">
            <div class="p-4">
                <h1 class="text-xl font-bold text-card-foreground">백엔드 관리자</h1>
                <p class="text-muted-foreground text-sm">시스템 운영 관리</p>
            </div>
            
            <nav class="mt-8">
                <div class="px-4 py-2">
                    <h3 class="text-xs font-semibold text-muted-foreground uppercase tracking-wider">관리자 기능</h3>
                </div>
                
                <a href="/admin/backend" class="flex items-center px-4 py-3 text-muted-foreground hover:bg-accent hover:text-accent-foreground transition-colors">
                    <i data-feather="home" class="w-5 h-5 mr-3"></i>
                    대시보드
                </a>
                
                <a href="/admin/backend/industry-admin" class="flex items-center px-4 py-3 text-muted-foreground hover:bg-accent hover:text-accent-foreground transition-colors">
                    <i data-feather="users" class="w-5 h-5 mr-3"></i>
                    업종별 관리자 승인/관리
                </a>
                
                <a href="/admin/backend/plugin-marketplace" class="flex items-center px-4 py-3 text-muted-foreground hover:bg-accent hover:text-accent-foreground transition-colors">
                    <i data-feather="package" class="w-5 h-5 mr-3"></i>
                    플러그인 마켓플레이스
                </a>
                
                <a href="/admin/backend/plugin-management" class="flex items-center px-4 py-3 text-muted-foreground hover:bg-accent hover:text-accent-foreground transition-colors">
                    <i data-feather="settings" class="w-5 h-5 mr-3"></i>
                    플러그인 관리/개발
                </a>
                
                <a href="/admin/backend/module-development" class="flex items-center px-4 py-3 bg-accent text-accent-foreground">
                    <i data-feather="code" class="w-5 h-5 mr-3"></i>
                    모듈 개발 시스템
                </a>
                
                <a href="/admin/backend/system-monitoring" class="flex items-center px-4 py-3 text-muted-foreground hover:bg-accent hover:text-accent-foreground transition-colors">
                    <i data-feather="activity" class="w-5 h-5 mr-3"></i>
                    시스템/서버 운영/모니터링
                </a>
                
                <a href="/admin/backend/security" class="flex items-center px-4 py-3 text-muted-foreground hover:bg-accent hover:text-accent-foreground transition-colors">
                    <i data-feather="shield" class="w-5 h-5 mr-3"></i>
                    보안 관리
                </a>
                
                <a href="/admin/backend/events" class="flex items-center px-4 py-3 text-muted-foreground hover:bg-accent hover:text-accent-foreground transition-colors">
                    <i data-feather="bell" class="w-5 h-5 mr-3"></i>
                    실시간 이벤트/알림
                </a>
                
                <a href="/admin/backend/docs" class="flex items-center px-4 py-3 text-muted-foreground hover:bg-accent hover:text-accent-foreground transition-colors">
                    <i data-feather="file-text" class="w-5 h-5 mr-3"></i>
                    API/DB 문서
                </a>
            </nav>
        </div>

        <!-- 메인 콘텐츠 -->
        <div class="flex-1 overflow-auto">
            <!-- 헤더 -->
            <header class="bg-card border-b border-border shadow-sm">
                <div class="flex items-center justify-between px-6 py-4">
                    <div>
                        <h2 class="text-2xl font-bold text-card-foreground">모듈 프로젝트 목록</h2>
                        <p class="text-muted-foreground">개발 중인 모듈 프로젝트들을 관리하세요</p>
                    </div>
                    <div class="flex items-center space-x-4">
                        <button onclick="window.location.href='/admin/backend/module-development'" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground shadow hover:bg-primary/90 h-9 px-4 py-2">
                            <i data-feather="plus" class="w-4 h-4 mr-2"></i>
                            새 프로젝트
                        </button>
                    </div>
                </div>
            </header>

            <!-- 메인 콘텐츠 -->
            <main class="p-6">
                <!-- 프로젝트 통계 -->
                <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-4 mb-8">
                    <div class="rounded-xl border bg-card text-card-foreground shadow">
                        <div class="p-6 flex flex-row items-center justify-between space-y-0 pb-2">
                            <h3 class="tracking-tight text-sm font-medium">총 프로젝트</h3>
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                class="h-4 w-4 text-muted-foreground"
                            >
                                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
                                <polyline points="14,2 14,8 20,8" />
                            </svg>
                        </div>
                        <div class="p-6 pt-0">
                            <div class="text-2xl font-bold" id="total-projects">0</div>
                            <p class="text-xs text-muted-foreground">전체 프로젝트</p>
                        </div>
                    </div>

                    <div class="rounded-xl border bg-card text-card-foreground shadow">
                        <div class="p-6 flex flex-row items-center justify-between space-y-0 pb-2">
                            <h3 class="tracking-tight text-sm font-medium">개발 중</h3>
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                class="h-4 w-4 text-blue-600"
                            >
                                <path d="M12 2v20M2 12h20" />
                            </svg>
                        </div>
                        <div class="p-6 pt-0">
                            <div class="text-2xl font-bold text-blue-600" id="in-development">0</div>
                            <p class="text-xs text-muted-foreground">개발 진행 중</p>
                        </div>
                    </div>

                    <div class="rounded-xl border bg-card text-card-foreground shadow">
                        <div class="p-6 flex flex-row items-center justify-between space-y-0 pb-2">
                            <h3 class="tracking-tight text-sm font-medium">배포 완료</h3>
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                class="h-4 w-4 text-green-600"
                            >
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                                <polyline points="22,4 12,14.01 9,11.01" />
                            </svg>
                        </div>
                        <div class="p-6 pt-0">
                            <div class="text-2xl font-bold text-green-600" id="deployed">0</div>
                            <p class="text-xs text-muted-foreground">배포 완료</p>
                        </div>
                    </div>

                    <div class="rounded-xl border bg-card text-card-foreground shadow">
                        <div class="p-6 flex flex-row items-center justify-between space-y-0 pb-2">
                            <h3 class="tracking-tight text-sm font-medium">최근 업데이트</h3>
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                class="h-4 w-4 text-orange-600"
                            >
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                <polyline points="7,10 12,15 17,10" />
                                <line x1="12" x2="12" y1="15" y2="3" />
                            </svg>
                        </div>
                        <div class="p-6 pt-0">
                            <div class="text-2xl font-bold text-orange-600" id="recent-updates">0</div>
                            <p class="text-xs text-muted-foreground">최근 7일</p>
                        </div>
                    </div>
                </div>

                <!-- 프로젝트 목록 -->
                <div class="rounded-xl border bg-card text-card-foreground shadow">
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-lg font-semibold">프로젝트 목록</h3>
                            <div class="flex space-x-2">
                                <button onclick="loadProjects()" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-9 px-4 py-2">
                                    <i data-feather="refresh-cw" class="w-4 h-4 mr-2"></i>
                                    새로고침
                                </button>
                            </div>
                        </div>

                        <!-- 프로젝트 그리드 -->
                        <div id="projects-grid" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
                            <!-- 프로젝트 카드들이 여기에 동적으로 추가됩니다 -->
                        </div>

                        <!-- 빈 상태 -->
                        <div id="empty-state" class="text-center py-12 hidden">
                            <i data-feather="folder" class="w-16 h-16 mx-auto mb-4 text-muted-foreground opacity-50"></i>
                            <h3 class="text-lg font-medium text-muted-foreground mb-2">프로젝트가 없습니다</h3>
                            <p class="text-muted-foreground mb-4">새로운 모듈 프로젝트를 시작해보세요</p>
                            <button onclick="window.location.href='/admin/backend/module-development'" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground shadow hover:bg-primary/90 h-9 px-4 py-2">
                                <i data-feather="plus" class="w-4 h-4 mr-2"></i>
                                첫 프로젝트 만들기
                            </button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        // Feather 아이콘 초기화
        if (typeof feather !== 'undefined') {
            feather.replace();
        }

        // 프로젝트 목록 로드
        async function loadProjects() {
            try {
                const response = await fetch('/api/backend/module/projects');
                const data = await response.json();
                
                if (data.success) {
                    updateProjectStats(data.projects);
                    renderProjects(data.projects);
                }
            } catch (error) {
                console.error('프로젝트 목록 로드 실패:', error);
            }
        }

        // 프로젝트 통계 업데이트
        function updateProjectStats(projects) {
            const total = projects.length;
            const inDevelopment = projects.filter(p => p.status === 'development').length;
            const deployed = projects.filter(p => p.status === 'deployed').length;
            const recentUpdates = projects.filter(p => {
                const updateDate = new Date(p.updated_at || p.created_at);
                const weekAgo = new Date();
                weekAgo.setDate(weekAgo.getDate() - 7);
                return updateDate > weekAgo;
            }).length;

            document.getElementById('total-projects').textContent = total;
            document.getElementById('in-development').textContent = inDevelopment;
            document.getElementById('deployed').textContent = deployed;
            document.getElementById('recent-updates').textContent = recentUpdates;
        }

        // 프로젝트 렌더링
        function renderProjects(projects) {
            const grid = document.getElementById('projects-grid');
            const emptyState = document.getElementById('empty-state');
            
            if (projects.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            grid.innerHTML = '';

            projects.forEach(project => {
                const card = createProjectCard(project);
                grid.appendChild(card);
            });
        }

        // 프로젝트 카드 생성
        function createProjectCard(project) {
            const card = document.createElement('div');
            card.className = 'rounded-lg border bg-card text-card-foreground shadow-sm hover:shadow-md transition-shadow';
            
            const statusBadge = getStatusBadge(project.status || 'development');
            const typeIcon = getTypeIcon(project.type || 'general');
            const componentCount = project.components ? project.components.length : 0;
            
            card.innerHTML = `
                <div class="p-6">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center space-x-3">
                            <div class="text-2xl">${typeIcon}</div>
                            <div>
                                <h4 class="font-semibold text-card-foreground">${project.name}</h4>
                                <p class="text-sm text-muted-foreground">${project.type || 'general'}</p>
                            </div>
                        </div>
                        ${statusBadge}
                    </div>
                    
                    <p class="text-sm text-muted-foreground mb-4 line-clamp-2">${project.description || '설명이 없습니다.'}</p>
                    
                    <div class="flex items-center justify-between text-sm text-muted-foreground mb-4">
                        <span>컴포넌트: ${componentCount}개</span>
                        <span>${formatDate(project.created_at)}</span>
                    </div>
                    
                    <div class="flex space-x-2">
                        <button onclick="editProject('${project.id}')" class="flex-1 inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-8 px-3">
                            <i data-feather="edit" class="w-3 h-3 mr-1"></i>
                            편집
                        </button>
                        <button onclick="duplicateProject('${project.id}')" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-8 px-3">
                            <i data-feather="copy" class="w-3 h-3"></i>
                        </button>
                        <button onclick="deleteProject('${project.id}')" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-8 px-3">
                            <i data-feather="trash-2" class="w-3 h-3"></i>
                        </button>
                    </div>
                </div>
            `;
            
            return card;
        }

        // 상태 배지 생성
        function getStatusBadge(status) {
            const badges = {
                development: '<span class="inline-flex items-center rounded-md bg-blue-100 px-2.5 py-0.5 text-xs font-medium text-blue-800 dark:bg-blue-900 dark:text-blue-300">개발 중</span>',
                deployed: '<span class="inline-flex items-center rounded-md bg-green-100 px-2.5 py-0.5 text-xs font-medium text-green-800 dark:bg-green-900 dark:text-green-300">배포됨</span>',
                archived: '<span class="inline-flex items-center rounded-md bg-gray-100 px-2.5 py-0.5 text-xs font-medium text-gray-800 dark:bg-gray-900 dark:text-gray-300">보관됨</span>'
            };
            return badges[status] || badges.development;
        }

        // 타입 아이콘 생성
        function getTypeIcon(type) {
            const icons = {
                general: '📦',
                dashboard: '📊',
                form: '📝',
                report: '📋',
                widget: '🎛️'
            };
            return icons[type] || icons.general;
        }

        // 날짜 포맷
        function formatDate(dateString) {
            if (!dateString) return '날짜 없음';
            const date = new Date(dateString);
            return date.toLocaleDateString('ko-KR');
        }

        // 프로젝트 편집
        function editProject(projectId) {
            // 프로젝트 데이터를 세션스토리지에 저장하고 편집 페이지로 이동
            sessionStorage.setItem('currentProjectId', projectId);
            window.location.href = '/admin/backend/module-development';
        }

        // 프로젝트 복제
        function duplicateProject(projectId) {
            if (confirm('이 프로젝트를 복제하시겠습니까?')) {
                // TODO: 프로젝트 복제 로직 구현
                alert('프로젝트 복제 기능은 준비 중입니다.');
            }
        }

        // 프로젝트 삭제
        function deleteProject(projectId) {
            if (confirm('정말로 이 프로젝트를 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) {
                // TODO: 프로젝트 삭제 로직 구현
                alert('프로젝트 삭제 기능은 준비 중입니다.');
            }
        }

        // 페이지 로드 시 프로젝트 목록 로드
        document.addEventListener('DOMContentLoaded', function() {
            loadProjects();
        });
    </script>

    <style>
        :root {
            --background: 0 0% 100%;
            --foreground: 222.2 84% 4.9%;
            --card: 0 0% 100%;
            --card-foreground: 222.2 84% 4.9%;
            --popover: 0 0% 100%;
            --popover-foreground: 222.2 84% 4.9%;
            --primary: 222.2 47.4% 11.2%;
            --primary-foreground: 210 40% 98%;
            --secondary: 210 40% 96%;
            --secondary-foreground: 222.2 84% 4.9%;
            --muted: 210 40% 96%;
            --muted-foreground: 215.4 16.3% 46.9%;
            --accent: 210 40% 96%;
            --accent-foreground: 222.2 84% 4.9%;
            --destructive: 0 84.2% 60.2%;
            --destructive-foreground: 210 40% 98%;
            --border: 214.3 31.8% 91.4%;
            --input: 214.3 31.8% 91.4%;
            --ring: 222.2 84% 4.9%;
            --radius: 0.5rem;
        }

        .dark {
            --background: 222.2 84% 4.9%;
            --foreground: 210 40% 98%;
            --card: 222.2 84% 4.9%;
            --card-foreground: 210 40% 98%;
            --popover: 222.2 84% 4.9%;
            --popover-foreground: 210 40% 98%;
            --primary: 210 40% 98%;
            --primary-foreground: 222.2 47.4% 11.2%;
            --secondary: 217.2 32.6% 17.5%;
            --secondary-foreground: 210 40% 98%;
            --muted: 217.2 32.6% 17.5%;
            --muted-foreground: 215 20.2% 65.1%;
            --accent: 217.2 32.6% 17.5%;
            --accent-foreground: 210 40% 98%;
            --destructive: 0 62.8% 30.6%;
            --destructive-foreground: 210 40% 98%;
            --border: 217.2 32.6% 17.5%;
            --input: 217.2 32.6% 17.5%;
            --ring: 212.7 26.8% 83.9%;
        }

        * {
            border-color: hsl(var(--border));
        }

        body {
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
        }

        .bg-background {
            background-color: hsl(var(--background));
        }

        .bg-card {
            background-color: hsl(var(--card));
        }

        .text-card-foreground {
            color: hsl(var(--card-foreground));
        }

        .text-foreground {
            color: hsl(var(--foreground));
        }

        .text-muted-foreground {
            color: hsl(var(--muted-foreground));
        }

        .border {
            border-color: hsl(var(--border));
        }

        .border-input {
            border-color: hsl(var(--input));
        }

        .bg-accent {
            background-color: hsl(var(--accent));
        }

        .text-accent-foreground {
            color: hsl(var(--accent-foreground));
        }

        .bg-primary {
            background-color: hsl(var(--primary));
        }

        .text-primary-foreground {
            color: hsl(var(--primary-foreground));
        }

        .bg-destructive {
            background-color: hsl(var(--destructive));
        }

        .text-destructive-foreground {
            color: hsl(var(--destructive-foreground));
        }

        .hover\:bg-accent:hover {
            background-color: hsl(var(--accent));
        }

        .hover\:text-accent-foreground:hover {
            color: hsl(var(--accent-foreground));
        }

        .hover\:bg-primary\/90:hover {
            background-color: hsl(var(--primary) / 0.9);
        }

        .hover\:bg-destructive\/90:hover {
            background-color: hsl(var(--destructive) / 0.9);
        }

        .focus-visible\:ring-ring:focus-visible {
            --tw-ring-color: hsl(var(--ring));
        }

        .disabled\:opacity-50:disabled {
            opacity: 0.5;
        }

        .disabled\:cursor-not-allowed:disabled {
            cursor: not-allowed;
        }

        .disabled\:pointer-events-none:disabled {
            pointer-events: none;
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</body>
</html>
