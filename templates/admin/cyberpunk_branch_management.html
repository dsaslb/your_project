<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매장 관리 - 시스템 관리</title>
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <link href="/static/css/backend-admin.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .cyberpunk-bg {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
        }
        .neon-border {
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        .neon-text {
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.2);
        }
    </style>
</head>
<body class="cyberpunk-bg min-h-screen text-white">
    <div class="container mx-auto px-4 py-8">
    <!-- 헤더 -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold neon-text mb-4">
                <i class="fas fa-store mr-3"></i>매장 관리
            </h1>
            <p class="text-gray-300 text-lg">매장 정보 등록 및 관리</p>
        </div>

        <!-- 통계 카드 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-gray-800 rounded-lg p-6 neon-border card-hover">
                <div class="flex items-center">
                    <i class="fas fa-store text-3xl text-yellow-400 mr-4"></i>
                    <div>
                        <h3 class="text-lg font-semibold">총 매장</h3>
                        <p class="text-2xl font-bold text-yellow-400" id="total-stores">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-gray-800 rounded-lg p-6 neon-border card-hover">
                <div class="flex items-center">
                    <i class="fas fa-check-circle text-3xl text-green-400 mr-4"></i>
            <div>
                        <h3 class="text-lg font-semibold">활성 매장</h3>
                        <p class="text-2xl font-bold text-green-400" id="active-stores">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-gray-800 rounded-lg p-6 neon-border card-hover">
                <div class="flex items-center">
                    <i class="fas fa-users text-3xl text-purple-400 mr-4"></i>
                    <div>
                        <h3 class="text-lg font-semibold">총 직원</h3>
                        <p class="text-2xl font-bold text-purple-400" id="total-employees">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-gray-800 rounded-lg p-6 neon-border card-hover">
                <div class="flex items-center">
                    <i class="fas fa-trademark text-3xl text-blue-400 mr-4"></i>
                    <div>
                        <h3 class="text-lg font-semibold">브랜드 수</h3>
                        <p class="text-2xl font-bold text-blue-400" id="total-brands">0</p>
        </div>
                </div>
            </div>
        </div>

        <!-- 관리 버튼 -->
        <div class="flex justify-between items-center mb-6">
            <button onclick="showCreateModal()" class="bg-yellow-600 hover:bg-yellow-700 text-white px-6 py-3 rounded-lg font-semibold transition-colors">
                <i class="fas fa-plus mr-2"></i>새 매장 등록
            </button>
            <div class="flex space-x-4">
                <a href="/admin/schedule_management" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors">
                    <i class="fas fa-calendar-alt mr-2"></i>스케줄 관리
                </a>
                <button onclick="refreshData()" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition-colors">
                    <i class="fas fa-refresh mr-2"></i>새로고침
                </button>
                <a href="/admin/backend/hierarchy-management" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition-colors">
                    <i class="fas fa-arrow-left mr-2"></i>뒤로가기
                </a>
        </div>
    </div>

    <!-- 매장 목록 테이블 -->
        <div class="bg-gray-800 rounded-lg p-6 neon-border">
            <h2 class="text-2xl font-bold mb-4 neon-text">
                <i class="fas fa-list mr-2"></i>매장 목록
            </h2>
        <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-700">
                        <tr>
                            <th class="px-4 py-3 font-semibold">매장명</th>
                            <th class="px-4 py-3 font-semibold">브랜드</th>
                            <th class="px-4 py-3 font-semibold">매장 코드</th>
                            <th class="px-4 py-3 font-semibold">주소</th>
                            <th class="px-4 py-3 font-semibold">직원 수</th>
                            <th class="px-4 py-3 font-semibold">상태</th>
                            <th class="px-4 py-3 font-semibold">등록일</th>
                            <th class="px-4 py-3 font-semibold">관리</th>
                    </tr>
                </thead>
                    <tbody id="store-table-body">
                        <tr>
                            <td colspan="8" class="px-4 py-8 text-center text-gray-400">
                                <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                                <p>데이터를 불러오는 중...</p>
                            </td>
                        </tr>
                </tbody>
            </table>
            </div>
        </div>
    </div>

    <!-- 매장 등록/수정 모달 -->
    <div id="store-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-gray-800 rounded-lg p-6 neon-border w-full max-w-md">
                <h3 id="modal-title" class="text-xl font-bold mb-4 neon-text">새 매장 등록</h3>
                <form id="store-form">
                    <input type="hidden" id="store-id">
                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-2">브랜드</label>
                        <select id="store-brand" class="backend-select" required>
                            <option value="">브랜드를 선택하세요</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-2">매장명</label>
                        <input type="text" id="store-name" class="backend-input" placeholder="매장명을 입력하세요" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-2">매장 코드</label>
                        <input type="text" id="store-code" class="backend-input" placeholder="매장 코드를 입력하세요" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-2">주소</label>
                        <input type="text" id="store-address" class="backend-input" placeholder="매장 주소를 입력하세요" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-2">전화번호</label>
                        <input type="tel" id="store-phone" class="backend-input" placeholder="전화번호를 입력하세요">
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-semibold mb-2">상태</label>
                        <select id="store-status" class="backend-select">
                            <option value="active">활성</option>
                            <option value="inactive">비활성</option>
                        </select>
                    </div>
                    <div class="flex space-x-4">
                        <button type="submit" class="flex-1 bg-yellow-600 hover:bg-yellow-700 text-white px-4 py-2 rounded font-semibold transition-colors">
                            저장
                        </button>
                        <button type="button" onclick="hideModal()" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded font-semibold transition-colors">
                        취소
                    </button>
                </div>
            </form>
            </div>
        </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div id="delete-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-gray-800 rounded-lg p-6 neon-border w-full max-w-md">
                <h3 class="text-xl font-bold mb-4 text-red-400">매장 삭제 확인</h3>
                <p class="text-gray-300 mb-6">정말로 이 매장을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.</p>
                <div class="flex space-x-4">
                    <button onclick="confirmDelete()" class="flex-1 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-semibold transition-colors">
                        삭제
                    </button>
                    <button onclick="hideDeleteModal()" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded font-semibold transition-colors">
                        취소
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let stores = [];
        let brands = [];
        let deleteTargetId = null;

        // 페이지 로드 시 데이터 가져오기
        document.addEventListener('DOMContentLoaded', function() {
            loadStores();
            loadBrands();
            setupFormHandler();
        });

        // 매장 목록 로드
        function loadStores() {
            fetch('/api/admin/branches')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        stores = data.data;
                        renderStoreTable();
                        updateStatistics();
                    } else {
                        showError('매장 목록을 불러올 수 없습니다.');
                    }
                })
                .catch(error => {
                    console.error('매장 목록 로드 실패:', error);
                    showError('네트워크 오류가 발생했습니다.');
                });
        }

        // 브랜드 목록 로드
        function loadBrands() {
            fetch('/api/admin/brands')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        brands = data.data;
                        populateBrandSelect();
                    }
                })
                .catch(error => {
                    console.error('브랜드 목록 로드 실패:', error);
                });
        }

        // 브랜드 선택 옵션 채우기
        function populateBrandSelect() {
            const select = document.getElementById('store-brand');
            select.innerHTML = '<option value="">브랜드를 선택하세요</option>';
            
            brands.forEach(brand => {
                if (brand.is_active) {
                    const option = document.createElement('option');
                    option.value = brand.id;
                    option.textContent = brand.name;
                    select.appendChild(option);
                }
            });
        }

        // 매장 테이블 렌더링
        function renderStoreTable() {
            const tbody = document.getElementById('store-table-body');
            
            if (stores.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="px-4 py-8 text-center text-gray-400">
                            <i class="fas fa-inbox text-2xl mb-2"></i>
                            <p>등록된 매장이 없습니다.</p>
                        </td>
                    </tr>
                `;
                return;
            }

            let html = '';
            stores.forEach(store => {
                const statusClass = store.is_active ? 'text-green-400' : 'text-red-400';
                const statusText = store.is_active ? '활성' : '비활성';
                const brand = brands.find(b => b.id === store.brand_id);
                
                html += `
                    <tr class="border-b border-gray-700 hover:bg-gray-700">
                        <td class="px-4 py-3">
                            <div class="flex items-center">
                                <div class="w-4 h-4 rounded mr-3" style="background-color: ${brand ? brand.color : '#666'}"></div>
                                <span class="font-semibold">${store.name}</span>
                            </div>
                        </td>
                        <td class="px-4 py-3 text-gray-300">${brand ? brand.name : '-'}</td>
                        <td class="px-4 py-3 text-gray-300">${store.store_code}</td>
                        <td class="px-4 py-3 text-gray-300">${store.address || '-'}</td>
                        <td class="px-4 py-3 text-gray-300">${store.employee_count || 0}명</td>
                        <td class="px-4 py-3">
                            <span class="${statusClass}">
                                <i class="fas fa-circle text-xs mr-1"></i>${statusText}
                            </span>
                        </td>
                        <td class="px-4 py-3 text-gray-300">${formatDate(store.created_at)}</td>
                        <td class="px-4 py-3">
                            <div class="flex space-x-2">
                                <button onclick="editStore(${store.id})" class="text-blue-400 hover:text-blue-300">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button onclick="deleteStore(${store.id})" class="text-red-400 hover:text-red-300">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        // 통계 업데이트
        function updateStatistics() {
            const total = stores.length;
            const active = stores.filter(s => s.is_active).length;
            const totalEmployees = stores.reduce((sum, s) => sum + (s.employee_count || 0), 0);
            const uniqueBrands = new Set(stores.map(s => s.brand_id)).size;

            document.getElementById('total-stores').textContent = total;
            document.getElementById('active-stores').textContent = active;
            document.getElementById('total-employees').textContent = totalEmployees;
            document.getElementById('total-brands').textContent = uniqueBrands;
        }

        // 폼 핸들러 설정
        function setupFormHandler() {
            document.getElementById('store-form').addEventListener('submit', function(e) {
                e.preventDefault();
                saveStore();
            });
        }

        // 새 매장 등록 모달 표시
        function showCreateModal() {
            document.getElementById('modal-title').textContent = '새 매장 등록';
            document.getElementById('store-id').value = '';
            document.getElementById('store-brand').value = '';
            document.getElementById('store-name').value = '';
            document.getElementById('store-code').value = '';
            document.getElementById('store-address').value = '';
            document.getElementById('store-phone').value = '';
            document.getElementById('store-status').value = 'active';
            document.getElementById('store-modal').classList.remove('hidden');
        }

        // 매장 수정 모달 표시
        function editStore(id) {
            const store = stores.find(s => s.id === id);
            if (!store) return;

            document.getElementById('modal-title').textContent = '매장 수정';
            document.getElementById('store-id').value = store.id;
            document.getElementById('store-brand').value = store.brand_id;
            document.getElementById('store-name').value = store.name;
            document.getElementById('store-code').value = store.store_code;
            document.getElementById('store-address').value = store.address || '';
            document.getElementById('store-phone').value = store.phone || '';
            document.getElementById('store-status').value = store.is_active ? 'active' : 'inactive';
            document.getElementById('store-modal').classList.remove('hidden');
        }

        // 모달 숨기기
        function hideModal() {
            document.getElementById('store-modal').classList.add('hidden');
        }

        // 매장 저장
        function saveStore() {
            const id = document.getElementById('store-id').value;
            const data = {
                brand_id: parseInt(document.getElementById('store-brand').value),
                name: document.getElementById('store-name').value,
                store_code: document.getElementById('store-code').value,
                address: document.getElementById('store-address').value,
                phone: document.getElementById('store-phone').value,
                status: document.getElementById('store-status').value
            };

            const url = id ? `/api/admin/branches/${id}` : '/api/admin/branches';
            const method = id ? 'PUT' : 'POST';

            fetch(url, {
                    method: method,
                    headers: {
                    'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    showSuccess(id ? '매장이 수정되었습니다.' : '매장이 등록되었습니다.');
                    hideModal();
                    loadStores();
                } else {
                    showError(result.error || '저장에 실패했습니다.');
                }
            })
            .catch(error => {
                console.error('저장 실패:', error);
                showError('네트워크 오류가 발생했습니다.');
            });
        }

        // 매장 삭제
        function deleteStore(id) {
            deleteTargetId = id;
            document.getElementById('delete-modal').classList.remove('hidden');
        }

        // 삭제 확인
        function confirmDelete() {
            if (!deleteTargetId) return;

                            fetch(`/api/admin/branches/${deleteTargetId}`, {
                    method: 'DELETE'
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    showSuccess('매장이 삭제되었습니다.');
                    hideDeleteModal();
                    loadStores();
                } else {
                    showError(result.error || '삭제에 실패했습니다.');
                }
            })
            .catch(error => {
                console.error('삭제 실패:', error);
                showError('네트워크 오류가 발생했습니다.');
            });
        }

        // 삭제 모달 숨기기
        function hideDeleteModal() {
            document.getElementById('delete-modal').classList.add('hidden');
            deleteTargetId = null;
        }

        // 데이터 새로고침
        function refreshData() {
            loadStores();
            loadBrands();
        }

        // 유틸리티 함수들
        function showSuccess(message) {
            alert(message);
        }

        function showError(message) {
            alert('오류: ' + message);
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString();
        }
    </script>
</body>
</html>
