<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>백엔드 관리자 대시보드</title>
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <!-- Chart.js와 Feather Icons는 로컬 패키지로 대체됨 -->
</head>
<body class="bg-gray-50">
    <!-- 사이드바 -->
    <div class="flex h-screen">
        <div class="w-64 bg-gray-900 text-white">
            <div class="p-4">
                <h1 class="text-xl font-bold">백엔드 관리자</h1>
                <p class="text-gray-400 text-sm">시스템 운영 관리</p>
            </div>
            
            <nav class="mt-8">
                <div class="px-4 py-2">
                    <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">관리자 기능</h3>
                </div>
                
                <a href="#dashboard" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
                    <i data-feather="home" class="w-5 h-5 mr-3"></i>
                    대시보드
                </a>
                
                <a href="#industry-admin" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
                    <i data-feather="users" class="w-5 h-5 mr-3"></i>
                    업종별 관리자 승인/관리
                </a>
                
                <a href="#plugin-marketplace" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
                    <i data-feather="package" class="w-5 h-5 mr-3"></i>
                    플러그인 마켓플레이스
                </a>
                
                <a href="#plugin-management" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
                    <i data-feather="settings" class="w-5 h-5 mr-3"></i>
                    플러그인 관리/개발
                </a>
                
                <a href="#system-monitoring" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
                    <i data-feather="activity" class="w-5 h-5 mr-3"></i>
                    시스템/서버 운영/모니터링
                </a>
                
                <a href="#security" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
                    <i data-feather="shield" class="w-5 h-5 mr-3"></i>
                    보안 관리
                </a>
                
                <a href="#events" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
                    <i data-feather="bell" class="w-5 h-5 mr-3"></i>
                    실시간 이벤트/알림
                </a>
                
                <a href="#docs" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
                    <i data-feather="file-text" class="w-5 h-5 mr-3"></i>
                    API/DB 문서
                </a>
            </nav>
        </div>

        <!-- 메인 콘텐츠 -->
        <div class="flex-1 overflow-auto">
            <!-- 헤더 -->
            <header class="bg-white shadow-sm border-b">
                <div class="flex items-center justify-between px-6 py-4">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900">백엔드 관리자 대시보드</h2>
                        <p class="text-gray-600">시스템 운영 및 관리</p>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="flex items-center space-x-2">
                            <div class="w-3 h-3 bg-green-500 rounded-full"></div>
                            <span class="text-sm text-gray-600">시스템 정상</span>
                        </div>
                        <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                            로그아웃
                        </button>
                    </div>
                </div>
            </header>

            <!-- 대시보드 콘텐츠 -->
            <main class="p-6">
                <!-- 시스템 상태 카드 -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex items-center">
                            <div class="p-3 bg-blue-100 rounded-full">
                                <i data-feather="users" class="w-6 h-6 text-blue-600"></i>
                            </div>
                            <div class="ml-4">
                                <p class="text-sm font-medium text-gray-600">업종별 관리자</p>
                                <p class="text-2xl font-bold text-gray-900" id="industry-admin-count">0</p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex items-center">
                            <div class="p-3 bg-green-100 rounded-full">
                                <i data-feather="package" class="w-6 h-6 text-green-600"></i>
                            </div>
                            <div class="ml-4">
                                <p class="text-sm font-medium text-gray-600">활성 플러그인</p>
                                <p class="text-2xl font-bold text-gray-900" id="active-plugins-count">0</p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex items-center">
                            <div class="p-3 bg-yellow-100 rounded-full">
                                <i data-feather="activity" class="w-6 h-6 text-yellow-600"></i>
                            </div>
                            <div class="ml-4">
                                <p class="text-sm font-medium text-gray-600">시스템 부하</p>
                                <p class="text-2xl font-bold text-gray-900" id="system-load">0%</p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex items-center">
                            <div class="p-3 bg-red-100 rounded-full">
                                <i data-feather="alert-triangle" class="w-6 h-6 text-red-600"></i>
                            </div>
                            <div class="ml-4">
                                <p class="text-sm font-medium text-gray-600">보안 경고</p>
                                <p class="text-2xl font-bold text-gray-900" id="security-alerts">0</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 시스템 모니터링 차트 -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                    <div class="bg-white rounded-lg shadow p-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">시스템 리소스 사용률</h3>
                        <canvas id="systemResourcesChart" width="400" height="200"></canvas>
                    </div>

                    <div class="bg-white rounded-lg shadow p-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">실시간 이벤트</h3>
                        <div id="realtime-events" class="space-y-3 max-h-64 overflow-y-auto">
                            <!-- 실시간 이벤트가 여기에 표시됩니다 -->
                        </div>
                    </div>
                </div>

                <!-- 최근 활동 -->
                <div class="bg-white rounded-lg shadow">
                    <div class="px-6 py-4 border-b">
                        <h3 class="text-lg font-semibold text-gray-900">최근 관리자 활동</h3>
                    </div>
                    <div class="p-6">
                        <div id="recent-activities" class="space-y-4">
                            <!-- 최근 활동이 여기에 표시됩니다 -->
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        // Feather 아이콘 초기화
        feather.replace();

        // 시스템 리소스 차트
        const ctx = document.getElementById('systemResourcesChart').getContext('2d');
        const systemResourcesChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'CPU 사용률',
                    data: [],
                    borderColor: 'rgb(59, 130, 246)',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    tension: 0.4,
                    fill: false
                }, {
                    label: '메모리 사용률',
                    data: [],
                    borderColor: 'rgb(16, 185, 129)',
                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                    tension: 0.4,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: {
                    duration: 0 // 애니메이션 비활성화로 성능 향상
                },
                interaction: {
                    intersect: false,
                    mode: 'index'
                },
                scales: {
                    x: {
                        grid: {
                            display: false
                        }
                    },
                    y: {
                        beginAtZero: true,
                        max: 100,
                        grid: {
                            color: 'rgba(0, 0, 0, 0.1)'
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'top'
                    }
                }
            }
        });

        // 데이터 제한 설정
        const MAX_DATA_POINTS = 15; // 최대 15개 데이터 포인트만 유지 (약 1분간의 데이터)
        const MAX_EVENTS = 10; // 최대 10개 이벤트만 유지

        // 실시간 데이터 업데이트
        function updateDashboard() {
            // 백엔드 관리자 대시보드 통계
            fetch('/api/backend/dashboard/stats')
                .then(response => response.json())
                .then(data => {
                    // 업종별 관리자 수
                    document.getElementById('industry-admin-count').textContent = data.industry_admin?.total_count || 0;
                    
                    // 활성 플러그인 수
                    document.getElementById('active-plugins-count').textContent = data.plugin?.active_plugins || 0;
                })
                .catch(error => {
                    console.log('대시보드 통계 조회 실패:', error);
                });

            // 시스템 부하 및 차트 업데이트
            fetch('/api/system/metrics')
                .then(response => response.json())
                .then(data => {
                    const cpuUsage = Math.round(data.cpu_percent || 0);
                    const memoryUsage = Math.round(data.memory_percent || 0);
                    
                    document.getElementById('system-load').textContent = cpuUsage + '%';
                    
                    // 차트 업데이트
                    updateSystemChart(cpuUsage, memoryUsage);
                })
                .catch(error => {
                    console.log('시스템 메트릭 조회 실패:', error);
                });

            // 보안 경고
            fetch('/api/system/alerts')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('security-alerts').textContent = data.critical_alerts || 0;
                })
                .catch(error => {
                    console.log('보안 알림 조회 실패:', error);
                });

            // 실시간 이벤트 업데이트
            updateRealtimeEvents();
        }

        // 시스템 차트 업데이트 함수
        function updateSystemChart(cpuUsage, memoryUsage) {
            const now = new Date().toLocaleTimeString('ko-KR', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });
            
            // 데이터 개수 제한 (오래된 데이터 먼저 삭제)
            if (systemResourcesChart.data.labels.length >= MAX_DATA_POINTS) {
                systemResourcesChart.data.labels.shift();
                systemResourcesChart.data.datasets[0].data.shift();
                systemResourcesChart.data.datasets[1].data.shift();
            }
            
            // 새 데이터 추가
            systemResourcesChart.data.labels.push(now);
            systemResourcesChart.data.datasets[0].data.push(cpuUsage);
            systemResourcesChart.data.datasets[1].data.push(memoryUsage);
            
            // 차트 업데이트 (애니메이션 없이)
            systemResourcesChart.update('none');
        }

        // 실시간 이벤트 업데이트 함수
        function updateRealtimeEvents() {
            const eventsContainer = document.getElementById('realtime-events');
            const now = new Date().toLocaleTimeString('ko-KR', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });
            
            // 새 이벤트 생성 (예시 데이터)
            const eventTypes = [
                { type: 'info', message: '시스템 정상 운영 중', icon: 'check-circle' },
                { type: 'warning', message: '메모리 사용률 증가', icon: 'alert-triangle' },
                { type: 'success', message: '플러그인 업데이트 완료', icon: 'check' },
                { type: 'info', message: '백업 작업 완료', icon: 'database' }
            ];
            
            const randomEvent = eventTypes[Math.floor(Math.random() * eventTypes.length)];
            
            // 새 이벤트 요소 생성
            const eventElement = document.createElement('div');
            eventElement.className = `flex items-center space-x-3 p-3 rounded-lg border-l-4 ${
                randomEvent.type === 'info' ? 'border-blue-500 bg-blue-50' :
                randomEvent.type === 'warning' ? 'border-yellow-500 bg-yellow-50' :
                randomEvent.type === 'success' ? 'border-green-500 bg-green-50' :
                'border-gray-500 bg-gray-50'
            }`;
            
            eventElement.innerHTML = `
                <i data-feather="${randomEvent.icon}" class="w-4 h-4 ${
                    randomEvent.type === 'info' ? 'text-blue-500' :
                    randomEvent.type === 'warning' ? 'text-yellow-500' :
                    randomEvent.type === 'success' ? 'text-green-500' :
                    'text-gray-500'
                }"></i>
                <div class="flex-1">
                    <p class="text-sm font-medium text-gray-900">${randomEvent.message}</p>
                    <p class="text-xs text-gray-500">${now}</p>
                </div>
            `;
            
            // 새 이벤트를 맨 위에 추가
            eventsContainer.insertBefore(eventElement, eventsContainer.firstChild);
            
            // 이벤트 개수 제한 (오래된 이벤트 삭제)
            const events = eventsContainer.children;
            if (events.length > MAX_EVENTS) {
                eventsContainer.removeChild(events[events.length - 1]);
            }
            
            // Feather 아이콘 업데이트
            feather.replace();
        }

        // 8초마다 데이터 업데이트 (적절한 실시간 업데이트)
        setInterval(updateDashboard, 8000);
        
        // Feather 아이콘 초기화 및 대시보드 로드
        if (typeof feather !== 'undefined') {
            feather.replace();
        }
        updateDashboard(); // 초기 로드
    </script>
</body>
</html>
