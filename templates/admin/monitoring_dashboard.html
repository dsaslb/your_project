<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고급 모니터링 및 분석 대시보드</title>
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .alert-critical {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
        }
        .alert-warning {
            background: linear-gradient(135deg, #feca57 0%, #ff9ff3 100%);
        }
        .alert-info {
            background: linear-gradient(135deg, #48dbfb 0%, #0abde3 100%);
        }
        .chart-container {
            position: relative;
            height: 300px;
        }
        .loading {
            display: none;
        }
        .loading.active {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen">
        <!-- 헤더 -->
        <header class="bg-white shadow-sm border-b">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center py-4">
                    <div class="flex items-center">
                        <h1 class="text-2xl font-bold text-gray-900">고급 모니터링 및 분석</h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <button id="refreshBtn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                            새로고침
                        </button>
                        <div id="monitoringStatus" class="flex items-center space-x-2">
                            <div id="statusIndicator" class="w-3 h-3 rounded-full bg-gray-400"></div>
                            <span id="statusText" class="text-sm text-gray-600">모니터링 상태 확인 중...</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- 메인 컨텐츠 -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- 요약 카드 -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="metric-card text-white rounded-lg p-6 shadow-lg">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm opacity-75">CPU 사용률</p>
                            <p id="cpuPercent" class="text-3xl font-bold">--</p>
                        </div>
                        <div class="text-4xl opacity-50">💻</div>
                    </div>
                </div>
                
                <div class="metric-card text-white rounded-lg p-6 shadow-lg">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm opacity-75">메모리 사용률</p>
                            <p id="memoryPercent" class="text-3xl font-bold">--</p>
                        </div>
                        <div class="text-4xl opacity-50">🧠</div>
                    </div>
                </div>
                
                <div class="metric-card text-white rounded-lg p-6 shadow-lg">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm opacity-75">활성 사용자</p>
                            <p id="activeUsers" class="text-3xl font-bold">--</p>
                        </div>
                        <div class="text-4xl opacity-50">👥</div>
                    </div>
                </div>
                
                <div class="metric-card text-white rounded-lg p-6 shadow-lg">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm opacity-75">응답 시간</p>
                            <p id="responseTime" class="text-3xl font-bold">--</p>
                        </div>
                        <div class="text-4xl opacity-50">⚡</div>
                    </div>
                </div>
            </div>

            <!-- 알림 섹션 -->
            <div class="mb-8">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-semibold text-gray-900">실시간 알림</h2>
                    <button id="viewAllAlertsBtn" class="text-blue-600 hover:text-blue-800 text-sm">모든 알림 보기</button>
                </div>
                <div id="alertsContainer" class="space-y-3">
                    <div class="text-center text-gray-500 py-8">알림을 불러오는 중...</div>
                </div>
            </div>

            <!-- 차트 섹션 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                <!-- 시스템 메트릭 차트 -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">시스템 메트릭 추이</h3>
                    <div class="chart-container">
                        <canvas id="systemMetricsChart"></canvas>
                    </div>
                </div>
                
                <!-- 사용자 활동 차트 -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">사용자 활동 분석</h3>
                    <div class="chart-container">
                        <canvas id="userActivityChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- 분석 결과 섹션 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                <!-- 트렌드 분석 -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">트렌드 분석</h3>
                    <div id="trendsContainer" class="space-y-3">
                        <div class="text-center text-gray-500 py-8">분석 중...</div>
                    </div>
                </div>
                
                <!-- 이상 탐지 -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">이상 탐지</h3>
                    <div id="anomaliesContainer" class="space-y-3">
                        <div class="text-center text-gray-500 py-8">분석 중...</div>
                    </div>
                </div>
            </div>

            <!-- 권장사항 섹션 -->
            <div class="bg-white rounded-lg shadow p-6 mb-8">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">성능 최적화 권장사항</h3>
                <div id="recommendationsContainer" class="space-y-3">
                    <div class="text-center text-gray-500 py-8">권장사항을 생성하는 중...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- 모달 -->
    <div id="alertModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg max-w-2xl w-full p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold">알림 상세 정보</h3>
                    <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                <div id="modalContent"></div>
            </div>
        </div>
    </div>

    <script>
        // 전역 변수
        let systemMetricsChart, userActivityChart;
        let refreshInterval;

        // 초기화
        document.addEventListener('DOMContentLoaded', function() {
            initializeCharts();
            loadDashboardData();
            startAutoRefresh();
            
            // 이벤트 리스너
            document.getElementById('refreshBtn').addEventListener('click', loadDashboardData);
            document.getElementById('viewAllAlertsBtn').addEventListener('click', viewAllAlerts);
            document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        });

        // 차트 초기화
        function initializeCharts() {
            // 시스템 메트릭 차트
            const systemCtx = document.getElementById('systemMetricsChart').getContext('2d');
            systemMetricsChart = new Chart(systemCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'CPU (%)',
                        data: [],
                        borderColor: 'rgb(59, 130, 246)',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        tension: 0.4
                    }, {
                        label: '메모리 (%)',
                        data: [],
                        borderColor: 'rgb(16, 185, 129)',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top'
                        }
                    }
                }
            });

            // 사용자 활동 차트
            const userCtx = document.getElementById('userActivityChart').getContext('2d');
            userActivityChart = new Chart(userCtx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: '활성 사용자',
                        data: [],
                        backgroundColor: 'rgba(99, 102, 241, 0.8)',
                        borderColor: 'rgb(99, 102, 241)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top'
                        }
                    }
                }
            });
        }

        // 대시보드 데이터 로드
        async function loadDashboardData() {
            try {
                showLoading(true);
                
                // 대시보드 요약 데이터
                const summaryResponse = await axios.get('/api/monitoring/dashboard/summary');
                if (summaryResponse.data.success) {
                    updateSummaryCards(summaryResponse.data.data);
                }

                // 현재 메트릭
                const currentMetricsResponse = await axios.get('/api/monitoring/metrics/current');
                if (currentMetricsResponse.data.success) {
                    updateCurrentMetrics(currentMetricsResponse.data.data);
                }

                // 알림 데이터
                const alertsResponse = await axios.get('/api/monitoring/alerts?hours=1');
                if (alertsResponse.data.success) {
                    updateAlerts(alertsResponse.data.data);
                }

                // 메트릭 히스토리
                const metricsResponse = await axios.get('/api/monitoring/metrics?minutes=60');
                if (metricsResponse.data.success) {
                    updateMetricsChart(metricsResponse.data.data);
                }

                // 트렌드 분석
                const trendsResponse = await axios.get('/api/monitoring/analytics/trends?hours=24');
                if (trendsResponse.data.success) {
                    updateTrends(trendsResponse.data.data);
                }

                // 이상 탐지
                const anomaliesResponse = await axios.get('/api/monitoring/analytics/anomalies?hours=24');
                if (anomaliesResponse.data.success) {
                    updateAnomalies(anomaliesResponse.data.data);
                }

                // 권장사항
                const recommendationsResponse = await axios.get('/api/monitoring/reports/recommendations?hours=24');
                if (recommendationsResponse.data.success) {
                    updateRecommendations(recommendationsResponse.data.data.recommendations);
                }

                // 모니터링 상태
                const statusResponse = await axios.get('/api/monitoring/status');
                if (statusResponse.data.success) {
                    updateMonitoringStatus(statusResponse.data.data);
                }

            } catch (error) {
                console.error('대시보드 데이터 로드 실패:', error);
                showError('데이터를 불러오는 중 오류가 발생했습니다.');
            } finally {
                showLoading(false);
            }
        }

        // 요약 카드 업데이트
        function updateSummaryCards(data) {
            document.getElementById('cpuPercent').textContent = data.current_metrics.cpu_percent.toFixed(1) + '%';
            document.getElementById('memoryPercent').textContent = data.current_metrics.memory_percent.toFixed(1) + '%';
            document.getElementById('activeUsers').textContent = data.current_metrics.active_users;
            document.getElementById('responseTime').textContent = data.current_metrics.response_time_avg.toFixed(2) + 's';
        }

        // 현재 메트릭 업데이트
        function updateCurrentMetrics(data) {
            // 추가적인 실시간 데이터 업데이트
        }

        // 알림 업데이트
        function updateAlerts(alerts) {
            const container = document.getElementById('alertsContainer');
            
            if (alerts.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-8">현재 활성 알림이 없습니다.</div>';
                return;
            }

            container.innerHTML = alerts.slice(0, 5).map(alert => `
                <div class="alert-${alert.severity} text-white rounded-lg p-4 shadow">
                    <div class="flex items-center justify-between">
                        <div>
                            <h4 class="font-semibold">${alert.message}</h4>
                            <p class="text-sm opacity-75">${new Date(alert.datetime).toLocaleString()}</p>
                        </div>
                        <button onclick="resolveAlert('${alert.alert_id}')" class="bg-white bg-opacity-20 px-3 py-1 rounded text-sm hover:bg-opacity-30">
                            해결
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 메트릭 차트 업데이트
        function updateMetricsChart(metrics) {
            const labels = metrics.map(m => new Date(m.datetime).toLocaleTimeString());
            const cpuData = metrics.map(m => m.cpu_percent);
            const memoryData = metrics.map(m => m.memory_percent);
            const userData = metrics.map(m => m.active_users);

            // 시스템 메트릭 차트 업데이트
            systemMetricsChart.data.labels = labels;
            systemMetricsChart.data.datasets[0].data = cpuData;
            systemMetricsChart.data.datasets[1].data = memoryData;
            systemMetricsChart.update();

            // 사용자 활동 차트 업데이트
            userActivityChart.data.labels = labels;
            userActivityChart.data.datasets[0].data = userData;
            userActivityChart.update();
        }

        // 트렌드 업데이트
        function updateTrends(trends) {
            const container = document.getElementById('trendsContainer');
            
            if (trends.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-8">트렌드 데이터가 없습니다.</div>';
                return;
            }

            container.innerHTML = trends.map(trend => `
                <div class="border rounded-lg p-4">
                    <div class="flex items-center justify-between">
                        <div>
                            <h4 class="font-semibold">${getMetricName(trend.metric)}</h4>
                            <p class="text-sm text-gray-600">${getTrendDescription(trend)}</p>
                        </div>
                        <div class="text-right">
                            <span class="inline-block px-2 py-1 text-xs rounded-full ${getTrendColor(trend.trend)}">
                                ${trend.trend}
                            </span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 이상 탐지 업데이트
        function updateAnomalies(anomalies) {
            const container = document.getElementById('anomaliesContainer');
            
            if (anomalies.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-8">탐지된 이상이 없습니다.</div>';
                return;
            }

            container.innerHTML = anomalies.slice(0, 5).map(anomaly => `
                <div class="border rounded-lg p-4 ${getAnomalyColor(anomaly.severity)}">
                    <div class="flex items-center justify-between">
                        <div>
                            <h4 class="font-semibold">${getMetricName(anomaly.metric)}</h4>
                            <p class="text-sm">${anomaly.description}</p>
                            <p class="text-xs text-gray-600">${new Date(anomaly.datetime).toLocaleString()}</p>
                        </div>
                        <span class="inline-block px-2 py-1 text-xs rounded-full ${getSeverityColor(anomaly.severity)}">
                            ${anomaly.severity}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        // 권장사항 업데이트
        function updateRecommendations(recommendations) {
            const container = document.getElementById('recommendationsContainer');
            
            if (recommendations.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-8">현재 권장사항이 없습니다.</div>';
                return;
            }

            container.innerHTML = recommendations.map(rec => `
                <div class="bg-blue-50 border-l-4 border-blue-400 p-4">
                    <div class="flex">
                        <div class="flex-shrink-0">
                            <svg class="h-5 w-5 text-blue-400" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                            </svg>
                        </div>
                        <div class="ml-3">
                            <p class="text-sm text-blue-700">${rec}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 모니터링 상태 업데이트
        function updateMonitoringStatus(status) {
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            
            if (status.monitoring_active) {
                indicator.className = 'w-3 h-3 rounded-full bg-green-500';
                statusText.textContent = '모니터링 활성';
            } else {
                indicator.className = 'w-3 h-3 rounded-full bg-red-500';
                statusText.textContent = '모니터링 비활성';
            }
        }

        // 유틸리티 함수들
        function getMetricName(metric) {
            const names = {
                'cpu_percent': 'CPU 사용률',
                'memory_percent': '메모리 사용률',
                'disk_usage_percent': '디스크 사용률',
                'active_users': '활성 사용자',
                'request_count': '요청 수',
                'response_time_avg': '응답 시간'
            };
            return names[metric] || metric;
        }

        function getTrendDescription(trend) {
            const direction = trend.trend === 'increasing' ? '증가' : trend.trend === 'decreasing' ? '감소' : '안정';
            return `${direction} 추세 (신뢰도: ${(trend.confidence * 100).toFixed(1)}%)`;
        }

        function getTrendColor(trend) {
            const colors = {
                'increasing': 'bg-red-100 text-red-800',
                'decreasing': 'bg-green-100 text-green-800',
                'stable': 'bg-gray-100 text-gray-800'
            };
            return colors[trend] || 'bg-gray-100 text-gray-800';
        }

        function getAnomalyColor(severity) {
            const colors = {
                'high': 'border-red-200 bg-red-50',
                'medium': 'border-yellow-200 bg-yellow-50',
                'low': 'border-blue-200 bg-blue-50'
            };
            return colors[severity] || 'border-gray-200 bg-gray-50';
        }

        function getSeverityColor(severity) {
            const colors = {
                'high': 'bg-red-100 text-red-800',
                'medium': 'bg-yellow-100 text-yellow-800',
                'low': 'bg-blue-100 text-blue-800'
            };
            return colors[severity] || 'bg-gray-100 text-gray-800';
        }

        // 알림 해결
        async function resolveAlert(alertId) {
            try {
                await axios.post(`/api/monitoring/alerts/${alertId}/resolve`);
                loadDashboardData(); // 데이터 새로고침
            } catch (error) {
                console.error('알림 해결 실패:', error);
                showError('알림 해결에 실패했습니다.');
            }
        }

        // 모든 알림 보기
        function viewAllAlerts() {
            // 알림 목록 페이지로 이동하거나 모달로 표시
            window.location.href = '/admin/monitoring/alerts';
        }

        // 모달 관련 함수들
        function closeModal() {
            document.getElementById('alertModal').classList.add('hidden');
        }

        // 로딩 상태 관리
        function showLoading(show) {
            const loadingElements = document.querySelectorAll('.loading');
            loadingElements.forEach(el => {
                if (show) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        // 에러 표시
        function showError(message) {
            // 간단한 에러 알림 표시
            alert(message);
        }

        // 자동 새로고침 시작
        function startAutoRefresh() {
            refreshInterval = setInterval(loadDashboardData, 30000); // 30초마다
        }

        // 페이지 언로드 시 정리
        window.addEventListener('beforeunload', function() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>
</body>
</html>
