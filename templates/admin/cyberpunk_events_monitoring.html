<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 이벤트/알림 - 사이버펑크</title>
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons@4.29.0/dist/feather.min.js"></script>
    <style>
        .cyber-font { font-family: 'Orbitron', monospace; }
        .cyber-text { font-family: 'Rajdhani', sans-serif; }
        .cyber-bg { background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%); }
        .cyber-orange { color: #ff6b35; }
        .cyber-orange-glow { color: #ff6b35; text-shadow: 0 0 10px #ff6b35, 0 0 20px #ff6b35; }
        .cyber-blue { color: #4ecdc4; }
        .cyber-blue-glow { color: #4ecdc4; text-shadow: 0 0 10px #4ecdc4, 0 0 20px #4ecdc4; }
        .cyber-red { color: #ff4757; }
        .cyber-red-glow { color: #ff4757; text-shadow: 0 0 10px #ff4757, 0 0 20px #ff4757; }
        .cyber-green { color: #2ed573; }
        .cyber-green-glow { color: #2ed573; text-shadow: 0 0 10px #2ed573, 0 0 20px #2ed573; }
        .cyber-yellow { color: #ffa502; }
        .cyber-yellow-glow { color: #ffa502; text-shadow: 0 0 10px #ffa502, 0 0 20px #ffa502; }
        .cyber-text-dim { color: #a0a0a0; }
        .cyber-border { border: 1px solid #333; }
        .cyber-border-orange { border: 1px solid #ff6b35; }
        .cyber-border-blue { border: 1px solid #4ecdc4; }
        .cyber-border-red { border: 1px solid #ff4757; }
        .cyber-border-green { border: 1px solid #2ed573; }
        .cyber-border-yellow { border: 1px solid #ffa502; }
        .cyber-card { background: rgba(26, 26, 46, 0.9); border: 1px solid #333; backdrop-filter: blur(15px); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
        .cyber-card-hover { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .cyber-card-hover:hover { border-color: #ff6b35; box-shadow: 0 0 30px rgba(255, 107, 53, 0.4), 0 8px 32px rgba(0, 0, 0, 0.4); transform: translateY(-4px); }
        .cyber-button { background: linear-gradient(45deg, #ff6b35, #ff8c42); border: none; color: #000; font-weight: bold; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; }
        .cyber-button::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent); transition: left 0.5s; }
        .cyber-button:hover::before { left: 100%; }
        .cyber-button:hover { background: linear-gradient(45deg, #ff8c42, #ff6b35); transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 25px rgba(255, 107, 53, 0.5); }
        .cyber-button:active { transform: translateY(-1px) scale(0.98); }
        .cyber-input { background: rgba(26, 26, 46, 0.9); border: 1px solid #333; color: #e0e0e0; transition: all 0.3s ease; }
        .cyber-input:focus { border-color: #ff6b35; box-shadow: 0 0 15px rgba(255, 107, 53, 0.4); background: rgba(26, 26, 46, 0.95); }
        .cyber-select { background: rgba(26, 26, 46, 0.9); border: 1px solid #333; color: #e0e0e0; transition: all 0.3s ease; }
        .cyber-select:focus { border-color: #ff6b35; box-shadow: 0 0 15px rgba(255, 107, 53, 0.4); background: rgba(26, 26, 46, 0.95); }
        .cyber-table { background: rgba(26, 26, 46, 0.9); border: 1px solid #333; border-radius: 8px; overflow: hidden; }
        .cyber-table th { background: rgba(255, 107, 53, 0.15); border-bottom: 1px solid #333; padding: 16px 12px; }
        .cyber-table td { border-bottom: 1px solid #333; padding: 16px 12px; transition: all 0.3s ease; }
        .cyber-table tr:hover { background: rgba(255, 107, 53, 0.08); transform: scale(1.01); }
        .cyber-modal { background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); }
        .cyber-modal-content { background: rgba(26, 26, 46, 0.98); border: 1px solid #ff6b35; border-radius: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
        .scanner-line { 
            position: absolute; 
            width: 100%; 
            height: 2px; 
            background: linear-gradient(90deg, transparent, #ff6b35, transparent);
            animation: scan 3s linear infinite;
        }
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
        .pulse-glow { animation: pulse-glow 2s ease-in-out infinite alternate; }
        @keyframes pulse-glow {
            from { box-shadow: 0 0 5px currentColor; }
            to { box-shadow: 0 0 20px currentColor, 0 0 30px currentColor; }
        }
        
        /* 추가 UI/UX 개선 스타일 */
        .cyber-card-header { background: linear-gradient(90deg, rgba(255, 107, 53, 0.1), rgba(78, 205, 196, 0.1)); border-bottom: 1px solid #333; }
        .cyber-status-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .cyber-status-success { background: rgba(46, 213, 115, 0.2); color: #2ed573; border: 1px solid #2ed573; }
        .cyber-status-warning { background: rgba(255, 165, 2, 0.2); color: #ffa502; border: 1px solid #ffa502; }
        .cyber-status-error { background: rgba(255, 71, 87, 0.2); color: #ff4757; border: 1px solid #ff4757; }
        .cyber-status-info { background: rgba(78, 205, 196, 0.2); color: #4ecdc4; border: 1px solid #4ecdc4; }
        
        .cyber-event-item { transition: all 0.3s ease; border-left: 3px solid transparent; }
        .cyber-event-item:hover { border-left-color: #ff6b35; transform: translateX(5px); }
        .cyber-event-item.system { border-left-color: #4ecdc4; }
        .cyber-event-item.user { border-left-color: #2ed573; }
        .cyber-event-item.plugin { border-left-color: #ff6b35; }
        .cyber-event-item.security { border-left-color: #ff4757; }
        
        .cyber-loading { display: inline-block; width: 20px; height: 20px; border: 2px solid #333; border-top: 2px solid #ff6b35; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .cyber-tooltip { position: relative; }
        .cyber-tooltip::after { content: attr(data-tooltip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: rgba(26, 26, 46, 0.95); color: #e0e0e0; padding: 8px 12px; border-radius: 6px; font-size: 0.75rem; white-space: nowrap; opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 1000; border: 1px solid #333; }
        .cyber-tooltip:hover::after { opacity: 1; visibility: visible; }
        
        .cyber-notification-item { position: relative; overflow: hidden; }
        .cyber-notification-item::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: #ff6b35; transform: scaleY(0); transition: transform 0.3s ease; }
        .cyber-notification-item:hover::before { transform: scaleY(1); }
        .cyber-notification-item.urgent::before { background: #ff4757; }
        
        .cyber-refresh-btn { position: relative; overflow: hidden; }
        .cyber-refresh-btn.loading { pointer-events: none; }
        .cyber-refresh-btn.loading i { animation: spin 1s linear infinite; }
        
        .cyber-pagination-btn { transition: all 0.3s ease; border-radius: 6px; }
        .cyber-pagination-btn:hover { background: rgba(255, 107, 53, 0.2); transform: translateY(-2px); }
        .cyber-pagination-btn.active { background: linear-gradient(45deg, #ff6b35, #ff8c42); color: #000; }
        
        .cyber-modal-enter { animation: modal-enter 0.3s ease-out; }
        @keyframes modal-enter {
            from { opacity: 0; transform: scale(0.9) translateY(-20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        .cyber-fade-in { animation: fade-in 0.5s ease-out; }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="cyber-bg text-gray-100 min-h-screen">
    <div class="relative">
        <!-- 스캐너 라인 -->
        <div class="scanner-line"></div>
        
        <!-- 헤더 -->
        <header class="cyber-card border-b-0 mb-6">
            <div class="flex items-center justify-between px-6 py-4">
                <div>
                    <h2 class="cyber-font text-3xl font-bold cyber-orange-glow">실시간 이벤트/알림</h2>
                    <p class="cyber-text text-lg cyber-text-dim">시스템 이벤트 및 알림 모니터링</p>
                </div>
                <a href="/admin/backend" class="cyber-button px-6 py-3 rounded-lg cyber-font transition-all duration-300">
                    <i data-feather="arrow-left" class="w-5 h-5 mr-2"></i>
                    뒤로가기
                </a>
            </div>
        </header>

        <!-- 메인 콘텐츠 -->
        <main class="p-6">
            <!-- 이벤트 통계 카드 -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="cyber-card cyber-card-hover p-6 relative overflow-hidden">
                    <div class="flex items-center">
                        <div class="p-3 bg-blue-900 bg-opacity-50 rounded-full cyber-border-blue pulse-glow cyber-blue">
                            <i data-feather="activity" class="w-6 h-6"></i>
                        </div>
                        <div class="ml-4">
                            <p class="cyber-text text-sm font-medium cyber-text-dim">오늘 이벤트</p>
                            <p class="cyber-font text-2xl font-bold cyber-blue-glow" id="today-events">0</p>
                        </div>
                    </div>
                </div>

                <div class="cyber-card cyber-card-hover p-6 relative overflow-hidden">
                    <div class="flex items-center">
                        <div class="p-3 bg-yellow-900 bg-opacity-50 rounded-full cyber-border-yellow pulse-glow cyber-yellow">
                            <i data-feather="alert-triangle" class="w-6 h-6"></i>
                        </div>
                        <div class="ml-4">
                            <p class="cyber-text text-sm font-medium cyber-text-dim">경고</p>
                            <p class="cyber-font text-2xl font-bold cyber-yellow-glow" id="warning-events">0</p>
                        </div>
                    </div>
                </div>

                <div class="cyber-card cyber-card-hover p-6 relative overflow-hidden">
                    <div class="flex items-center">
                        <div class="p-3 bg-red-900 bg-opacity-50 rounded-full cyber-border-red pulse-glow cyber-red">
                            <i data-feather="alert-circle" class="w-6 h-6"></i>
                        </div>
                        <div class="ml-4">
                            <p class="cyber-text text-sm font-medium cyber-text-dim">오류</p>
                            <p class="cyber-font text-2xl font-bold cyber-red-glow" id="error-events">0</p>
                        </div>
                    </div>
                </div>

                <div class="cyber-card cyber-card-hover p-6 relative overflow-hidden">
                    <div class="flex items-center">
                        <div class="p-3 bg-green-900 bg-opacity-50 rounded-full cyber-border-green pulse-glow cyber-green">
                            <i data-feather="check-circle" class="w-6 h-6"></i>
                        </div>
                        <div class="ml-4">
                            <p class="cyber-text text-sm font-medium cyber-text-dim">성공</p>
                            <p class="cyber-font text-2xl font-bold cyber-green-glow" id="success-events">0</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 실시간 이벤트 및 알림 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- 실시간 이벤트 -->
                <div class="cyber-card cyber-fade-in">
                    <div class="px-6 py-4 cyber-card-header flex justify-between items-center">
                        <h3 class="cyber-font text-lg font-semibold cyber-orange-glow">실시간 이벤트</h3>
                        <div class="flex space-x-2">
                            <select id="event-type-filter" class="cyber-select px-3 py-1 rounded text-sm cyber-tooltip" data-tooltip="이벤트 유형별 필터링">
                                <option value="">전체 이벤트</option>
                                <option value="system">시스템</option>
                                <option value="user">사용자</option>
                                <option value="plugin">플러그인</option>
                                <option value="security">보안</option>
                            </select>
                            <button id="refresh-events" class="cyber-button px-3 py-1 rounded text-sm cyber-font cyber-refresh-btn cyber-tooltip" data-tooltip="이벤트 목록 새로고침">
                                <i data-feather="refresh-cw" class="w-4 h-4"></i>
                                새로고침
                            </button>
                        </div>
                    </div>
                    <div class="p-6">
                        <div id="events-list" class="space-y-4 max-h-96 overflow-y-auto">
                            <!-- 실시간 이벤트가 여기에 동적으로 로드됩니다 -->
                        </div>
                    </div>
                </div>

                <!-- 알림 관리 -->
                <div class="cyber-card cyber-fade-in">
                    <div class="px-6 py-4 cyber-card-header flex justify-between items-center">
                        <h3 class="cyber-font text-lg font-semibold cyber-orange-glow">알림 관리</h3>
                        <button id="send-notification" class="cyber-button px-3 py-1 rounded text-sm cyber-font cyber-tooltip" data-tooltip="새 알림 전송">
                            <i data-feather="send" class="w-4 h-4 mr-1"></i>
                            알림 전송
                        </button>
                    </div>
                    <div class="p-6">
                        <div id="notifications-list" class="space-y-4 max-h-96 overflow-y-auto">
                            <!-- 알림 목록이 여기에 동적으로 로드됩니다 -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- 이벤트 히스토리 -->
            <div class="mt-8 cyber-card cyber-fade-in">
                <div class="px-6 py-4 cyber-card-header">
                    <h3 class="cyber-font text-lg font-semibold cyber-orange-glow">이벤트 히스토리</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="cyber-table min-w-full">
                        <thead>
                            <tr>
                                <th class="px-6 py-3 text-left text-xs cyber-font cyber-text-dim uppercase tracking-wider cyber-tooltip" data-tooltip="이벤트 발생 시간">시간</th>
                                <th class="px-6 py-3 text-left text-xs cyber-font cyber-text-dim uppercase tracking-wider cyber-tooltip" data-tooltip="이벤트 카테고리">이벤트 유형</th>
                                <th class="px-6 py-3 text-left text-xs cyber-font cyber-text-dim uppercase tracking-wider cyber-tooltip" data-tooltip="이벤트 발생 사용자">사용자</th>
                                <th class="px-6 py-3 text-left text-xs cyber-font cyber-text-dim uppercase tracking-wider cyber-tooltip" data-tooltip="이벤트 상태">상태</th>
                                <th class="px-6 py-3 text-left text-xs cyber-font cyber-text-dim uppercase tracking-wider cyber-tooltip" data-tooltip="이벤트 상세 정보">상세정보</th>
                            </tr>
                        </thead>
                        <tbody id="events-history-table" class="divide-y divide-gray-700">
                            <!-- 이벤트 히스토리가 여기에 동적으로 로드됩니다 -->
                        </tbody>
                    </table>
                </div>
                <div class="px-6 py-4 cyber-border-t">
                    <div class="flex items-center justify-between">
                        <div class="cyber-text text-sm cyber-text-dim">
                            총 <span id="total-events" class="cyber-orange font-bold">0</span>개의 이벤트
                        </div>
                        <div class="flex space-x-2" id="events-pagination">
                            <!-- 페이지네이션이 여기에 표시됩니다 -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 알림 전송 모달 -->
    <div id="notification-modal" class="cyber-modal fixed inset-0 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="cyber-modal-content rounded-lg shadow-xl max-w-md w-full cyber-modal-enter">
                <div class="px-6 py-4 cyber-border-b">
                    <h3 class="cyber-font text-lg font-semibold cyber-orange-glow">알림 전송</h3>
                </div>
                <div class="px-6 py-4">
                    <div class="space-y-4">
                        <div>
                            <label class="block cyber-text text-sm font-medium cyber-text-dim mb-2 cyber-tooltip" data-tooltip="알림을 받을 대상 선택">수신자</label>
                            <select id="notification-recipient" class="cyber-select w-full px-3 py-2 rounded-lg">
                                <option value="all">전체 사용자</option>
                                <option value="admins">관리자만</option>
                                <option value="industry_admins">업종별 관리자</option>
                            </select>
                        </div>
                        <div>
                            <label class="block cyber-text text-sm font-medium cyber-text-dim mb-2 cyber-tooltip" data-tooltip="알림의 제목을 입력하세요">제목</label>
                            <input type="text" id="notification-title" class="cyber-input w-full px-3 py-2 rounded-lg" placeholder="알림 제목을 입력하세요" maxlength="100">
                        </div>
                        <div>
                            <label class="block cyber-text text-sm font-medium cyber-text-dim mb-2 cyber-tooltip" data-tooltip="알림의 상세 내용을 입력하세요">내용</label>
                            <textarea id="notification-content" rows="4" class="cyber-input w-full px-3 py-2 rounded-lg" placeholder="알림 내용을 입력하세요" maxlength="500"></textarea>
                        </div>
                        <div>
                            <label class="flex items-center cursor-pointer">
                                <input type="checkbox" id="notification-urgent" class="rounded cyber-border text-ff6b35 focus:ring-ff6b35">
                                <span class="ml-2 cyber-text text-sm cyber-text-dim cyber-tooltip" data-tooltip="긴급 알림으로 설정하면 우선순위가 높아집니다">긴급 알림</span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="px-6 py-4 cyber-border-t flex justify-end space-x-3">
                    <button onclick="closeNotificationModal()" class="px-4 py-2 cyber-text-dim hover:cyber-orange transition-colors cyber-font">
                        취소
                    </button>
                    <button onclick="sendNotification()" class="cyber-button px-4 py-2 rounded-lg cyber-font">
                        <i data-feather="send" class="w-4 h-4 mr-1"></i>
                        전송
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Feather 아이콘 초기화
        if (typeof feather !== 'undefined') {
            feather.replace();
        }

        let currentEventsPage = 1;

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', function() {
            loadEventStats();
            loadRecentEvents();
            loadNotifications();
            loadEventsHistory();
            
            // 30초마다 데이터 업데이트
            setInterval(loadRecentEvents, 30000);
            setInterval(loadEventStats, 60000);
        });

        // 이벤트 리스너
        document.getElementById('refresh-events').addEventListener('click', loadRecentEvents);
        document.getElementById('event-type-filter').addEventListener('change', loadRecentEvents);
        document.getElementById('send-notification').addEventListener('click', showNotificationModal);

        // 이벤트 통계 로드
        function loadEventStats() {
            fetch('/api/backend/events/stats')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('today-events').textContent = data.today_events || 0;
                    document.getElementById('warning-events').textContent = data.warning_events || 0;
                    document.getElementById('error-events').textContent = data.error_events || 0;
                    document.getElementById('success-events').textContent = data.success_events || 0;
                })
                .catch(error => {
                    console.error('Error loading event stats:', error);
                });
        }

        // 최근 이벤트 로드
        function loadRecentEvents() {
            const type = document.getElementById('event-type-filter').value;
            const refreshBtn = document.getElementById('refresh-events');
            
            // 로딩 상태 표시
            refreshBtn.classList.add('loading');
            refreshBtn.innerHTML = '<div class="cyber-loading"></div> 새로고침';
            
            fetch(`/api/backend/events/recent?type=${type}`)
                .then(response => response.json())
                .then(data => {
                    renderRecentEvents(data.events || []);
                })
                .catch(error => {
                    console.error('Error loading recent events:', error);
                    // 에러 상태 표시
                    const container = document.getElementById('events-list');
                    container.innerHTML = `
                        <div class="text-center py-8 cyber-red">
                            <i data-feather="alert-triangle" class="w-12 h-12 mx-auto mb-4"></i>
                            <p class="cyber-text">이벤트 로드 중 오류가 발생했습니다</p>
                        </div>
                    `;
                    if (typeof feather !== 'undefined') {
            feather.replace();
        }
                })
                .finally(() => {
                    // 로딩 상태 해제
                    refreshBtn.classList.remove('loading');
                    refreshBtn.innerHTML = '<i data-feather="refresh-cw" class="w-4 h-4"></i> 새로고침';
                    if (typeof feather !== 'undefined') {
            feather.replace();
        }
                });
        }

        // 최근 이벤트 렌더링
        function renderRecentEvents(events) {
            const container = document.getElementById('events-list');
            container.innerHTML = '';

            if (events.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 cyber-text-dim">
                        <i data-feather="inbox" class="w-12 h-12 mx-auto mb-4 cyber-text-dim"></i>
                        <p class="cyber-text">표시할 이벤트가 없습니다</p>
                    </div>
                `;
                if (typeof feather !== 'undefined') {
            feather.replace();
        }
                return;
            }

            events.forEach((event, index) => {
                const eventDiv = document.createElement('div');
                eventDiv.className = `flex items-start space-x-3 p-3 cyber-card rounded-lg cyber-card-hover cyber-event-item ${event.type || 'system'}`;
                eventDiv.style.animationDelay = `${index * 0.1}s`;
                
                const iconClass = getEventIconClass(event.type);
                const statusClass = getEventStatusClass(event.status);
                
                eventDiv.innerHTML = `
                    <div class="flex-shrink-0">
                        <i data-feather="${getEventIcon(event.type)}" class="w-5 h-5 ${iconClass}"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between">
                            <p class="cyber-text text-sm font-medium text-gray-100">${event.title || '이벤트'}</p>
                            <span class="cyber-status-badge ${statusClass}">
                                ${getEventStatusText(event.status)}
                            </span>
                        </div>
                        <p class="cyber-text text-sm cyber-text-dim">${event.description || ''}</p>
                        <p class="cyber-text text-xs cyber-text-dim mt-1">${formatDateTime(event.timestamp)}</p>
                    </div>
                `;
                
                container.appendChild(eventDiv);
            });
            
            // Feather 아이콘 다시 초기화
            if (typeof feather !== 'undefined') {
            feather.replace();
        }
        }

        // 알림 로드
        function loadNotifications() {
            fetch('/api/backend/notifications')
                .then(response => response.json())
                .then(data => {
                    renderNotifications(data.notifications || []);
                })
                .catch(error => {
                    console.error('Error loading notifications:', error);
                });
        }

        // 알림 렌더링
        function renderNotifications(notifications) {
            const container = document.getElementById('notifications-list');
            container.innerHTML = '';

            if (notifications.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 cyber-text-dim">
                        <i data-feather="bell-off" class="w-12 h-12 mx-auto mb-4 cyber-text-dim"></i>
                        <p class="cyber-text">표시할 알림이 없습니다</p>
                    </div>
                `;
                if (typeof feather !== 'undefined') {
            feather.replace();
        }
                return;
            }

            notifications.forEach((notification, index) => {
                const notificationDiv = document.createElement('div');
                notificationDiv.className = `flex items-start space-x-3 p-3 cyber-card rounded-lg cyber-card-hover cyber-notification-item ${notification.is_urgent ? 'urgent' : ''}`;
                notificationDiv.style.animationDelay = `${index * 0.1}s`;
                
                const urgentClass = notification.is_urgent ? 'cyber-red' : 'cyber-blue';
                
                notificationDiv.innerHTML = `
                    <div class="flex-shrink-0">
                        <i data-feather="bell" class="w-5 h-5 ${urgentClass}"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between">
                            <p class="cyber-text text-sm font-medium text-gray-100">${notification.title}</p>
                            ${notification.is_urgent ? '<span class="cyber-status-badge cyber-status-error">긴급</span>' : ''}
                        </div>
                        <p class="cyber-text text-sm cyber-text-dim">${notification.content}</p>
                        <p class="cyber-text text-xs cyber-text-dim mt-1">${formatDateTime(notification.created_at)}</p>
                    </div>
                `;
                
                container.appendChild(notificationDiv);
            });
            
            if (typeof feather !== 'undefined') {
            feather.replace();
        }
        }

        // 이벤트 히스토리 로드
        function loadEventsHistory() {
            fetch(`/api/backend/events/history?page=${currentEventsPage}`)
                .then(response => response.json())
                .then(data => {
                    renderEventsHistory(data.events || []);
                    renderEventsPagination(data.total, data.pages, data.current_page);
                    document.getElementById('total-events').textContent = data.total || 0;
                })
                .catch(error => {
                    console.error('Error loading events history:', error);
                });
        }

        // 이벤트 히스토리 렌더링
        function renderEventsHistory(events) {
            const tbody = document.getElementById('events-history-table');
            tbody.innerHTML = '';

            events.forEach(event => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-800 hover:bg-opacity-50';
                
                const statusClass = getEventStatusClass(event.status);
                
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap cyber-text text-sm cyber-text-dim">
                        ${formatDateTime(event.timestamp)}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap cyber-text text-sm text-gray-100">
                        ${getEventTypeText(event.type)}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap cyber-text text-sm text-gray-100">
                        ${event.user_id || 'N/A'}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="inline-flex px-2 py-1 text-xs cyber-font rounded-full ${statusClass}">
                            ${getEventStatusText(event.status)}
                        </span>
                    </td>
                    <td class="px-6 py-4 cyber-text text-sm text-gray-100">
                        ${event.details || 'N/A'}
                    </td>
                `;
                
                tbody.appendChild(row);
            });
        }

        // 이벤트 페이지네이션 렌더링
        function renderEventsPagination(total, pages, current) {
            const pagination = document.getElementById('events-pagination');
            pagination.innerHTML = '';
            
            if (pages <= 1) return;
            
            // 이전 페이지
            if (current > 1) {
                const prevBtn = document.createElement('button');
                prevBtn.className = 'px-3 py-1 cyber-text text-sm cyber-text-dim hover:cyber-orange transition-colors cyber-pagination-btn cyber-tooltip';
                prevBtn.setAttribute('data-tooltip', '이전 페이지');
                prevBtn.innerHTML = '<i data-feather="chevron-left" class="w-4 h-4"></i> 이전';
                prevBtn.onclick = () => {
                    currentEventsPage = current - 1;
                    loadEventsHistory();
                };
                pagination.appendChild(prevBtn);
            }
            
            // 페이지 번호 (최대 5개만 표시)
            const startPage = Math.max(1, current - 2);
            const endPage = Math.min(pages, current + 2);
            
            if (startPage > 1) {
                const firstBtn = document.createElement('button');
                firstBtn.className = 'px-3 py-1 cyber-text text-sm cyber-text-dim hover:cyber-orange transition-colors cyber-pagination-btn';
                firstBtn.textContent = '1';
                firstBtn.onclick = () => {
                    currentEventsPage = 1;
                    loadEventsHistory();
                };
                pagination.appendChild(firstBtn);
                
                if (startPage > 2) {
                    const ellipsis = document.createElement('span');
                    ellipsis.className = 'px-2 py-1 cyber-text text-sm cyber-text-dim';
                    ellipsis.textContent = '...';
                    pagination.appendChild(ellipsis);
                }
            }
            
            for (let i = startPage; i <= endPage; i++) {
                if (i === current) {
                    const currentBtn = document.createElement('button');
                    currentBtn.className = 'px-3 py-1 cyber-text text-sm cyber-pagination-btn active cyber-font';
                    currentBtn.textContent = i;
                    pagination.appendChild(currentBtn);
                } else {
                    const pageBtn = document.createElement('button');
                    pageBtn.className = 'px-3 py-1 cyber-text text-sm cyber-text-dim hover:cyber-orange transition-colors cyber-pagination-btn';
                    pageBtn.textContent = i;
                    pageBtn.onclick = () => {
                        currentEventsPage = i;
                        loadEventsHistory();
                    };
                    pagination.appendChild(pageBtn);
                }
            }
            
            if (endPage < pages) {
                if (endPage < pages - 1) {
                    const ellipsis = document.createElement('span');
                    ellipsis.className = 'px-2 py-1 cyber-text text-sm cyber-text-dim';
                    ellipsis.textContent = '...';
                    pagination.appendChild(ellipsis);
                }
                
                const lastBtn = document.createElement('button');
                lastBtn.className = 'px-3 py-1 cyber-text text-sm cyber-text-dim hover:cyber-orange transition-colors cyber-pagination-btn';
                lastBtn.textContent = pages;
                lastBtn.onclick = () => {
                    currentEventsPage = pages;
                    loadEventsHistory();
                };
                pagination.appendChild(lastBtn);
            }
            
            // 다음 페이지
            if (current < pages) {
                const nextBtn = document.createElement('button');
                nextBtn.className = 'px-3 py-1 cyber-text text-sm cyber-text-dim hover:cyber-orange transition-colors cyber-pagination-btn cyber-tooltip';
                nextBtn.setAttribute('data-tooltip', '다음 페이지');
                nextBtn.innerHTML = '다음 <i data-feather="chevron-right" class="w-4 h-4"></i>';
                nextBtn.onclick = () => {
                    currentEventsPage = current + 1;
                    loadEventsHistory();
                };
                pagination.appendChild(nextBtn);
            }
            
            if (typeof feather !== 'undefined') {
            feather.replace();
        }
        }

        // 알림 모달 표시
        function showNotificationModal() {
            document.getElementById('notification-modal').classList.remove('hidden');
        }

        // 알림 모달 닫기
        function closeNotificationModal() {
            document.getElementById('notification-modal').classList.add('hidden');
            // 입력 필드 초기화
            document.getElementById('notification-title').value = '';
            document.getElementById('notification-content').value = '';
            document.getElementById('notification-urgent').checked = false;
        }

        // 알림 전송
        function sendNotification() {
            const recipient = document.getElementById('notification-recipient').value;
            const title = document.getElementById('notification-title').value;
            const content = document.getElementById('notification-content').value;
            const isUrgent = document.getElementById('notification-urgent').checked;
            const sendBtn = document.querySelector('button[onclick="sendNotification()"]');

            if (!title.trim() || !content.trim()) {
                // 사이버펑크 스타일 알림
                showCyberNotification('제목과 내용을 모두 입력해주세요.', 'error');
                return;
            }

            // 로딩 상태
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<div class="cyber-loading"></div> 전송 중...';

            fetch('/api/backend/notifications/send', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    recipient: recipient,
                    title: title,
                    content: content,
                    is_urgent: isUrgent
                })
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    showCyberNotification('알림이 전송되었습니다.', 'success');
                    closeNotificationModal();
                    loadNotifications();
                } else {
                    showCyberNotification('오류가 발생했습니다: ' + result.error, 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showCyberNotification('오류가 발생했습니다.', 'error');
            })
            .finally(() => {
                // 로딩 상태 해제
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i data-feather="send" class="w-4 h-4 mr-1"></i> 전송';
                if (typeof feather !== 'undefined') {
            feather.replace();
        }
            });
        }

        // 사이버펑크 스타일 알림 표시
        function showCyberNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 z-50 cyber-card cyber-modal-enter p-4 max-w-sm`;
            
            const iconClass = type === 'success' ? 'cyber-green' : type === 'error' ? 'cyber-red' : 'cyber-blue';
            const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'alert-triangle' : 'info';
            
            notification.innerHTML = `
                <div class="flex items-center space-x-3">
                    <i data-feather="${icon}" class="w-5 h-5 ${iconClass}"></i>
                    <p class="cyber-text text-sm">${message}</p>
                    <button onclick="this.parentElement.parentElement.remove()" class="cyber-text-dim hover:cyber-orange">
                        <i data-feather="x" class="w-4 h-4"></i>
                    </button>
                </div>
            `;
            
            document.body.appendChild(notification);
            if (typeof feather !== 'undefined') {
            feather.replace();
        }
            
            // 5초 후 자동 제거
            setTimeout(() => {
                if (notification.parentElement) {
                    notification.remove();
                }
            }, 5000);
        }

        // 이벤트 아이콘 클래스
        function getEventIconClass(type) {
            switch(type) {
                case 'system': return 'cyber-blue';
                case 'user': return 'cyber-green';
                case 'plugin': return 'cyber-orange';
                case 'security': return 'cyber-red';
                default: return 'cyber-text-dim';
            }
        }

        // 이벤트 아이콘
        function getEventIcon(type) {
            switch(type) {
                case 'system': return 'cpu';
                case 'user': return 'user';
                case 'plugin': return 'package';
                case 'security': return 'shield';
                default: return 'activity';
            }
        }

        // 이벤트 상태 클래스
        function getEventStatusClass(status) {
            switch(status) {
                case 'success': return 'cyber-status-success';
                case 'warning': return 'cyber-status-warning';
                case 'error': return 'cyber-status-error';
                case 'info': return 'cyber-status-info';
                default: return 'cyber-status-info';
            }
        }

        // 이벤트 상태 텍스트
        function getEventStatusText(status) {
            switch(status) {
                case 'success': return '성공';
                case 'warning': return '경고';
                case 'error': return '오류';
                case 'info': return '정보';
                default: return '알 수 없음';
            }
        }

        // 이벤트 유형 텍스트
        function getEventTypeText(type) {
            switch(type) {
                case 'system': return '시스템';
                case 'user': return '사용자';
                case 'plugin': return '플러그인';
                case 'security': return '보안';
                default: return '기타';
            }
        }

        // 날짜/시간 포맷팅
        function formatDateTime(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleString('ko-KR');
        }
    </script>
</body>
