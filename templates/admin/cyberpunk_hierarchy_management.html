<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계층별 관리 - 시스템 관리</title>
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .cyberpunk-bg {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
        }
        .neon-border {
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        .neon-text {
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.2);
        }
    </style>
</head>
<body class="cyberpunk-bg min-h-screen text-white">
    <div class="container mx-auto px-4 py-8">
        <!-- 헤더 -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold neon-text mb-4">
                <i class="fas fa-sitemap mr-3"></i>계층별 관리 시스템
            </h1>
            <p class="text-gray-300 text-lg">업종-브랜드-매장-직원 계층 구조 관리</p>
        </div>

        <!-- 통계 카드 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-gray-800 rounded-lg p-6 neon-border card-hover">
                <div class="flex items-center">
                    <i class="fas fa-industry text-3xl text-blue-400 mr-4"></i>
                    <div>
                        <h3 class="text-lg font-semibold">업종</h3>
                        <p class="text-2xl font-bold text-blue-400" id="industry-count">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-gray-800 rounded-lg p-6 neon-border card-hover">
                <div class="flex items-center">
                    <i class="fas fa-trademark text-3xl text-green-400 mr-4"></i>
                    <div>
                        <h3 class="text-lg font-semibold">브랜드</h3>
                        <p class="text-2xl font-bold text-green-400" id="brand-count">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-gray-800 rounded-lg p-6 neon-border card-hover">
                <div class="flex items-center">
                    <i class="fas fa-store text-3xl text-yellow-400 mr-4"></i>
                    <div>
                        <h3 class="text-lg font-semibold">매장</h3>
                        <p class="text-2xl font-bold text-yellow-400" id="branch-count">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-gray-800 rounded-lg p-6 neon-border card-hover">
                <div class="flex items-center">
                    <i class="fas fa-users text-3xl text-purple-400 mr-4"></i>
                    <div>
                        <h3 class="text-lg font-semibold">직원</h3>
                        <p class="text-2xl font-bold text-purple-400" id="employee-count">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 관리 메뉴 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
            <a href="/admin/backend/industry-management" class="block">
                <div class="bg-gray-800 rounded-lg p-6 neon-border card-hover text-center">
                    <i class="fas fa-industry text-4xl text-blue-400 mb-4"></i>
                    <h3 class="text-xl font-semibold mb-2">업종 관리</h3>
                    <p class="text-gray-400">업종 정보 등록 및 관리</p>
                </div>
            </a>
            <a href="/admin/backend/brand-management" class="block">
                <div class="bg-gray-800 rounded-lg p-6 neon-border card-hover text-center">
                    <i class="fas fa-trademark text-4xl text-green-400 mb-4"></i>
                    <h3 class="text-xl font-semibold mb-2">브랜드 관리</h3>
                    <p class="text-gray-400">브랜드 정보 등록 및 관리</p>
                </div>
            </a>
            <a href="/admin/backend/branch-management" class="block">
                <div class="bg-gray-800 rounded-lg p-6 neon-border card-hover text-center">
                    <i class="fas fa-store text-4xl text-yellow-400 mb-4"></i>
                    <h3 class="text-xl font-semibold mb-2">매장 관리</h3>
                    <p class="text-gray-400">매장 정보 등록 및 관리</p>
                </div>
            </a>
            <a href="/admin/backend/employee-management" class="block">
                <div class="bg-gray-800 rounded-lg p-6 neon-border card-hover text-center">
                    <i class="fas fa-users text-4xl text-purple-400 mb-4"></i>
                    <h3 class="text-xl font-semibold mb-2">직원 관리</h3>
                    <p class="text-gray-400">직원 정보 등록 및 관리</p>
                </div>
            </a>
        </div>

        <!-- 계층 트리 뷰어 -->
        <div class="bg-gray-800 rounded-lg p-6 neon-border">
            <h2 class="text-2xl font-bold mb-4 neon-text">
                <i class="fas fa-sitemap mr-2"></i>계층 구조 트리
            </h2>
            <div id="hierarchy-tree" class="bg-gray-900 rounded p-4 min-h-96">
                <div class="text-center text-gray-400">
                    <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                    <p>계층 구조를 불러오는 중...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 페이지 로드 시 통계 데이터 가져오기
        document.addEventListener('DOMContentLoaded', function() {
            loadHierarchyStats();
            loadHierarchyTree();
        });

        // 계층별 통계 데이터 로드
        function loadHierarchyStats() {
            fetch('/api/admin/hierarchy/tree')
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.data) {
                        const industries = data.data;
                        let industryCount = industries.length;
                        let brandCount = 0;
                        let branchCount = 0;
                        let employeeCount = 0;

                        industries.forEach(industry => {
                            if (industry.brands) {
                                brandCount += industry.brands.length;
                                industry.brands.forEach(brand => {
                                    if (brand.branches) {
                                        branchCount += brand.branches.length;
                                        brand.branches.forEach(branch => {
                                            if (branch.users) {
                                                employeeCount += branch.users.length;
                                            }
                                        });
                                    }
                                });
                            }
                        });

                        document.getElementById('industry-count').textContent = industryCount;
                        document.getElementById('brand-count').textContent = brandCount;
                        document.getElementById('branch-count').textContent = branchCount;
                        document.getElementById('employee-count').textContent = employeeCount;
                    }
                })
                .catch(error => {
                    console.error('통계 데이터 로드 실패:', error);
                });
        }

        // 계층 트리 로드
        function loadHierarchyTree() {
            fetch('/api/admin/hierarchy/tree')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        renderHierarchyTree(data.data);
                    } else {
                        document.getElementById('hierarchy-tree').innerHTML = 
                            '<div class="text-center text-red-400"><i class="fas fa-exclamation-triangle mr-2"></i>데이터를 불러올 수 없습니다.</div>';
                    }
                })
                .catch(error => {
                    console.error('계층 트리 로드 실패:', error);
                    document.getElementById('hierarchy-tree').innerHTML = 
                        '<div class="text-center text-red-400"><i class="fas fa-exclamation-triangle mr-2"></i>데이터를 불러올 수 없습니다.</div>';
                });
        }

        // 계층 트리 렌더링
        function renderHierarchyTree(data) {
            const container = document.getElementById('hierarchy-tree');
            let html = '';

            if (!data || !data.industries || !Array.isArray(data.industries)) {
                html = '<div class="text-center text-red-400"><i class="fas fa-exclamation-triangle mr-2"></i>데이터가 없습니다.</div>';
                container.innerHTML = html;
                return;
            }

            data.industries.forEach(industry => {
                const brandCount = industry.brands ? industry.brands.length : 0;
                html += `
                    <div class="mb-4">
                        <div class="bg-blue-900 rounded p-3 mb-2">
                            <i class="fas fa-industry mr-2"></i>
                            <span class="font-semibold">${industry.name}</span>
                            <span class="text-sm text-gray-300 ml-2">(${brandCount}개 브랜드)</span>
                        </div>
                `;

                if (industry.brands) {
                    industry.brands.forEach(brand => {
                        const branchCount = brand.branches ? brand.branches.length : 0;
                        html += `
                            <div class="ml-6 mb-3">
                                <div class="bg-green-900 rounded p-2 mb-2">
                                    <i class="fas fa-trademark mr-2"></i>
                                    <span class="font-semibold">${brand.name}</span>
                                    <span class="text-sm text-gray-300 ml-2">(${branchCount}개 매장)</span>
                                </div>
                        `;

                        if (brand.branches) {
                            brand.branches.forEach(branch => {
                                const userCount = branch.users ? branch.users.length : 0;
                                html += `
                                    <div class="ml-6 mb-2">
                                        <div class="bg-yellow-900 rounded p-2 mb-1">
                                            <i class="fas fa-store mr-2"></i>
                                            <span class="font-semibold">${branch.name}</span>
                                            <span class="text-sm text-gray-300 ml-2">(${userCount}명 직원)</span>
                                        </div>
                                `;

                                if (branch.users && branch.users.length > 0) {
                                    html += '<div class="ml-6">';
                                    branch.users.forEach(user => {
                                        html += `
                                            <div class="bg-purple-900 rounded p-1 mb-1 text-sm">
                                                <i class="fas fa-user mr-2"></i>
                                                <span>${user.username}</span>
                                                <span class="text-gray-300 ml-2">(${user.role})</span>
                                            </div>
                                        `;
                                    });
                                    html += '</div>';
                                }

                                html += '</div>';
                            });
                        }

                        html += '</div>';
                    });
                }

                html += '</div>';
            });

            container.innerHTML = html;
        }
    </script>
</body>
</html>
