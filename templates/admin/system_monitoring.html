<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템/서버 운영/모니터링</title>
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- 헤더 -->
        <header class="bg-white shadow-sm border-b">
            <div class="flex items-center justify-between px-6 py-4">
                <div>
                    <h2 class="text-2xl font-bold text-gray-900">시스템/서버 운영/모니터링</h2>
                    <p class="text-gray-600">실시간 시스템 상태 및 리소스 모니터링</p>
                </div>
                <a href="/admin/backend" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors">
                    뒤로가기
                </a>
            </div>
        </header>

        <!-- 메인 콘텐츠 -->
        <main class="p-6">
            <!-- 시스템 상태 카드 -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="p-3 bg-blue-100 rounded-full">
                            <i data-feather="cpu" class="w-6 h-6 text-blue-600"></i>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-600">CPU 사용률</p>
                            <p class="text-2xl font-bold text-gray-900" id="cpu-usage">0%</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="p-3 bg-green-100 rounded-full">
                            <i data-feather="hard-drive" class="w-6 h-6 text-green-600"></i>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-600">메모리 사용률</p>
                            <p class="text-2xl font-bold text-gray-900" id="memory-usage">0%</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="p-3 bg-yellow-100 rounded-full">
                            <i data-feather="database" class="w-6 h-6 text-yellow-600"></i>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-600">디스크 사용률</p>
                            <p class="text-2xl font-bold text-gray-900" id="disk-usage">0%</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="p-3 bg-purple-100 rounded-full">
                            <i data-feather="activity" class="w-6 h-6 text-purple-600"></i>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-600">네트워크</p>
                            <p class="text-2xl font-bold text-gray-900" id="network-status">정상</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 모니터링 차트 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">시스템 리소스 사용률 (24시간)</h3>
                    <canvas id="systemResourcesChart" width="400" height="200"></canvas>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">응답 시간 추이</h3>
                    <canvas id="responseTimeChart" width="400" height="200"></canvas>
                </div>
            </div>

            <!-- 시스템 로그 -->
            <div class="bg-white rounded-lg shadow">
                <div class="px-6 py-4 border-b flex justify-between items-center">
                    <h3 class="text-lg font-semibold text-gray-900">시스템 로그</h3>
                    <div class="flex space-x-2">
                        <select id="log-level-filter" class="px-3 py-1 border border-gray-300 rounded text-sm">
                            <option value="">전체 레벨</option>
                            <option value="info">Info</option>
                            <option value="warning">Warning</option>
                            <option value="error">Error</option>
                            <option value="critical">Critical</option>
                        </select>
                        <button id="refresh-logs" class="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700 transition-colors">
                            새로고침
                        </button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">시간</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">레벨</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">메시지</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">소스</th>
                            </tr>
                        </thead>
                        <tbody id="logs-table-body" class="bg-white divide-y divide-gray-200">
                            <!-- 로그 목록이 여기에 동적으로 로드됩니다 -->
                        </tbody>
                    </table>
                </div>
                <div class="px-6 py-4 border-t">
                    <div class="flex items-center justify-between">
                        <div class="text-sm text-gray-700">
                            총 <span id="total-logs">0</span>개의 로그
                        </div>
                        <div class="flex space-x-2" id="logs-pagination">
                            <!-- 페이지네이션이 여기에 표시됩니다 -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Feather 아이콘 초기화
        feather.replace();

        let currentLogsPage = 1;
        let systemResourcesChart, responseTimeChart;

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', function() {
            initializeCharts();
            loadSystemMetrics();
            loadSystemLogs();
            
            // 30초마다 데이터 업데이트
            setInterval(loadSystemMetrics, 30000);
            setInterval(loadSystemLogs, 60000);
        });

        // 필터 이벤트
        document.getElementById('log-level-filter').addEventListener('change', function() {
            currentLogsPage = 1;
            loadSystemLogs();
        });
        document.getElementById('refresh-logs').addEventListener('click', function() {
            loadSystemLogs();
        });

        // 차트 초기화
        function initializeCharts() {
            // 시스템 리소스 차트
            const systemCtx = document.getElementById('systemResourcesChart').getContext('2d');
            systemResourcesChart = new Chart(systemCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'CPU (%)',
                        data: [],
                        borderColor: 'rgb(59, 130, 246)',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        tension: 0.4
                    }, {
                        label: '메모리 (%)',
                        data: [],
                        borderColor: 'rgb(16, 185, 129)',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        tension: 0.4
                    }, {
                        label: '디스크 (%)',
                        data: [],
                        borderColor: 'rgb(245, 158, 11)',
                        backgroundColor: 'rgba(245, 158, 11, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100
                        }
                    }
                }
            });

            // 응답 시간 차트
            const responseCtx = document.getElementById('responseTimeChart').getContext('2d');
            responseTimeChart = new Chart(responseCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '응답 시간 (ms)',
                        data: [],
                        borderColor: 'rgb(147, 51, 234)',
                        backgroundColor: 'rgba(147, 51, 234, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        // 시스템 메트릭 로드
        function loadSystemMetrics() {
            fetch('/api/system/metrics')
                .then(response => response.json())
                .then(data => {
                    // 상태 카드 업데이트
                    document.getElementById('cpu-usage').textContent = Math.round(data.cpu_percent || 0) + '%';
                    document.getElementById('memory-usage').textContent = Math.round(data.memory_percent || 0) + '%';
                    document.getElementById('disk-usage').textContent = Math.round(data.disk_percent || 0) + '%';
                    document.getElementById('network-status').textContent = data.network_status || '정상';

                    // 차트 데이터 업데이트
                    updateCharts(data);
                })
                .catch(error => {
                    console.error('Error loading system metrics:', error);
                });
        }

        // 차트 업데이트
        function updateCharts(data) {
            const now = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
            
            // 시스템 리소스 차트
            if (systemResourcesChart.data.labels.length > 20) {
                systemResourcesChart.data.labels.shift();
                systemResourcesChart.data.datasets[0].data.shift();
                systemResourcesChart.data.datasets[1].data.shift();
                systemResourcesChart.data.datasets[2].data.shift();
            }
            
            systemResourcesChart.data.labels.push(now);
            systemResourcesChart.data.datasets[0].data.push(data.cpu_percent || 0);
            systemResourcesChart.data.datasets[1].data.push(data.memory_percent || 0);
            systemResourcesChart.data.datasets[2].data.push(data.disk_percent || 0);
            systemResourcesChart.update();

            // 응답 시간 차트
            if (responseTimeChart.data.labels.length > 20) {
                responseTimeChart.data.labels.shift();
                responseTimeChart.data.datasets[0].data.shift();
            }
            
            responseTimeChart.data.labels.push(now);
            responseTimeChart.data.datasets[0].data.push(data.response_time || 0);
            responseTimeChart.update();
        }

        // 시스템 로그 로드
        function loadSystemLogs() {
            const level = document.getElementById('log-level-filter').value;
            
            fetch(`/api/backend/system/logs?page=${currentLogsPage}&level=${level}`)
                .then(response => response.json())
                .then(data => {
                    renderLogsTable(data.logs);
                    renderLogsPagination(data.total, data.pages, data.current_page);
                    document.getElementById('total-logs').textContent = data.total || 0;
                })
                .catch(error => {
                    console.error('Error loading system logs:', error);
                });
        }

        // 로그 테이블 렌더링
        function renderLogsTable(logs) {
            const tbody = document.getElementById('logs-table-body');
            tbody.innerHTML = '';

            logs.forEach(log => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';
                
                const levelClass = getLogLevelClass(log.level);
                
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${formatDateTime(log.timestamp)}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full ${levelClass}">
                            ${log.level.toUpperCase()}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-900">
                        ${log.message}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${log.source || 'N/A'}
                    </td>
                `;
                
                tbody.appendChild(row);
            });
        }

        // 로그 레벨별 스타일 클래스
        function getLogLevelClass(level) {
            switch(level.toLowerCase()) {
                case 'info': return 'bg-blue-100 text-blue-800';
                case 'warning': return 'bg-yellow-100 text-yellow-800';
                case 'error': return 'bg-red-100 text-red-800';
                case 'critical': return 'bg-red-200 text-red-900';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        // 로그 페이지네이션 렌더링
        function renderLogsPagination(total, pages, current) {
            const pagination = document.getElementById('logs-pagination');
            pagination.innerHTML = '';
            
            if (pages <= 1) return;
            
            // 이전 페이지
            if (current > 1) {
                const prevBtn = document.createElement('button');
                prevBtn.className = 'px-3 py-1 text-sm text-gray-500 hover:text-gray-700';
                prevBtn.textContent = '이전';
                prevBtn.onclick = () => {
                    currentLogsPage = current - 1;
                    loadSystemLogs();
                };
                pagination.appendChild(prevBtn);
            }
            
            // 페이지 번호
            for (let i = 1; i <= pages; i++) {
                if (i === current) {
                    const currentBtn = document.createElement('button');
                    currentBtn.className = 'px-3 py-1 text-sm bg-blue-600 text-white rounded';
                    currentBtn.textContent = i;
                    pagination.appendChild(currentBtn);
                } else {
                    const pageBtn = document.createElement('button');
                    pageBtn.className = 'px-3 py-1 text-sm text-gray-500 hover:text-gray-700';
                    pageBtn.textContent = i;
                    pageBtn.onclick = () => {
                        currentLogsPage = i;
                        loadSystemLogs();
                    };
                    pagination.appendChild(pageBtn);
                }
            }
            
            // 다음 페이지
            if (current < pages) {
                const nextBtn = document.createElement('button');
                nextBtn.className = 'px-3 py-1 text-sm text-gray-500 hover:text-gray-700';
                nextBtn.textContent = '다음';
                nextBtn.onclick = () => {
                    currentLogsPage = current + 1;
                    loadSystemLogs();
                };
                pagination.appendChild(nextBtn);
            }
        }

        // 날짜/시간 포맷팅
        function formatDateTime(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleString('ko-KR');
        }
    </script>
</body>
</html>
