<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플러그인 마켓플레이스</title>
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- 헤더 -->
        <header class="bg-white shadow-sm border-b">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center py-4">
                    <div class="flex items-center">
                        <h1 class="text-2xl font-bold text-gray-900">
                            <i class="fas fa-store text-blue-600 mr-2"></i>
                            플러그인 마켓플레이스
                        </h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <a href="/admin-dashboard" class="text-gray-600 hover:text-gray-900">
                            <i class="fas fa-arrow-left mr-1"></i>
                            대시보드로 돌아가기
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- 메인 컨텐츠 -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- 검색 및 필터 -->
            <div class="mb-8">
                <div class="flex flex-col sm:flex-row gap-4">
                    <div class="flex-1">
                        <div class="relative">
                            <input type="text" id="searchInput" placeholder="플러그인 검색..." 
                                   class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <select id="categoryFilter" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="">모든 카테고리</option>
                            <option value="ai">AI & 분석</option>
                            <option value="automation">자동화</option>
                            <option value="qsc">QSC 관리</option>
                            <option value="schedule">스케줄 관리</option>
                            <option value="inventory">재고 관리</option>
                        </select>
                        <select id="sortFilter" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="popular">인기순</option>
                            <option value="newest">최신순</option>
                            <option value="rating">평점순</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 플러그인 그리드 -->
            <div id="pluginGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- 플러그인 카드들이 여기에 동적으로 로드됩니다 -->
            </div>

            <!-- 로딩 상태 -->
            <div id="loadingState" class="text-center py-12">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
                <p class="mt-4 text-gray-600">플러그인을 불러오는 중...</p>
            </div>

            <!-- 빈 상태 -->
            <div id="emptyState" class="text-center py-12 hidden">
                <i class="fas fa-search text-4xl text-gray-400 mb-4"></i>
                <h3 class="text-lg font-medium text-gray-900 mb-2">플러그인을 찾을 수 없습니다</h3>
                <p class="text-gray-600">다른 검색어나 필터를 시도해보세요.</p>
            </div>
        </main>
    </div>

    <!-- 플러그인 상세 모달 -->
    <div id="pluginModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                <div class="p-6">
                    <div class="flex justify-between items-start mb-4">
                        <h2 id="modalTitle" class="text-xl font-bold text-gray-900"></h2>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                            <i class="fas fa-times text-xl"></i>
                        </button>
                    </div>
                    <div id="modalContent">
                        <!-- 플러그인 상세 정보가 여기에 로드됩니다 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 플러그인 데이터
        let plugins = [];
        let filteredPlugins = [];

        // 페이지 로드 시 플러그인 로드
        document.addEventListener('DOMContentLoaded', function() {
            loadPlugins();
            setupEventListeners();
        });

        // 플러그인 로드
        async function loadPlugins() {
            try {
                const response = await fetch('/api/plugin/categories');
                const data = await response.json();
                
                if (data.success) {
                    plugins = data.plugins || [];
                    filteredPlugins = [...plugins];
                    renderPlugins();
                } else {
                    showEmptyState();
                }
            } catch (error) {
                console.error('플러그인 로드 실패:', error);
                showEmptyState();
            }
        }

        // 플러그인 렌더링
        function renderPlugins() {
            const grid = document.getElementById('pluginGrid');
            const loadingState = document.getElementById('loadingState');
            const emptyState = document.getElementById('emptyState');

            loadingState.classList.add('hidden');

            if (filteredPlugins.length === 0) {
                emptyState.classList.remove('hidden');
                grid.innerHTML = '';
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = filteredPlugins.map(plugin => `
                <div class="bg-white rounded-lg shadow-md hover:shadow-lg transition-shadow duration-200">
                    <div class="p-6">
                        <div class="flex items-start justify-between mb-4">
                            <div class="flex items-center">
                                <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center mr-3">
                                    <i class="${plugin.icon || 'fas fa-puzzle-piece'} text-blue-600 text-xl"></i>
                                </div>
                                <div>
                                    <h3 class="text-lg font-semibold text-gray-900">${plugin.display_name}</h3>
                                    <p class="text-sm text-gray-500">${plugin.author}</p>
                                </div>
                            </div>
                            <div class="flex items-center space-x-1">
                                <i class="fas fa-star text-yellow-400"></i>
                                <span class="text-sm text-gray-600">${plugin.rating || 0}</span>
                            </div>
                        </div>
                        
                        <p class="text-gray-600 text-sm mb-4 line-clamp-2">${plugin.description || '설명이 없습니다.'}</p>
                        
                        <div class="flex items-center justify-between mb-4">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                                ${plugin.category || '기타'}
                            </span>
                            <span class="text-sm text-gray-500">v${plugin.version || '1.0.0'}</span>
                        </div>
                        
                        <div class="flex space-x-2">
                            <button onclick="viewPluginDetails(${plugin.id})" 
                                    class="flex-1 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                                상세보기
                            </button>
                            <button onclick="installPlugin(${plugin.id})" 
                                    class="flex-1 bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition-colors">
                                설치
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 이벤트 리스너 설정
        function setupEventListeners() {
            const searchInput = document.getElementById('searchInput');
            const categoryFilter = document.getElementById('categoryFilter');
            const sortFilter = document.getElementById('sortFilter');

            searchInput.addEventListener('input', filterPlugins);
            categoryFilter.addEventListener('change', filterPlugins);
            sortFilter.addEventListener('change', filterPlugins);
        }

        // 플러그인 필터링
        function filterPlugins() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const sortBy = document.getElementById('sortFilter').value;

            filteredPlugins = plugins.filter(plugin => {
                const matchesSearch = plugin.display_name.toLowerCase().includes(searchTerm) ||
                                    plugin.description.toLowerCase().includes(searchTerm);
                const matchesCategory = !category || plugin.category === category;
                return matchesSearch && matchesCategory;
            });

            // 정렬
            switch (sortBy) {
                case 'popular':
                    filteredPlugins.sort((a, b) => (b.download_count || 0) - (a.download_count || 0));
                    break;
                case 'newest':
                    filteredPlugins.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                    break;
                case 'rating':
                    filteredPlugins.sort((a, b) => (b.rating || 0) - (a.rating || 0));
                    break;
            }

            renderPlugins();
        }

        // 플러그인 상세보기
        async function viewPluginDetails(pluginId) {
            try {
                const response = await fetch(`/api/plugin/${pluginId}`);
                const data = await response.json();
                
                if (data.success) {
                    const plugin = data.plugin;
                    document.getElementById('modalTitle').textContent = plugin.display_name;
                    document.getElementById('modalContent').innerHTML = `
                        <div class="space-y-4">
                            <div>
                                <h4 class="font-semibold text-gray-900 mb-2">설명</h4>
                                <p class="text-gray-600">${plugin.description || '설명이 없습니다.'}</p>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <h4 class="font-semibold text-gray-900 mb-2">개발자</h4>
                                    <p class="text-gray-600">${plugin.author}</p>
                                </div>
                                <div>
                                    <h4 class="font-semibold text-gray-900 mb-2">버전</h4>
                                    <p class="text-gray-600">${plugin.version}</p>
                                </div>
                                <div>
                                    <h4 class="font-semibold text-gray-900 mb-2">카테고리</h4>
                                    <p class="text-gray-600">${plugin.category}</p>
                                </div>
                                <div>
                                    <h4 class="font-semibold text-gray-900 mb-2">평점</h4>
                                    <p class="text-gray-600">${plugin.rating || 0}/5</p>
                                </div>
                            </div>
                            <div class="flex space-x-2 pt-4">
                                <button onclick="installPlugin(${plugin.id})" 
                                        class="flex-1 bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
                                    설치하기
                                </button>
                                <button onclick="closeModal()" 
                                        class="flex-1 bg-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-400">
                                    닫기
                                </button>
                            </div>
                        </div>
                    `;
                    document.getElementById('pluginModal').classList.remove('hidden');
                }
            } catch (error) {
                console.error('플러그인 상세 정보 로드 실패:', error);
                alert('플러그인 정보를 불러오는데 실패했습니다.');
            }
        }

        // 플러그인 설치
        async function installPlugin(pluginId) {
            try {
                const response = await fetch('/api/plugin/install', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ plugin_id: pluginId })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('플러그인이 성공적으로 설치되었습니다!');
                    closeModal();
                } else {
                    alert('플러그인 설치에 실패했습니다: ' + (data.message || '알 수 없는 오류'));
                }
            } catch (error) {
                console.error('플러그인 설치 실패:', error);
                alert('플러그인 설치 중 오류가 발생했습니다.');
            }
        }

        // 모달 닫기
        function closeModal() {
            document.getElementById('pluginModal').classList.add('hidden');
        }

        // 빈 상태 표시
        function showEmptyState() {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('emptyState').classList.remove('hidden');
            document.getElementById('pluginGrid').innerHTML = '';
        }

        // 모달 외부 클릭 시 닫기
        document.getElementById('pluginModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
